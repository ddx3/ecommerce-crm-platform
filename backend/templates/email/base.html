<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site_name }}</title>
</head>
<body style="margin:0;padding:0;background:{% if pdf %}#ffffff{% else %}#f3f4f6{% endif %};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;color:#374151">
<table width="100%" cellpadding="0" cellspacing="0" style="background:{% if pdf %}#ffffff{% else %}#f3f4f6{% endif %};padding:{% if pdf %}0{% else %}40px 16px{% endif %}">
  <tr><td align="center">
    <table width="100%" style="max-width:560px;background:#fff{% if not pdf %};border-radius:6px;overflow:hidden;border:1px solid #e5e7eb{% endif %}">

      <!-- Header -->
      <tr>
        <td style="background:#1a5c2a;padding:24px 32px{% if not pdf %};border-radius:6px 6px 0 0{% endif %}">
          <a href="{{ site_url }}" style="text-decoration:none;color:#fff;font-size:18px;font-weight:700">{{ site_name }}</a>
        </td>
      </tr>

      <!-- Content -->
      <tr>
        <td style="padding:32px">
          {% block content %}{% endblock %}
        </td>
      </tr>

      <!-- Footer -->
      <tr>
        <td style="padding:20px 32px;border-top:1px solid #f3f4f6;text-align:center{% if not pdf %};border-radius:0 0 6px 6px{% endif %}">
          <p style="margin:0 0 10px 0;font-size:13px;color:#6b7280">
            Questions? Call us: <a href="tel:+380000000000" style="color:#374151;text-decoration:none;font-weight:600">+380000000000</a>
          </p>
          <p style="margin:0;font-size:12px;color:#9ca3af">© {{ site_name }}&nbsp;&nbsp;&nbsp;<a href="{{ site_url }}" style="color:#9ca3af;text-decoration:none">magiyaroslyn.com</a></p>
        </td>
      </tr>

    </table>
  </td></tr>
</table>
</body>
</html>
