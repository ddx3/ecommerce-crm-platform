{% load i18n %}
{% if action_form and actions_on_top and cl.show_admin_actions %}
<div class="actions" style="display:none">
  {% for field in action_form %}{{ field }}{% endfor %}
  <button type="submit" id="real-delete-btn" name="index" value="{{ action_index|default:0 }}"></button>
  {% if actions_selection_counter %}
  <span class="action-counter" data-actions-icnt="{{ cl.result_list|length }}"></span>
  <span class="all hidden"></span>
  <span class="question hidden"><a href="#"></a></span>
  <span class="clear hidden"><a href="#"></a></span>
  {% endif %}
</div>
{% endif %}
