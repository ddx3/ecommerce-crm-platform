{% extends "admin/change_list.html" %}
{% block pagination %}{% endblock %}
{% block result_list %}
{{ block.super }}
<style>
#result_list { display: none !important; }
#toolbar { display: none !important; }
.results { display: none !important; }
#or-table.or-loading { opacity: .55; transition: opacity .1s; pointer-events: none; }

/* ── Table ── */
#or-table { table-layout: auto; width: 100%; border-collapse: collapse !important; border-top: none !important; --hairline-color: transparent; }
#or-table td, #or-table th { border-top: none !important; }
#or-table thead th { border-bottom: 1px solid #e5e7eb !important; }
#or-table thead tr th {
    background: #f9fafb !important; border-bottom: 1px solid #e5e7eb !important;
    border-left: 1px solid #e5e7eb !important; padding: 10px 12px !important;
    font-size: 10px !important; font-weight: 700 !important; text-transform: uppercase !important;
    letter-spacing: 0.4px !important; color: #6b7280 !important; white-space: nowrap !important;
    vertical-align: middle !important; text-align: left !important;
}
#or-table thead tr th:first-child { border-left: none !important; }
#or-table thead tr th.col-cb { padding: 0 0 0 14px !important; width: 44px !important; }
th[data-col] { cursor: pointer !important; user-select: none !important; position: relative !important; }
#or-table thead tr th[data-col] { padding-right: 26px !important; }
/* The Status and Payment columns — exactly the button width + padding (12*2). */
#or-table th[data-col="status"]  { width: calc(var(--or-status-w, 110px) + 24px); }
#or-table th[data-col="payment"] { width: calc(var(--or-pay-w, 110px) + 24px); }
#or-table thead tr th[data-col]:hover, #or-table thead tr th[data-col].col-open { color: #1f2937 !important; }
#or-table thead tr th[data-col].col-on { background: #d1d5db !important; color: #1f2937 !important; }
.th-badge { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; pointer-events: none; }

#or-table tbody tr { border-bottom: 1px solid #e5e7eb !important; height: 55px !important; }
#or-table.tbl-touches-pager tbody tr:last-child { border-bottom: none !important; }
#or-table tbody tr.row1 { background: #fff !important; }
#or-table tbody tr.row2 { background: #f9fafb !important; }
#or-table tbody tr:hover { background: #eef0f3 !important; }
#or-table tbody tr.or-pinned, #or-table tbody tr.or-pinned:hover { background: #eff6ff !important; }
#or-table tbody tr.or-pinned-last td { border-bottom: 2px solid #d1d5db !important; }
/* Highlighting of orders with dropshipping / 50-50 — a colored stripe on the left. */
#or-table tbody tr.or-hasdrop td.col-cb { box-shadow: inset 3px 0 0 0 #f59e0b !important; }
#or-table tbody tr.or-hascourse td.col-cb { box-shadow: inset 3px 0 0 0 #2563eb !important; }
/* If an order has both dropshipping and a course, show both stripes side by side (3px dropshipping + 3px course). */
#or-table tbody tr.or-hasdrop.or-hascourse td.col-cb { box-shadow: inset 3px 0 0 0 #f59e0b, inset 6px 0 0 0 #2563eb !important; }

#or-table tbody tr.or-empty-row, #or-table tbody tr.or-empty-row:hover { background: #fff !important; cursor: default !important; border-bottom: 1px solid #e5e7eb !important; }
#or-table tbody tr.or-empty-row td { border-bottom: 1px solid #e5e7eb !important; vertical-align: middle !important; text-align: center !important; padding: 0 !important; color: #9ca3af !important; font-size: 13px !important; }
table.tbl-touches-pager tbody tr.or-empty-row, table.tbl-touches-pager tbody tr.or-empty-row td { border-bottom: 1px solid #e5e7eb !important; }
#or-table tbody td {
    padding: 0 12px !important; font-size: 13px !important; vertical-align: middle !important;
    border-left: 1px solid #e5e7eb !important; border-bottom: none !important;
    font-weight: 400 !important; color: #374151 !important; text-align: left !important;
    overflow: hidden !important; height: 55px !important; box-sizing: border-box !important;
}
#or-table tbody td:first-child { border-left: none !important; }
#or-table td { white-space: nowrap; }
#or-table .col-num { font-weight: 500; color: #374151; }
#or-table .col-client { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 140px; max-width: 220px; }
#or-table .col-comm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 140px; max-width: 240px; font-size: 13px; }
/* Comment/source — up to 2 lines (on both PC and Mac); longer text is cut with "…",
   clicking expands the full text.
 */
#or-table td.col-comm .or-cell-clamp {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; white-space: normal; word-break: break-word; line-height: 1.45;
    padding: 0 4px 1px 4px;   /* safety zone: the left leg of letters like "y" and glyph descenders are not clipped by overflow */
}
/* Less padding in the cell (8px) — the span takes the other 4px as a safety zone; the total
   text indent stays 12px (aligned with the header).
 */
#or-table tbody td.col-comm { padding-left: 8px !important; padding-right: 8px !important; }
/* Delivery — absorbs all the remaining free width (stretches as far as possible):
   type on 1 line, address on the 2nd line (fully visible on a wide column).
 */
#or-table td.col-delivery, #or-table th[data-col="delivery"] { width: auto !important; max-width: none !important; }
#or-table td.col-delivery { white-space: normal !important; word-break: break-word !important; }
#or-table td.col-delivery .col-delivery-inner {
    display: -webkit-box !important; -webkit-line-clamp: 2 !important; -webkit-box-orient: vertical !important;
    overflow: hidden !important; white-space: normal !important; line-height: 1.45 !important;
}
#or-table td.col-delivery .col-delivery-inner > span:first-child { white-space: nowrap !important; }
/* Widths of the Number / Amount / Client / Date columns — width:1% + nowrap: the column
   shrinks TIGHT to the longest content on the page (minimum dynamic
   width). GLOBALLY (also on a wide screen >1440) — otherwise they stretched across everything.
   The zoom tier (≤1440) has its own copies with the same values.
 */
#or-table td.col-num,       #or-table th[data-col="num"]    { width: 1% !important; min-width: 0 !important; white-space: nowrap !important; }
#or-table thead tr th[data-col="num"] { padding-right: 12px !important; }
#or-table td.or-order-cell, #or-table th[data-col="price"]  { width: 1% !important; white-space: nowrap !important; }
#or-table thead tr th[data-col="price"] { padding-right: 11px !important; padding-left: 11px !important; }
#or-table td.or-order-cell { text-align: left !important; }
#or-table td.col-client,    #or-table th[data-col="client"] { width: 1% !important; white-space: nowrap !important; }
#or-table td.col-date,      #or-table th[data-col="date"]   { width: 1% !important; white-space: nowrap !important; }
/* Client comment / Manager comment / Source — ALL THREE the same width =
   fit to the longest header (so the headers are on ONE line). JS computes the width
   (_setCommentColsUniform → --cw-all). Content is cut to 2 lines (click
   expands). Delivery takes the remaining free width.
 */
#or-table td.col-comm { min-width: 0 !important; }
#or-table th[data-col="comm_client"],  #or-table td.col-comm-client,
#or-table th[data-col="comm_manager"], #or-table td.col-comm-manager,
#or-table th[data-col="source"],       #or-table td.col-source { width: var(--cw-all, 168px) !important; max-width: var(--cw-all, 168px) !important; }
#or-table thead tr th[data-col="comm_client"],
#or-table thead tr th[data-col="comm_manager"],
#or-table thead tr th[data-col="source"] { white-space: nowrap !important; padding-right: 16px !important; }
/* ── LARGE SCREEN (>1440, no zoom): lots of free space. Delivery — FIT TO TEXT
   (--dw, computed by JS _fitDeliveryCol), and all the remainder goes to comments/source
   (width:auto, min = header width). On a Mac (≤1440) it stays as it was. ──
 */
@media (min-width: 1441px) {
  #or-table td.col-delivery, #or-table th[data-col="delivery"] { width: var(--dw, 240px) !important; max-width: var(--dw, 240px) !important; }
  #or-table th[data-col="comm_client"],  #or-table td.col-comm-client,
  #or-table th[data-col="comm_manager"], #or-table td.col-comm-manager,
  #or-table th[data-col="source"],       #or-table td.col-source { width: var(--cw-eq, auto) !important; min-width: var(--cw-all, 140px) !important; max-width: none !important; }
}
#or-table .col-comm-manager { color: #1d4ed8; cursor: text; }
.cm-saving { opacity: .55; }
/* The "Source" column — like the manager comment, but plain dark text (not blue),
   so the manager doesn't confuse the source with a comment.
 */
#or-table .col-source { color: #374151; cursor: text; }
#or-table .col-cb { width: 44px !important; min-width: 44px !important; max-width: 44px !important; padding: 0 0 0 14px !important; }

/* ── Expanded comment/source: part of the cell slides DOWN over the row
   below. Same width (left:0/right:0), white background, NO border/shadow/separate
   window — just a continuation of the cell. Rows don't jump (overlay, doesn't push). ──
 */
/* The expanded comment/source slides DOWN from where the collapsed text was
   (top is set by JS = the row position). The text stays vertically centered and
   doesn't jump up. Same width, white background, no border/shadow.
 */
#or-table td.col-comm-client.cc-open,
#or-table td.col-comm-manager.is-editing,
#or-table td.col-source.is-editing { overflow: visible !important; position: relative !important; z-index: 30 !important; }
/* The client comment (read-only) expands via the same .ce-edit/.ce-abs mechanism
   as the editors (1 line — in flow, zero shift; multi-line — overlay).
   Only an arrow cursor, since it can't be edited.
 */
#or-table td.col-comm.col-comm-client .or-cell-clamp.ce-edit { cursor: pointer !important; }
/* contenteditable editor: the same span becomes editable (no swap to a
   textarea → zero shift). 1 line stays in flow; for multi-line JS makes
   .ce-abs (absolute over the row below, background = row color).
 */
#or-table td.col-comm .or-cell-clamp.ce-edit {
    display: block !important; -webkit-line-clamp: unset !important;
    white-space: normal !important; word-break: break-word !important;
    overflow: visible !important; outline: none !important; cursor: text !important;
    line-height: 1.45 !important;
}
#or-table td.col-comm .or-cell-clamp.ce-edit.ce-abs {
    position: absolute !important; left: 0 !important; right: 0 !important;
    padding-left: 12px !important; padding-right: 12px !important; /* = td horizontal padding */
    /* vertical padding is set by JS — symmetric (top = bottom around the text) */
    background: var(--ovl-bg, #fff) !important; z-index: 31 !important;
}
/* Divider line on the edge toward which the overlay slides (box-shadow — no layout shift):
   down → line at the bottom, up → line at the top. Color = the table grid color, otherwise it
   reads as a border of a "window". We do NOT draw the row's top line — the overlay simply
   doesn't overlap it (JS keeps top >= 0).
 */
#or-table td.col-comm .or-cell-clamp.ce-abs.ovl-down { box-shadow: 0 1px 0 0 #e5e7eb !important; }
#or-table td.col-comm .or-cell-clamp.ce-abs.ovl-up   { box-shadow: 0 -1px 0 0 #e5e7eb !important; }
/* Overlay background color = row color (zebra + hover), via a CSS variable
   inherited from <tr> and updated live (including on hover).
 */
#or-table tbody tr.row1 { --ovl-bg: #fff; }
#or-table tbody tr.row2 { --ovl-bg: #f9fafb; }
#or-table tbody tr:hover { --ovl-bg: #eef0f3; }
#or-table tbody tr.or-pinned, #or-table tbody tr.or-pinned:hover { --ovl-bg: #eff6ff; }

/* ── Status / Pay inline pickers ── */
.or-picker-btn {
    display: inline-flex; align-items: center;
    height: 26px; padding: 0 10px;
    border: 1px solid #d1d5db; border-radius: 4px;
    background: transparent; cursor: pointer; font-size: 12px; font-weight: 500;
    color: #374151; font-family: inherit; white-space: nowrap;
    box-sizing: border-box; outline: none;
}
.or-picker-btn[data-field="status"]         { width: var(--or-status-w, 110px); }
.or-picker-btn[data-field="payment_status"] { width: var(--or-pay-w, 110px); }
.or-picker-btn:hover { border-color: #9ca3af; background: #fff; }
.or-picker-btn[data-val="new"]        { background-color: #f3f4f6; border-color: #e5e7eb; color: #6b7280; }
.or-picker-btn[data-val="processing"] { background-color: #fef3c7; border-color: #fde68a; color: #92400e; }
.or-picker-btn[data-val="shipped"]    { background-color: #dbeafe; border-color: #bfdbfe; color: #1e40af; }
.or-picker-btn[data-val="delivered"]  { background-color: #dcfce7; border-color: #bbf7d0; color: #166534; }
.or-picker-btn[data-val="cancelled"]  { background-color: #fee2e2; border-color: #fecaca; color: #991b1b; }
.or-picker-btn[data-val="pending"]    { background-color: #f3f4f6; border-color: #e5e7eb; color: #6b7280; }
.or-picker-btn[data-val="paid"]       { background-color: #dcfce7; border-color: #bbf7d0; color: #166534; }
.or-picker-btn[data-val="new"]:hover,
.or-picker-btn[data-val="processing"]:hover,
.or-picker-btn[data-val="shipped"]:hover,
.or-picker-btn[data-val="delivered"]:hover,
.or-picker-btn[data-val="cancelled"]:hover,
.or-picker-btn[data-val="pending"]:hover,
.or-picker-btn[data-val="paid"]:hover { filter: brightness(0.95); }
.or-picker-btn svg { flex-shrink: 0; }
.or-picker-popup {
    position: fixed; z-index: 99999; background: #fff;
    border: 1px solid #e5e7eb; border-radius: 6px;
    box-shadow: 0 4px 12px rgba(0,0,0,.10);
    padding: 0; overflow: hidden;
}
/* Popup of the same width as the button — fit to the longest label. */
.or-picker-popup.or-picker-popup-status         { width: var(--or-status-w, 110px); min-width: 0; }
.or-picker-popup.or-picker-popup-payment_status { width: var(--or-pay-w, 110px); min-width: 0; }
.or-picker-item {
    padding: 7px 10px; font-size: 12px; color: #374151;
    cursor: pointer; white-space: nowrap;
}
.or-picker-item:hover { background: #f9fafb; }
.or-picker-item.active { font-weight: 600; color: #111827; }

/* ── Popover ── */
#or-flt-pop {
    display: none; position: fixed; z-index: 9999; background: #fff;
    border: 1px solid #e5e7eb; border-radius: 0 0 6px 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,.18);
    overflow: hidden;
    width: 500px;
}
#or-flt-pop.open { display: block; }
.fp-sort-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; border-bottom: 1px solid #ececec;
    background: #fff; color: #374151; font-size: 13px;
    cursor: pointer; width: 100%; text-align: left;
    border-left: none; border-right: none; border-top: none;
}
.fp-sort-row:last-of-type { border-bottom: 1px solid #e5e7eb; }
.fp-sort-row:hover { background: #f5f5f5; }
.fp-sort-row.on { background: #e5e7eb; color: #374151; }
.fp-sort-arr { color: #d1d5db; font-size: 18px; line-height: 1; flex-shrink: 0; display: inline-flex; align-items: center; }
.fp-sort-row.on .fp-sort-arr { color: #374151; }
.fp-pop-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.fp-filter-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: #9ca3af; margin-bottom: 6px; }
.fp-pills { display: flex; gap: 3px; flex-wrap: wrap; }
.fp-pill { padding: 3px 8px; border: 1px solid #d1d5db; border-radius: 20px; font-size: 11px; color: #6b7280; cursor: pointer; background: #fff; user-select: none; }
.fp-pill:hover { background: #f9fafb; color: #374151; }
.fp-pill.on { background: #1f2937; border-color: #1f2937; color: #fff; }
.fp-search { width: 100%; box-sizing: border-box; height: 28px; padding: 0 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; outline: none; margin-bottom: 0; }
.fp-search:focus { border-color: #9ca3af; }
.fp-item { display: flex; align-items: center; gap: 6px; padding: 0; font-size: 13px; line-height: 1; color: #374151; }
.fp-list .fp-item { border-radius: 0; }
.fp-item input[type=radio],
.fp-item input[type=checkbox] {
    appearance: none; -webkit-appearance: none;
    width: 14px; height: 14px; flex-shrink: 0;
    border: 1.5px solid #d1d5db; background: #fff; cursor: pointer; position: relative;
    margin: 0;
    transition: background .12s, border-color .12s;
}
.fp-item input[type=radio] { border-radius: 50%; }
.fp-item input[type=checkbox] { border-radius: 3px; }
.fp-item input[type=radio]:hover,
.fp-item input[type=checkbox]:hover { border-color: #9ca3af; }
.fp-item input[type=radio]:checked,
.fp-item input[type=checkbox]:checked { background: #1f2937; border-color: #1f2937; }
.fp-item input[type=radio]:checked::after,
.fp-item input[type=checkbox]:checked::after {
    content: ''; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px;
    border: 1.5px solid #fff; border-top: none; border-left: none; transform: rotate(45deg);
}
.fp-range { display: flex; align-items: center; gap: 4px; height: 28px; }
.fp-range input { flex: 1; min-width: 0; width: 0; height: 28px; padding: 0 6px; margin: 0; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; outline: none; box-sizing: border-box; }
.fp-range input:focus { border-color: #9ca3af; }
.fp-range-sep { font-size: 0; color: transparent; width: 8px; height: 1px; background: #9ca3af; align-self: center; flex-shrink: 0; margin-top: -1px; }
.fp-divider { height: 1px; background: #e5e7eb; margin: 0 -10px; }
.fp-clear { display: block; margin-top: 8px; padding: 0; border: none; background: none; font-size: 11px; color: #9ca3af; cursor: pointer; text-align: left; }
.fp-clear:hover { color: #dc2626; }

/* ── Calendar ── */
.cal-nav { display:flex; align-items:center; justify-content:space-between; padding:8px 10px 4px; }
.cal-nav-btn { background:#f9fafb; border:1px solid #d1d5db; border-radius:4px; width:26px; height:26px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:#374151; font-size:16px; line-height:1; padding:0; flex-shrink:0; transition:background .1s,border-color .1s; }
.cal-nav-btn:hover { background:#e5e7eb; border-color:#9ca3af; color:#111; }
.cal-nav-btn:active { background:#d1d5db; }
.cal-title { font-size:12px; font-weight:600; color:#374151; text-align:center; flex:1; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); padding:0 6px 0; }
.cal-dow { font-size:10px; color:#9ca3af; text-align:center; padding:2px 0 5px; font-weight:600; }
.cal-day { font-size:12px; text-align:center; padding:5px 0; cursor:pointer; color:#374151; user-select:none; border-radius:4px; transition:background .1s; }
.cal-day.empty { cursor:default; pointer-events:none; }
.cal-day:not(.empty):not(.sel-start):not(.sel-end):hover { background:#d1d5db; }
.cal-day.today { font-weight:700; color:#111; }
.cal-day.sel-start, .cal-day.sel-end { background:#1f2937; color:#fff; border-radius:4px; }
.cal-day.sel-start:hover, .cal-day.sel-end:hover { background:#374151; }
.cal-day.in-range { background:#e5e7eb; border-radius:0; }
.cal-day.in-range:hover { background:#d1d5db; }
.cal-day.sel-start.has-range { border-radius:4px 0 0 4px; }
.cal-day.sel-end.has-range   { border-radius:0 4px 4px 0; }
.cal-reset { display:block; text-align:center; padding:0 10px 10px; font-size:11px; color:#9ca3af; cursor:pointer; background:none; border:none; width:100%; }
.cal-reset:hover { color:#dc2626; }

/* ── Pager ── */
#or-pager {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-top: 1px solid #e5e7eb;
    position: fixed; bottom: 0; right: 0; background: #fff; z-index: 1000;
}
#or-pager .pager-info { font-size: 12px; color: #9ca3af; }
#or-pager .pager-nav { display: flex; align-items: center; gap: 4px; }
#or-pager .pg-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0; border: 1px solid #d1d5db;
    border-radius: 4px; background: #fff; color: #374151;
    font-size: 13px; cursor: pointer; user-select: none; text-decoration: none !important; box-sizing: border-box;
}
#or-pager .pg-btn:hover { background: #f3f4f6; border-color: #d1d5db; }
#or-pager .pg-btn.pg-active { background: #1f2937; color: #fff; border-color: #1f2937; }
#or-pager .pg-btn.pg-disabled { opacity: 0.35; pointer-events: none; }
#or-pager .pager-nav .pg-dots { padding: 0 2px; color: #9ca3af; font-size: 12px; line-height: 28px; }
#or-pager .pager-size { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #9ca3af; }
#or-pager .pager-size .pg-btn { width: auto; min-width: 36px; padding: 0 8px; }
#content-main, #content { padding-bottom: 0 !important; }

/* ── Order items popup ── */
#or-order-pop { display:none; position:fixed; z-index:9999; background:#fff; border:1px solid #e5e7eb; border-radius:0 0 6px 6px; box-shadow:0 6px 16px rgba(0,0,0,.18); padding:0; min-width:300px; max-width:90vw; width:max-content; max-height:70vh; overflow-x:hidden; overflow-y:auto; }
#or-order-pop.open { display:block; }
/* Expanded upward (didn't fit below): rounded corners on top, shadow upward. */
#or-order-pop.flip-up { border-radius:6px 6px 0 0; box-shadow:0 -6px 16px rgba(0,0,0,.18); }
.or-order-cell.has-items .or-order-cnt { color:#9ca3af; font-size:11px; }
/* A hint that the cell can be clicked: a solid line under the block on hover.
   border-bottom (not text-decoration) — the line sits below the glyphs, doesn't collide with
   parentheses.
   A transparent border by default reserves the space — the text doesn't jump on hover.
 */
.or-order-cell.has-items .or-order-line { display:inline-block; line-height:1.2; cursor:pointer; }
/* Hover/cursor — only on the amount text itself, not on the whole cell. */
.or-order-cell.has-items .or-order-line:hover { text-decoration:underline; text-decoration-color:#9ca3af; text-underline-offset:3px; }

/* ── Client cell — clicking the value copies it (no popup and no buttons) ── */

 */

/* Value sized to the text width (not the whole cell) — so the hover/copy cursor applies

/* Click-to-copy of client values — via the global .copy-on-click (base_site). */

/* "Open on site" — a square button zone on the left with a vertical divider.

 */

.oop-site:hover { color:#374151 !important; }

/* Name + price on one line (price at the top right); SKU/quantity on the line below. */
.oop-name-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.oop-name-row .oop-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }

.oop-photo-wrap { position:relative; flex-shrink:0; width:32px; height:32px; }

/* align-self:stretch + space-between → name at the top edge of the photo, SKU/qty at the bottom edge. */
.oop-info { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between; align-self:stretch; gap:0; }
/* line-height:1 keeps the text at the top edge of the photo; padding-bottom leaves room

/* ── Export modal — shared styles (single source with change_form) ── */

/* ── RESPONSIVE for MacBook 13"/14": the orders table physically does not fit
   in ~1070–1270px. Secondary columns are hidden by tiers (visible in the order
   card). Font and row height unchanged. Mobile (≤1024) is left
   untouched — there it scrolls horizontally with all columns. ──
 */
@media (min-width: 1025px) and (max-width: 1440px) {
  /* ── Column widths for 13" ──────────────────────────────────────
     Number / Order / Customer — width:1% + nowrap → shrink tight
       to their widest text on the page (symmetric padding).
     Status / Payment (sized for the picker in base) / Date — fixed.
     Delivery — sized for "Nova Poshta" (type on 1 line, address clipped on the 2nd).
     Comments + Source — NO width: they absorb all the remaining width.
   */

  /* Number: width:1% + nowrap → the column shrinks tight to the widest number
     on the page (narrow without OLD; wider with OLD). The "#" header is short, so
     the data dictates the width.

  #or-table thead tr th[data-col="num"] { padding-right: 12px !important; }  /* "#" is short — smaller reserve for the badge */
  #or-table td.or-order-cell, #or-table th[data-col="price"]  { width: 1% !important; white-space: nowrap !important; }
  /* The "Order" header stretched the column with extra right padding (26px for the

  #or-table td.col-delivery { white-space: normal !important; word-break: break-word !important; }
  #or-table td.col-delivery .col-delivery-inner {

    -webkit-box-orient: vertical !important;

    line-height: 1.45 !important;
  }
  #or-table td.col-delivery .col-delivery-inner > span:first-child { white-space: nowrap !important; }

  /* Comments + Source — absorb free space (no explicit width).

  #or-table td.col-comm .or-cell-clamp {
    display: -webkit-box !important;

    overflow: hidden !important;

    word-break: break-word !important;

  }
  #or-table thead tr th[data-col="comm_client"],

}

<script>
(function(){
/* allData — the CURRENT page only (filtering/sorting/pagination happen on the server).
   srvMeta — page metadata (total/num_pages/page/page_size).
   selectedData — cache of full objects of the selected orders (may come from different
   pages) — for rendering pinned rows and for export.
 */
var allData = {{ orders_json|safe }};
var srvMeta = {{ orders_meta_json|safe }};
var selectedData = {};

var F = {numMode:'exact', numExact:'', numFrom:'', numTo:'', clientQ:'', statuses:[], payment:'all', delivery:'all', dateMin:null, dateMax:null, priceMin:null, priceMax:null, commClient:'all', commManager:'all', commSource:'all', selectedItems:[], itemsMode:'and', drops:[], imported:'all'};

/* Full list of products (the entire orders catalog) — used ONLY when
   searching. Without a search the popup shows only products from the current page's rows.
 */
var allOrderItems = ({{ items_facet_json|safe }}).slice().sort(function(a,b){ return a.name.localeCompare(b.name,'uk'); });

/* Find an order object among the current page or among the selected ones. */
function findOrder(id){
    id = parseInt(id,10);
    for(var i=0;i<allData.length;i++){ if(allData[i].id===id) return allData[i]; }
    return selectedData[id] || null;
}

function calcFilteredQty(){
    var qty = {};
    currentFiltered.forEach(function(o){
        (o.items||[]).forEach(function(it){
            var k = (it.name||'').toLowerCase();
            if(k) qty[k] = (qty[k]||0) + (it.qty||1);
            if(it.is_bundle && it.bundle_items){
                it.bundle_items.forEach(function(bi){
                    var bk = (bi.name||'').toLowerCase();
                    if(bk) qty[bk] = (qty[bk]||0) + (bi.qty||1);
                });
            }
        });
    });
    return qty;
}
var sortField = null, sortDir = 'asc';
var currentPage = srvMeta.page || 1, pageSize = srvMeta.page_size || 25, currentFiltered = [];
var srvTotal = srvMeta.total || 0, srvPages = srvMeta.num_pages || 1;
var selectedIds = new Set();
var currentPageData = [];
var _fetchSeq = 0, _fetchTimer = null;

/* ── Persisting table state (filters / sorting / page / size) ──
   Stored in localStorage so that when returning to the list (via menu, back,
   "Exit" from the card) the last view is restored. Row selection is not stored here.
 */
var STATE_KEY = 'order_list_state_v1';
function _saveState(){
    try {
        localStorage.setItem(STATE_KEY, JSON.stringify({
            F: F, sortField: sortField, sortDir: sortDir,
            currentPage: currentPage, pageSize: pageSize,
        }));
    } catch(e) {}
}
function _loadState(){
    try {
        var raw = localStorage.getItem(STATE_KEY);
        if(!raw) return false;
        var s = JSON.parse(raw);
        if(s.F) Object.assign(F, s.F);
        if(typeof s.sortField   !== 'undefined') sortField   = s.sortField;
        if(typeof s.sortDir     !== 'undefined') sortDir     = s.sortDir;
        if(typeof s.currentPage !== 'undefined') currentPage = s.currentPage;
        if(typeof s.pageSize    !== 'undefined') pageSize    = s.pageSize;
        return true;
    } catch(e) { return false; }
}

/* Collects GET params from the current filter/sort/page state. */
function buildQuery(){
    var p = new URLSearchParams();
    p.set('_json','1');
    p.set('page', currentPage);
    p.set('page_size', pageSize);
    if(F.numMode==='exact' && F.numExact!==''){ p.set('numMode','exact'); p.set('numExact',F.numExact); }
    else if(F.numMode==='range' && (F.numFrom!==''||F.numTo!=='')){ p.set('numMode','range'); if(F.numFrom!=='')p.set('numFrom',F.numFrom); if(F.numTo!=='')p.set('numTo',F.numTo); }
    if(F.clientQ) p.set('q', F.clientQ);
    if(F.statuses.length) p.set('statuses', F.statuses.join(','));
    if(F.payment!=='all') p.set('payment', F.payment);
    if(F.delivery!=='all') p.set('delivery', F.delivery);
    if(F.imported && F.imported!=='all') p.set('imported', F.imported);
    if(F.dateMin) p.set('dateMin', F.dateMin);
    if(F.dateMax) p.set('dateMax', F.dateMax);
    if(F.priceMin!==null) p.set('priceMin', F.priceMin);
    if(F.priceMax!==null) p.set('priceMax', F.priceMax);
    if(F.commClient!=='all') p.set('commClient', F.commClient);
    if(F.commManager!=='all') p.set('commManager', F.commManager);
    if(F.commSource!=='all') p.set('commSource', F.commSource);
    if(F.drops.length) p.set('drops', F.drops.join(','));
    if(F.selectedItems.length){ p.set('items', F.selectedItems.join('||')); p.set('itemsMode', F.itemsMode); }
    if(sortField){ p.set('sort', sortField); p.set('dir', sortDir); }
    return p.toString();
}

/* Fetches the current page from the server and redraws the table. */
function fetchOrders(){
    /* Cancel any scheduled debounced fetch (updateTable) so that after
       a direct call (pagination/status change) the deferred request doesn't "override"
       the page back to 1 a second later.
     */
    if(_fetchTimer){ clearTimeout(_fetchTimer); _fetchTimer = null; }
    _saveState();
    var seq = ++_fetchSeq;
    if(orTable) orTable.classList.add('or-loading');
    fetch(window.location.pathname + '?' + buildQuery(), {credentials:'same-origin', headers:{'X-Requested-With':'XMLHttpRequest'}})
        .then(function(r){ return r.json(); })
        .then(function(resp){
            if(seq !== _fetchSeq) return;  /* stale response — ignore */
            allData = resp.orders || [];
            srvTotal = resp.total || 0;
            srvPages = resp.num_pages || 1;
            currentPage = resp.page || 1;
            if(orTable) orTable.classList.remove('or-loading');
            renderRows(allData);
        })
        .catch(function(){ if(orTable) orTable.classList.remove('or-loading'); });
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function getCsrf(){ var m=document.cookie.match(/csrftoken=([^;]+)/); return m?m[1]:''; }
function toCmpDate(str){ var m=str&&str.match(/^(\d{2})\.(\d{2})\.(\d{4})/); return m?m[3]+'-'+m[2]+'-'+m[1]:null; }

function applyFilters(data){
    return data.filter(function(o){
        if(F.numMode==='exact' && F.numExact!==''){
            if(String(o.order_number||'')!==String(F.numExact)) return false;
        } else if(F.numMode==='range'){
            var n=parseInt(o.order_number)||0;
            if(F.numFrom!=='' && n<parseInt(F.numFrom)) return false;
            if(F.numTo!==''   && n>parseInt(F.numTo))   return false;
        }
        if(F.clientQ){
            var q=F.clientQ.toLowerCase();
            if((o.customer_name+' '+(o.customer_phone||'')+' '+(o.customer_email||'')).toLowerCase().indexOf(q)===-1) return false;
        }
        if(F.statuses.length && F.statuses.indexOf(o.status)===-1) return false;
        if(F.payment!=='all' && o.payment_status!==F.payment) return false;
        if(F.delivery!=='all' && o.delivery_type!==F.delivery) return false;
        if(F.imported==='new' && o.is_imported) return false;
        if(F.imported==='old' && !o.is_imported) return false;
        if(F.dateMin||F.dateMax){ var d=toCmpDate(o.created_at); if(F.dateMin&&(!d||d<F.dateMin)) return false; if(F.dateMax&&(!d||d>F.dateMax)) return false; }
        if(F.priceMin!==null && parseFloat(o.total_price||0)<F.priceMin) return false;
        if(F.priceMax!==null && parseFloat(o.total_price||0)>F.priceMax) return false;
        if(F.drops.length && F.drops.indexOf(o.drop_status||'none')===-1) return false;
        if(F.commClient==='has'  && !o.comment) return false;
        if(F.commClient==='none' &&  o.comment) return false;
        if(F.commManager==='has'  && !o.manager_comment) return false;
        if(F.commManager==='none' &&  o.manager_comment) return false;
        if(F.commSource==='has'  && !o.source) return false;
        if(F.commSource==='none' &&  o.source) return false;
        if(F.selectedItems.length){
            var matchItem = function(name){
                var nl = name.toLowerCase();
                return (o.items||[]).some(function(it){
                    if((it.name||'').toLowerCase()===nl) return true;
                    if(it.is_bundle && it.bundle_items){
                        return it.bundle_items.some(function(bi){ return (bi.name||'').toLowerCase()===nl; });
                    }
                    return false;
                });
            };
            var ok = F.itemsMode==='and'
                ? F.selectedItems.every(matchItem)
                : F.selectedItems.some(matchItem);
            if(!ok) return false;
        }
        return true;
    });
}

function applySort(data){
    if(!sortField) return data;
    return data.slice().sort(function(a,b){
        var va,vb;
        if(sortField==='order_number'){ va=String(a.order_number||''); vb=String(b.order_number||''); }
        else if(sortField==='customer_name'){ va=(a.customer_name||'').toLowerCase(); vb=(b.customer_name||'').toLowerCase(); }
        else if(sortField==='created_at'){ va=a.created_at||''; vb=b.created_at||''; }
        else if(sortField==='total_price'){ va=parseFloat(a.total_price)||0; vb=parseFloat(b.total_price)||0; }
        else if(sortField==='status'){ va=a.status||''; vb=b.status||''; }
        else if(sortField==='payment_status'){ va=a.payment_status||''; vb=b.payment_status||''; }
        else if(sortField==='delivery_type'){ va=a.delivery_type||''; vb=b.delivery_type||''; }
        else return 0;
        return va<vb?(sortDir==='asc'?-1:1):va>vb?(sortDir==='asc'?1:-1):0;
    });
}

function isColFiltered(col){
    if(col==='num')      return (F.numMode==='exact' && F.numExact!=='') || (F.numMode==='range' && (F.numFrom!==''||F.numTo!=='')) || (F.imported && F.imported!=='all');
    if(col==='client')   return !!F.clientQ;
    if(col==='status')   return F.statuses.length>0;
    if(col==='payment')  return F.payment!=='all';
    if(col==='delivery') return F.delivery!=='all';
    if(col==='date')     return !!(F.dateMin||F.dateMax);
    if(col==='price')    return F.priceMin!==null||F.priceMax!==null||F.selectedItems.length>0||F.drops.length>0;
    if(col==='comm_client')  return F.commClient!=='all';
    if(col==='comm_manager') return F.commManager!=='all';
    if(col==='source')       return F.commSource!=='all';
    return false;
}

function resetCol(col){
    if(col==='num')      { F.numExact=''; F.numFrom=''; F.numTo=''; F.imported='all'; }
    if(col==='client')   F.clientQ='';
    if(col==='status')   F.statuses=[];
    if(col==='payment')  F.payment='all';
    if(col==='delivery') F.delivery='all';
    if(col==='date')     { F.dateMin=null; F.dateMax=null; }
    if(col==='price')    { F.priceMin=null; F.priceMax=null; F.selectedItems=[]; F.itemsMode='and'; F.drops=[]; }
    if(col==='comm_client')  F.commClient='all';
    if(col==='comm_manager') F.commManager='all';
    if(col==='source')       F.commSource='all';
    if(sortField===col){ sortField=null; sortDir='asc'; }
    updateTable();
}

/* ── Popover ── */
var pop = document.getElementById('or-flt-pop');
var popOwner = null;

/* The width of price-popup is computed dynamically for the longest product name in the CURRENT
   list (driven by buildPricePop/renderSug → applyFit), so it is absent from popWidths.
 */
function _measureMaxNameWidth(names){
    var probe = document.createElement('span');
    var bf = getComputedStyle(document.body);
    probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;font-size:12px;font-family:'+bf.fontFamily+';';
    document.body.appendChild(probe);
    var maxW = 0;
    for(var i=0;i<names.length;i++){ probe.textContent = names[i] || ''; if(probe.offsetWidth>maxW) maxW = probe.offsetWidth; }
    document.body.removeChild(probe);
    return maxW;
}
/* maxNameW + img(40) + gap(10) + row-padding(20) + scrollbar(14) + safety(8) = +92.
   Lower bound 380 — so the controls (price/mode/packaging) don't get cramped.
 */
function _priceePopWidth(names){
    var maxW = names.length ? _measureMaxNameWidth(names) : 0;
    return Math.max(380, Math.min(maxW + 92, window.innerWidth - 32));
}
var popWidths = {date: 230};

function openPop(th, buildFn){
    if(popOwner===th && pop.classList.contains('open')){ closePop(); return; }
    if(popOwner) popOwner.classList.remove('col-open');
    popOwner = th;
    pop.innerHTML = '';
    buildFn();
    var resetBar = document.createElement('button'); resetBar.type = 'button';
    resetBar.textContent = 'Reset filter';
    resetBar.style.cssText = 'display:block;width:100%;padding:10px;border:none;border-bottom:1px solid #e5e7eb;background:none;color:#dc2626;font-size:13px;font-weight:500;cursor:pointer;text-align:left;';
    resetBar.addEventListener('click', function(){ resetCol(th.dataset.col); closePop(); });
    resetBar.addEventListener('mouseenter', function(){ this.style.background='#fef2f2'; });
    resetBar.addEventListener('mouseleave', function(){ this.style.background='none'; });
    pop.insertBefore(resetBar, pop.firstChild);
    pop.classList.add('open');
    var r = th.getBoundingClientRect();
    var z = (window.clZoom ? window.clZoom() : 1);
    var pw = popWidths[th.dataset.col];
    if(typeof pw === 'function') pw = pw();
    /* price: the width has already been set by buildPricePop/renderSug (applyFit) to fit product
       names —
       don't override it. The remaining columns — from their own map or default 200.

    if(th.dataset.col !== 'price') pop.style.width = (pw || 200) + 'px';

    function effRange(){
        if(pickStep===2 && hovDate && selStart)
            return hovDate<selStart ? {s:hovDate,e:selStart} : {s:selStart,e:hovDate};
        return {s:selStart, e:selEnd};
    }
    function applyClasses(){
        var r=effRange(), today=new Date();
        grid.querySelectorAll('.cal-day[data-d]').forEach(function(cell){
            var d=calParseYMD(cell.dataset.d);
            var isS=calSameDay(d,r.s), isE=calSameDay(d,r.e);

            if(r.s&&r.e&&!calSameDay(r.s,r.e)&&(isS||isE)) cell.classList.add('has-range');
            if(inR) cell.classList.add('in-range');

        for(var i=0;i<firstDay;i++){ var e=document.createElement('div'); e.className='cal-day empty'; grid.appendChild(e); }
        for(var day=1;day<=daysInMonth;day++){

                }

            cell.addEventListener('mouseleave',function(){ hovDate=null; applyClasses(); });
            grid.appendChild(cell);
        }

    }

function makeOrPicker(opts, currentVal, orderId, field){
    var label = (opts.find(function(o){ return o[0]===currentVal; }) || opts[0])[1];
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'or-picker-btn';
    btn.dataset.id    = orderId;
    btn.dataset.field = field;
    btn.dataset.val   = currentVal;
    btn.innerHTML = '<span>' + esc(label) + '</span>';
    btn.addEventListener('click', function(e){
        e.stopPropagation();
        if(_orPickerBtn===btn){ closeOrPicker(); return; }
        closeOrPicker();
        _orPickerBtn = btn;
        btn.classList.add('open');
        var popup = document.createElement('div');
        popup.className = 'or-picker-popup or-picker-popup-' + field;
        _orPickerPopup = popup;
        opts.forEach(function(op){
            var item = document.createElement('div');
            item.className = 'or-picker-item' + (op[0]===btn.dataset.val ? ' active' : '');
            item.textContent = op[1];
            item.addEventListener('mousedown', function(ev){
                if(ev.button!==0) return;
                ev.preventDefault();
                var id    = parseInt(btn.dataset.id);
                var fld   = btn.dataset.field;
                var oldVal = btn.dataset.val;
                btn.dataset.val = op[0];
                btn.querySelector('span').textContent = op[1];
                closeOrPicker();
                var item2 = findOrder(id);
                if(item2) item2[fld] = op[0];
                /* Roll back the button + in-memory value to the old state. */
                function revert(msg){
                    btn.dataset.val = oldVal;
                    btn.querySelector('span').textContent = (opts.find(function(o){ return o[0]===oldVal; })||opts[0])[1];
                    if(item2) item2[fld] = oldVal;
                    if(msg) alert(msg);
                }
                fetch('/admin/orders/update-field/', {
                    method:'POST', credentials:'same-origin',
                    headers:{'Content-Type':'application/json','X-CSRFToken':getCsrf()},
                    body:JSON.stringify({id:id,field:fld,value:op[0]})
                }).then(function(r){
                    if(r.ok){
                        /* If a filter or sorting by this field is active — re-fetch the
                           page from the server so the row immediately disappears/moves to fit the
                           filter.
                         */
                        var affects = (fld==='status' && (F.statuses.length>0 || sortField==='status'))
                                   || (fld==='payment_status' && (F.payment!=='all' || sortField==='payment_status'));
                        if(affects) fetchOrders();
                        return;
                    }
                    /* The server rejected it (e.g. an invalid status transition) — roll back. */
                    return r.json().then(function(d){ revert(d && d.error ? d.error : 'Could not save'); },
                                         function(){ revert('Could not save'); });
                }).catch(function(){ revert(); });
            });
            popup.appendChild(item);
        });
        popup.addEventListener('mouseleave', function(e){
            var to = e.relatedTarget;
            if(to === btn || (btn && btn.contains(to))) return;
            closeOrPicker();
        });
        var r = btn.getBoundingClientRect();
        var z = (window.clZoom ? window.clZoom() : 1);
        popup.style.left = (r.left / z) + 'px';
        document.body.appendChild(popup);
        popup.style.top  = (window.clFlipTop ? window.clFlipTop(r, popup.offsetHeight, 4) : (r.bottom + 4)) + 'px';
        var pwV = popup.offsetWidth * z;  // visual popup width
        if(r.left + pwV > window.innerWidth - 8) popup.style.left = ((window.innerWidth - pwV - 8) / z) + 'px';
    });
    return btn;
}

/* Positions the popup under the cell; if it doesn't fit below — expands upward
   (popup bottom at the top of the row, rounding/shadow — class .flip-up). The popup must
   already be .open (to measure its size).
 */
function positionDropPop(pop, rect){
    /* rect — visual px (getBoundingClientRect). With body{zoom}, fixed top/left
       are interpreted in zoom-px, so we divide by zoom. offsetH/W are CSS px,
       their visual size = ×zoom.
     */
    var z = (window.clZoom ? window.clZoom() : 1);
    var ph = pop.offsetHeight * z, pw = pop.offsetWidth * z;  // visual
    if(rect.bottom + ph <= window.innerHeight - 8){
        pop.classList.remove('flip-up');
        pop.style.top = (rect.bottom / z) + 'px';
    } else {
        pop.classList.add('flip-up');
        pop.style.top = (Math.max(8, rect.top - ph) / z) + 'px';
    }
    var left = rect.left;
    if(left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
    pop.style.left = (Math.max(8, left) / z) + 'px';
}
/* Layout of the expanded comment (the same span with class .ce-edit) — shared
   by the editors (manager/source) and the read-only customer one:
   • 1 line → stays in flow (zero shift, just editing/expanding);
   • multi-line → .ce-abs (absolute), first line at the top of the cell and text going down;
     if there's no room below — flip upward (block bottom = cell bottom).
 */
function layoutCommentOverlay(td, span){
    if(!span) return;
    var z = (window.clZoom ? window.clZoom() : 1);
    /* Reset to the collapsed state BEFORE measuring the cell: otherwise ce-edit (in flow,
       adds openCommentCE to reposition) has already stretched the cell and cr.bottom is wrong
       (it broke the upward flip — it was computed from the stretched cell).
     */
    span.classList.remove('ce-abs','ce-edit','ovl-up','ovl-down'); span.style.top = ''; span.style.paddingTop = ''; span.style.paddingBottom = '';
    var cr = td.getBoundingClientRect();                     // cell in the COLLAPSED state
    /* Position of the 1st line in the COLLAPSED view — so the expanded one doesn't jump up
       and the first line stays exactly in place (the text then grows downward).
     */
    var rng = document.createRange(); rng.selectNodeContents(span);
    var collapsedTop = rng.getBoundingClientRect().top;
    span.classList.add('ce-edit');                          // expand to measure the height (in flow)
    var lh = parseFloat(getComputedStyle(span).lineHeight) || 18;
    var fullH = span.getBoundingClientRect().height;         // stable text height (in-flow, before absolute)
    if(fullH <= lh * z * 2.5) return;                        // ≤2 lines → in flow (fully visible)
    /* Symmetric vertical padding: above the 1st line = below the last.
       padV = top padding of the collapsed state (centering in the cell). The overlay starts
       at the top of the cell, the text at collapsedTop → first line exactly in place.
       The overlay height is computed analytically (fullH + paddings): measuring AFTER ce-abs is
       unstable
       due to reflow of the absolute width.
     */
    var padV = collapsedTop - cr.top; if(padV < 0) padV = 0;
    var oh = fullH + 2 * padV;                               // visual overlay height
    span.classList.add('ce-abs');
    span.style.paddingTop = (padV / z) + 'px';
    span.style.paddingBottom = (padV / z) + 'px';
    /* The lower bound of the available area = top of the fixed pager (#or-pager), not the
       bottom of the window: otherwise the overlay "fits" within the window but is hidden BEHIND the
       pager.
     */
    var bottomLimit = window.innerHeight;
    var pager = document.getElementById('or-pager');
    if(pager && getComputedStyle(pager).position === 'fixed'){ var pr = pager.getBoundingClientRect(); if(pr.height > 0) bottomLimit = Math.min(bottomLimit, pr.top); }
    var topV, up = false;
    if(cr.top + oh <= bottomLimit - 8) topV = cr.top;                  // downward: overlay top = cell top
    else { topV = Math.max(8, cr.bottom - oh); up = true; }            // no room below → upward (bottom = cell bottom)
    span.classList.toggle('ovl-up', up);                    // divider line at the edge of the expansion
    span.classList.toggle('ovl-down', !up);
    /* Overlay offset = off. A negative off (downward) is forbidden for the block ITSELF: its
       background would creep
       onto the row's top line and the line would disappear. So the block stays at top:0 and the
       needed
       negative goes into padding-top — the text lands exactly where it was before, the line stays
       intact.
       For the upward flip a negative is fine (the block deliberately extends above the cell).
     */
    var padTop = padV / z;
    function applyTop(off){
        if(!up && off < 0){
            var pt = padTop + off;
            span.style.top = '0px';
            span.style.paddingTop = (pt > 0 ? pt : 0) + 'px';
        } else {
            span.style.top = off + 'px';
            span.style.paddingTop = padTop + 'px';
        }
    }
    applyTop((topV - cr.top) / z);
    if(!up){
        /* Correct the sub-pixel jump: put the 1st line EXACTLY at collapsedTop
           (measure the actual position after rendering and compensate for the error).
         */
        var aRng = document.createRange(); aRng.selectNodeContents(span);
        var err = aRng.getBoundingClientRect().top - collapsedTop;
        if(Math.abs(err) > 0.1) applyTop((topV - cr.top - err) / z);
    }
}

/* Width of the Delivery column to fit the text (address on 2 lines): on a wide screen (>1440)

   goes to comments/source (via --dw + the desktop media query).
 */
function _fitDeliveryCol(){
    /* Delivery width = fits the longest LINE (type/address) IN FULL — a «minimal
       maximum». Measured on the actually rendered text (more reliable than the data).
     */
    var probe = document.createElement('span');
    var bf = getComputedStyle(document.body);
    probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;font-family:'+bf.fontFamily+';';
    document.body.appendChild(probe);
    var maxW = 0;

        var spans = inner.querySelectorAll('span');
        spans.forEach(function(sp, i){
            probe.style.fontSize = (i === 0 ? '12px' : '11px');   // type 12px, address 11px
            probe.textContent = sp.textContent || '';
            if(probe.offsetWidth > maxW) maxW = probe.offsetWidth;
        });
    });
    var w = Math.max(150, Math.min(maxW + 26, 640));
    orTable.style.setProperty('--dw', w + 'px');
    document.body.removeChild(probe);
}
/* Make all three comments/source columns the same width = fit the longest
   header (so the headers stay on one line).
 */
function _setCommentColsUniform(){
    var probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;';
    document.body.appendChild(probe);
    var maxW = 0;
    ['comm_client','comm_manager','source'].forEach(function(col){
        var th = orTable.querySelector('thead th[data-col="'+col+'"]');
        if(!th) return;
        var thcs = getComputedStyle(th);
        probe.style.font = thcs.font;
        probe.style.letterSpacing = thcs.letterSpacing;
        probe.style.textTransform = thcs.textTransform;
        var hw = 0;
        th.childNodes.forEach(function(n){ if(n.nodeType===3 && n.textContent.trim()){ probe.textContent = n.textContent; hw = probe.offsetWidth; } });
        var w = hw + parseFloat(thcs.paddingLeft) + parseFloat(thcs.paddingRight) + 2;
        if(w > maxW) maxW = w;
    });
    if(maxW) orTable.style.setProperty('--cw-all', Math.ceil(maxW) + 'px');
    document.body.removeChild(probe);
}
/* On a wide screen (>1440) split the free remainder EQUALLY among the 3 columns of
   comments/source (so they are the same size). On a Mac — nothing (there is no remainder,
   the base equal width fitting the header applies).
 */
function _fillCommentsDesktop(){
    if(window.innerWidth <= 1440){ orTable.style.removeProperty('--cw-eq'); return; }
    var tableW = orTable.clientWidth, nonComm = 0;
    orTable.querySelectorAll('thead th').forEach(function(th){
        var c = th.dataset.col;
        if(c==='comm_client' || c==='comm_manager' || c==='source') return;
        nonComm += th.getBoundingClientRect().width;
    });
    var headerMax = parseFloat(getComputedStyle(orTable).getPropertyValue('--cw-all')) || 140;
    var per = Math.max(headerMax, Math.floor((tableW - nonComm) / 3) - 1);
    orTable.style.setProperty('--cw-eq', per + 'px');
}
function renderRows(data){
    /* data is already the current page (the server filtered/sorted/sliced it).
       total/pages are taken from srvTotal/srvPages.
     */
    currentFiltered = data;
    var total = srvTotal;
    var pages = srvPages;
    var page = data;
    currentPageData = page;

    var oldTbody = orTable.querySelector('tbody'); if(oldTbody) oldTbody.remove();
    var tbody = document.createElement('tbody');
    var deliveryLabels = {'nova_poshta':'Nova Poshta','pickup':'Pickup','ukr_poshta':'Ukrposhta'};

    /* pinned: selected orders from other pages, rendered on top (from cache). */
    var visibleIds = {};
    page.forEach(function(o){ visibleIds[String(o.id)] = 1; });
    var pinned = [];
    selectedIds.forEach(function(id){
        if(visibleIds[String(id)]) return;
        var od = selectedData[id];
        if(od) pinned.push(od);
    });
    pinned.forEach(function(o, i){
        var tr = buildRow(o, i, true);
        if(i===pinned.length-1) tr.classList.add('or-pinned-last');
        tbody.appendChild(tr);
    });
    page.forEach(function(o, i){
        tbody.appendChild(buildRow(o, i, false));
    });

    if (page.length === 0) {
        var emptyTr = document.createElement('tr');
        emptyTr.className = 'or-empty-row';
        var emptyTd = document.createElement('td');
        emptyTd.colSpan = 11;
        emptyTd.style.cssText = 'height:56px;box-sizing:border-box;';
        emptyTd.textContent = 'No results';
        emptyTr.appendChild(emptyTd);
        tbody.appendChild(emptyTr);
    }

    orTable.appendChild(tbody);
    _setCommentColsUniform();   // equal width of the 3 columns fitting the longest header (1 line)
    _fitDeliveryCol();   // delivery width fitting the longest text (for the desktop layout)
    _fillCommentsDesktop();     // on desktop split the remainder equally among the 3 columns
    _syncHiddenSel();
    updateSelAll();
    renderPager(total, pages);
    _orSyncCounter();

    /* ── Inline editor: manager comment ─────────────────────────────
       Click on the cell → textarea. Enter (without Shift) or blur → save
       via the existing update-field endpoint (manager_comment is in the allowlist).
       Esc — cancel.
     */
    function renderManagerCommentCell(td, text){
        td.classList.remove('is-editing');
        if(text){
            td.innerHTML = '<span class="or-cell-clamp"></span>'; td.firstChild.textContent = text;
            td.style.color = '';
            td.title = 'Click to edit';
        } else {
            td.innerHTML = '<span class="or-cell-clamp">—</span>';
            td.style.color = '#9ca3af';
            td.title = 'Click to add a comment';
        }
    }
    /* Universal contenteditable editor: edit the text IN PLACE (the same
       span) → zero shift. 1 line — in flow; multi-line — absolute on top
       (downward from the cell, or upward if there's no room below).
     */
    function openCommentCE(td, o, field, renderFn){
        closeAllCommentOverlays();
        var orderId = parseInt(td.dataset.orderId, 10);
        var current = (o[field] || '').trim();
        var span = td.querySelector('.or-cell-clamp');
        if(!span){ td.innerHTML = '<span class="or-cell-clamp"></span>'; span = td.firstChild; }
        if((span.textContent || '') === '—') span.textContent = '';
        td.classList.add('is-editing');
        td.style.color = '';
        span.classList.add('ce-edit');
        span.contentEditable = 'true';
        function reposition(){ layoutCommentOverlay(td, span); }
        reposition();                         /* position first (flip), then focus/cursor */
        span.focus({preventScroll:true});     /* preventScroll + position already absolute → the cursor doesn't drag the page */
        try { var rg = document.createRange(); rg.selectNodeContents(span); rg.collapse(false); var sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); } catch(_){}
        span.addEventListener('input', reposition);
        var done = false;
        function finish(text){ span.contentEditable = 'false'; span.classList.remove('ce-edit', 'ce-abs'); span.style.top = ''; renderFn(td, text); }
        function save(){
            if(done) return; done = true;
            var next = (span.textContent || '').trim();
            if(next === current){ finish(current); return; }
            td.classList.add('cm-saving');
            fetch('/admin/orders/update-field/', {
                method:'POST', credentials:'same-origin',
                headers:{'Content-Type':'application/json','X-CSRFToken':getCsrf()},
                body:JSON.stringify({id: orderId, field: field, value: next})
            }).then(function(r){
                td.classList.remove('cm-saving');
                if(!r.ok){ finish(current); return; }
                o[field] = next; finish(next);
            }).catch(function(){ td.classList.remove('cm-saving'); finish(current); });
        }
        function cancel(){ if(done) return; done = true; finish(current); }
        span.addEventListener('blur', save);
        span.addEventListener('keydown', function(e){
            if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
            else if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); span.blur(); }
        });
        span.addEventListener('paste', function(e){ e.preventDefault(); var t = (e.clipboardData || window.clipboardData).getData('text'); document.execCommand('insertText', false, t); });
        span.addEventListener('click', function(e){ e.stopPropagation(); });
        span.addEventListener('mousedown', function(e){ e.stopPropagation(); });
    }
    function openManagerCommentEditor(td, o){ openCommentCE(td, o, 'manager_comment', renderManagerCommentCell); }

    /* ── Inline editor: order source ─────────────────────────────
       Mirror of the manager comment, saves via field:'source'.
     */
    function renderSourceCell(td, text){
        td.classList.remove('is-editing');
        if(text){
            td.innerHTML = '<span class="or-cell-clamp"></span>'; td.firstChild.textContent = text;
            td.style.color = '';
            td.title = 'Click to edit';
        } else {
            td.innerHTML = '<span class="or-cell-clamp">—</span>';
            td.style.color = '#9ca3af';
            td.title = 'Click to add a source';
        }
    }
    function openSourceEditor(td, o){ openCommentCE(td, o, 'source', renderSourceCell); }

    function buildRow(o, i, pinned){
        var tr = document.createElement('tr');
        tr.className = ((i%2===0) ? 'row1' : 'row2') + (pinned ? ' or-pinned' : '')
            + ((o.drop_status === 'drop' || o.drop_status === 'mixed') ? ' or-hasdrop' : '')
            + ((o.course_status === 'course' || o.course_status === 'mixed') ? ' or-hascourse' : '');
        tr.style.cursor = 'pointer';
        var href = '/admin/orders/order/'+o.id+'/change/';

        var cbTd = document.createElement('td'); cbTd.className = 'col-cb';
        cbTd.innerHTML = '<input type="checkbox" class="action-select or-row-cb" name="_selected_action" value="'+o.id+'" data-id="'+o.id+'"'+(selectedIds.has(o.id)?' checked':'')+' onclick="event.stopPropagation()">';

        var numTd = document.createElement('td'); numTd.className = 'col-num';
        numTd.innerHTML = '<span style="display:flex;align-items:center;min-width:0;">'
            + (o.is_imported ? '<span title="Old order (imported from the old site)" style="font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.4px;font-weight:600;margin-right:6px;flex-shrink:0;">OLD</span>' : '')
            + '<span class="col-num-val copy-on-click" data-copy="' + esc(String(o.order_number)) + '" title="Copy number">' + esc(String(o.order_number)) + '</span>'
            + '</span>';

        var stTd = document.createElement('td'); stTd.appendChild(makeOrPicker(STATUS_OPTS, o.status, o.id, 'status'));
        var payTd = document.createElement('td'); payTd.appendChild(makeOrPicker(PAY_OPTS, o.payment_status, o.id, 'payment_status'));
        var dateTd = document.createElement('td'); dateTd.className = 'col-date'; dateTd.textContent = o.created_at;

        var itemCount = (o.items||[]).length;
        var itemsJson = JSON.stringify(o.items||[]);
        var priceTd = document.createElement('td');
        priceTd.className = 'or-order-cell' + (itemCount ? ' has-items' : '');
        priceTd.style.textAlign = 'right';
        /* cursor only on .or-order-line (the amount text), not on the whole cell */
        priceTd.dataset.items = itemsJson;
        if(o.total_price) {
            priceTd.innerHTML = '<span class="or-order-line"><span class="or-order-total" style="font-weight:500">'+esc(o.total_price)+'</span>'
                +(itemCount?' <span class="or-order-cnt">('+itemCount+')</span>':'')+'</span>';
        } else { priceTd.innerHTML = '&mdash;'; }

        var clientTd = document.createElement('td'); clientTd.className = 'col-client';
        // Clicking the value copies it. Line 1 — name; line 2 — phone + email together
        // (email stretches and truncates, the full one is in the tooltip). At most two lines.
        if(o.customer_name){
            var r1 = document.createElement('div'); r1.className = 'cl-row';
            // In the list we show only last name + first name (first 2 words), without the
            // patronymic.
            // The full name stays in the tooltip and for copying.
            var nmShort = o.customer_name.split(/\s+/).slice(0,2).join(' ');
            var nmEl = makeClVal(nmShort, 'cl-name');
            nmEl.title = o.customer_name; nmEl.dataset.copy = o.customer_name;
            r1.appendChild(nmEl);
            clientTd.appendChild(r1);
        }
        if(o.customer_phone){
            var r2 = document.createElement('div'); r2.className = 'cl-row cl-contacts';
            r2.appendChild(makeClVal(o.customer_phone, 'cl-sub'));
            clientTd.appendChild(r2);
        }
        /* Pickup may have no customer data — the cell is not left empty. */
        if(!clientTd.firstChild) clientTd.textContent = '—';

        var delivTd = document.createElement('td'); delivTd.className = 'col-delivery';
        if(o.delivery_summary && o.delivery_summary.length) {
            // New orders: summary by parcels — "Nova Poshta (1-3)" / "Ukrposhta
            // (1) · Nova Poshta (2,3)".
            delivTd.innerHTML = '<span style="font-size:13px">' + o.delivery_summary.map(esc).join('<br>') + '</span>';
        } else if(o.delivery_type) {
            var dl = {'nova_poshta':'Nova Poshta','pickup':'Pickup','ukr_poshta':'Ukrposhta'};
            if(o.drop_delivery_address){
                // Two parcels — the cell shows only the TYPES (no addresses). Addresses are in the
                // popup on click.
                // If both Nova Poshta parcels go to the SAME branch — just write "Nova
                // Poshta".
                var sameWh = (o.delivery_type==='nova_poshta' && o.delivery_address === o.drop_delivery_address);
                var label = sameWh
                    ? 'Nova Poshta'
                    : (o.delivery_type==='nova_poshta'
                        ? 'Nova Poshta (1) + Nova Poshta (2)'
                        : (dl[o.delivery_type]||o.delivery_type) + ' + Nova Poshta');
                delivTd.innerHTML = '<span style="font-size:13px">'+esc(label)+'</span>';
                delivTd.style.cursor = 'pointer';
                delivTd.addEventListener('click', function(e){
                    if(e.button!==0) return; e.stopPropagation();
                    if(oPopOwner===delivTd && oPop.classList.contains('open')){ closeOrderPop(); return; }
                    closeOrderPop();
                    function pkg(title, addr){
                        return '<div class="oop-item deliv-pkg"><div class="oop-info">'
                            +'<span class="oop-name">'+esc(title)+'</span>'
                            +'<div class="oop-meta"><span class="oop-sku" style="font-size:11px;">'+esc(addr||'—')+'</span></div></div></div>';
                    }
                    oPop.innerHTML = pkg('Own products — '+(dl[o.delivery_type]||o.delivery_type), o.delivery_address)
                                   + pkg('Made to order — Nova Poshta', o.drop_delivery_address);
                    oPopOwner = delivTd;
                    oPop.classList.add('open');
                    positionDropPop(oPop, delivTd.getBoundingClientRect());
                });
                delivTd.addEventListener('mouseleave', function(e){
                    if(oPopOwner!==delivTd) return;
                    if(oPop.contains(e.relatedTarget)) return;
                    closeOrderPop();
                });
            } else {
                delivTd.innerHTML = '<span style="font-size:13px">'+esc(deliveryLabels[o.delivery_type]||o.delivery_type)+'</span>'
                    +(o.delivery_address?'<br><span style="font-size:11px;color:#6b7280">'+esc(o.delivery_address)+'</span>':'');
            }
        } else {
            delivTd.innerHTML = '<span style="color:#9ca3af">—</span>';
        }
        /* Address wrapper — so that on a narrow screen (laptop tier) it is clamped to 2-3 lines
           via line-clamp and rows keep an even height. The click listener is on the td itself.
         */
        delivTd.innerHTML = '<span class="col-delivery-inner">' + delivTd.innerHTML + '</span>';

        var commClientTd = document.createElement('td'); commClientTd.className = 'col-comm col-comm-client';
        if(o.comment){ commClientTd.innerHTML='<span class="or-cell-clamp"></span>'; commClientTd.firstChild.textContent=o.comment; } else { commClientTd.innerHTML='<span class="or-cell-clamp">—</span>'; commClientTd.style.color='#9ca3af'; }

        var commManagerTd = document.createElement('td'); commManagerTd.className = 'col-comm col-comm-manager';
        commManagerTd.dataset.orderId = String(o.id);
        renderManagerCommentCell(commManagerTd, o.manager_comment || '');

        var sourceTd = document.createElement('td'); sourceTd.className = 'col-comm col-source';
        sourceTd.dataset.orderId = String(o.id);
        renderSourceCell(sourceTd, o.source || '');

        [cbTd,numTd,stTd,payTd,dateTd,priceTd,clientTd,delivTd,commClientTd,commManagerTd,sourceTd].forEach(function(td){ tr.appendChild(td); });

        /* Click on the manager comment cell — inline editor. */
        commManagerTd.addEventListener('click', function(e){
            if(commManagerTd.classList.contains('is-editing')) return;
            e.stopPropagation();
            openManagerCommentEditor(commManagerTd, o);
        });

        /* Click on the customer comment cell (read-only) — expand the full text
           with the same mechanism as the editors: 1 line stays in place.
         */
        commClientTd.addEventListener('click', function(e){
            if(!o.comment) return;
            e.stopPropagation();
            var open = commClientTd.classList.contains('cc-open');
            var span = commClientTd.querySelector('.or-cell-clamp');
            closeAllCommentOverlays();
            if(!open){ commClientTd.classList.add('cc-open'); if(span) span.classList.add('ce-edit'); layoutCommentOverlay(commClientTd, span); }
        });
        if(!window.__ccCloseBound){ window.__ccCloseBound = true;
            document.addEventListener('click', function(){ closeAllCommentOverlays(); });
            document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeAllCommentOverlays(); });
        }

        /* Click on the source cell — inline editor. */
        sourceTd.addEventListener('click', function(e){
            if(sourceTd.classList.contains('is-editing')) return;
            e.stopPropagation();
            openSourceEditor(sourceTd, o);
        });

        /* Row click → navigate */
        tr.addEventListener('click', function(e){
            if(e.button!==0) return;
            if(e.target.type==='checkbox'||e.target.tagName==='A'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'||e.target.tagName==='TEXTAREA'||e.target.closest('select')||e.target.closest('.col-comm-manager')||e.target.closest('.col-source')) return;
            window.location.href = href;
        });

        /* Checkbox */
        cbTd.querySelector('.or-row-cb').addEventListener('change', function(){
            var id = parseInt(this.dataset.id);
            if(this.checked){ selectedIds.add(id); selectedData[id]=o; }
            else { selectedIds.delete(id); delete selectedData[id]; }
            renderRows(currentFiltered);
            updateActionBar();
        });


        /* Items popup — opens on click on the "Order" cell (like a filter dropdown) */
        priceTd.addEventListener('click', function(e){
            if(e.button!==0) return;
            // Click on the amount text (.or-order-line) → products popup; on the empty part of the
            // cell we don't swallow it, so the row navigation to the order page works.
            if(!e.target.closest('.or-order-line')) return;
            e.stopPropagation();  // don't navigate the row and don't let the global handler close it right away
            var items = JSON.parse(priceTd.dataset.items || '[]');
            if(!items.length) return;
            // toggle: a repeated click on the same cell — close
            if(oPopOwner===priceTd && oPop.classList.contains('open')){ closeOrderPop(); return; }
            closeOrderPop();  // remove the highlight from the previous cell
            oPop.innerHTML = items.map(function(it){
                var letter = (it.name||'?')[0].toUpperCase();
                var photo = it.photo
                    ? '<div class="oop-photo-wrap"><img class="oop-photo" src="'+esc(it.photo)+'" alt=""></div>'
                    : '<div class="oop-photo-empty">'+letter+'</div>';
                var url = it.is_bundle
                    ? (it.bundle_id ? '/admin/catalog/bundle/'+it.bundle_id+'/change/' : '')
                    : (it.variant_id ? '/admin/catalog/productvariant/'+it.variant_id+'/change/' : '');
                var hasChildren = it.is_bundle && it.bundle_items && it.bundle_items.length;
                var toggleBtn = hasChildren
                    ? '<button type="button" class="oop-toggle" data-expanded="0" onclick="event.stopPropagation();event.preventDefault();(function(b){var exp=b.getAttribute(\'data-expanded\')===\'1\';var g=b.closest(\'.oop-item\').nextElementSibling;while(g&&g.classList.contains(\'oop-child\')){g.style.display=exp?\'none\':\'\';g=g.nextElementSibling;}b.setAttribute(\'data-expanded\',exp?\'0\':\'1\');})(this)"><span class="oop-toggle-arrow"></span></button>'
                    : '';
                var priceHtml = it.price ? '<span class="oop-price">'+esc(it.price)+' UAH</span>' : '';
                var inner = photo
                    +'<div class="oop-info">'
                    +'<div class="oop-name-row"><span class="oop-name" title="'+esc(it.name)+'">'+esc(it.name)+'</span>'+priceHtml+'</div>'
                    +'<div class="oop-meta"><span class="oop-sku">'+esc(it.sku||'')+'</span><span class="oop-qty">'+esc(String(it.qty))+' pcs</span></div></div>'
                    +toggleBtn;
                var siteLink = it.site_url
                    ? '<a class="oop-site" href="'+esc(it.site_url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open on site"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>'
                    : '';
                var mainOpen = url
                    ? '<a class="oop-main" href="'+url+'" onclick="event.stopPropagation()">'
                    : '<span class="oop-main">';
                var mainClose = url ? '</a>' : '</span>';
                var main = '<div class="oop-item">'+siteLink+mainOpen+inner+mainClose+'</div>';
                if(hasChildren){
                    var children = it.bundle_items.map(function(bi){
                        var bl = (bi.name||'?')[0].toUpperCase();
                        var bp = bi.photo
                            ? '<div class="oop-photo-wrap"><img class="oop-photo" src="'+esc(bi.photo)+'" alt=""></div>'
                            : '<div class="oop-photo-empty" style="width:24px;height:24px;font-size:10px;">'+bl+'</div>';
                        return '<div class="oop-item oop-child" style="display:none">'+bp
                            +'<div class="oop-info"><span class="oop-name" title="'+esc(bi.name)+'">'+esc(bi.name)+'</span>'
                            +'<div class="oop-meta"><span class="oop-sku">'+esc(bi.sku||'')+'</span><span class="oop-qty">'+esc(String(bi.qty))+' pcs</span></div></div></div>';
                    }).join('');
                    return main + children;
                }
                return main;
            }).join('');
            oPopOwner = priceTd;
            oPop.classList.add('open');
            positionDropPop(oPop, priceTd.getBoundingClientRect());
        });
        /* Close when the mouse leaves the cell NOT into the products window itself */
        priceTd.addEventListener('mouseleave', function(e){
            if(oPopOwner!==priceTd) return;
            if(oPop.contains(e.relatedTarget)) return;
            closeOrderPop();
        });

        return tr;
    }
}

(function(){
    // Close the products popup on a click outside it (the cell itself is handled by its own
    // toggle).
    document.addEventListener('click', function(e){
        if(e.button!==0) return;
        if(oPop.contains(e.target) || e.target.closest('.or-order-cell')) return;
        if(oPopOwner && oPopOwner.contains && oPopOwner.contains(e.target)) return;  // owner cell (e.g. delivery)
        closeOrderPop();
    });
    // Close when the mouse leaves the window NOT back into the owner cell.
    oPop.addEventListener('mouseleave', function(e){
        var rt = e.relatedTarget;
        if(rt && rt.closest && rt.closest('.or-order-cell')===oPopOwner) return;
        if(rt && oPopOwner && oPopOwner.contains && oPopOwner.contains(rt)) return;  // owner = delivery cell
        closeOrderPop();
    });
})();

/* Off-page persistence: keep hidden checked _selected_action inputs inside the
   table for selected ids not currently rendered, so the shared delete code in
   base_site.html (input[name=_selected_action]:checked) acts on the full
   cross-page selection. */
function _syncHiddenSel(){
    var holder = orTable.querySelector('#or-sel-hidden');
    if(holder) holder.remove();
    holder = document.createElement('tbody');
    holder.id = 'or-sel-hidden';
    holder.style.display = 'none';
    var visible = {};
    orTable.querySelectorAll('tbody:not(#or-sel-hidden) .or-row-cb').forEach(function(cb){ visible[cb.value]=1; });
    selectedIds.forEach(function(id){
        if(visible[String(id)]) return;
        var inp = document.createElement('input');
        inp.type='checkbox'; inp.className='action-select or-row-cb'; inp.name='_selected_action';
        inp.value=id; inp.checked=true;
        holder.appendChild(inp);
    });
    orTable.appendChild(holder);
}

window._orSetPage = function(p){ currentPage=p; fetchOrders(); };
window._orPageSize = function(s){ pageSize=s; currentPage=1; fetchOrders(); };

function renderPager(total, pages){
    var pager = document.getElementById('or-pager');
    var tblEl = orTable;
    /* Paginator — only when there are more than 25 rows. */
    if(total<=25){ pager.style.display='none'; positionPager(); return; }
    pager.style.display='';
    var start=(currentPage-1)*pageSize+1, end=Math.min(currentPage*pageSize,total);
    var info = total===0 ? '0' : '<b>'+start+'–'+end+'</b> of '+total;

    function pgBtn(label,p,active,disabled){
        if(disabled) return '<button type="button" class="pg-btn pg-disabled" disabled>'+label+'</button>';
        if(active)   return '<button type="button" class="pg-btn pg-active">'+label+'</button>';
        return '<button type="button" class="pg-btn" onclick="_orSetPage('+p+')">'+label+'</button>';
    }
    var prevSvg='<svg width="7" height="11" viewBox="0 0 7 11" fill="none"><path d="M6 1L1 5.5L6 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var nextSvg='<svg width="7" height="11" viewBox="0 0 7 11" fill="none"><path d="M1 1L6 5.5L1 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    var nav='';
    if(pages>1){
        nav+=pgBtn(prevSvg,currentPage-1,false,currentPage<=1);
        var pNums=[];
        if(pages<=7){ for(var i=1;i<=pages;i++) pNums.push(i); }
        else{
            pNums.push(1);
            if(currentPage>3) pNums.push('...');
            for(var i=Math.max(2,currentPage-1);i<=Math.min(pages-1,currentPage+1);i++) pNums.push(i);
            if(currentPage<pages-2) pNums.push('...');
            pNums.push(pages);
        }
        pNums.forEach(function(p){
