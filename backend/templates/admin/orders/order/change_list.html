/* ── Export modal ── */
/* pendingEdits: item_id -> {variant_id, variant_name, price, quantity} (changed fields only) */
var pendingEdits = {};

function defaultFilename(){
    var now=new Date();
    return 'orders '+String(now.getDate()).padStart(2,'0')+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+now.getFullYear();
}
function fmtPriceUah(v){
    var n = Math.round(parseFloat(v||0));
    return (isFinite(n)?n:0).toLocaleString('uk-UA') + ' ₴';
}
function effItem(it){
    /* Returns the product with the edit applied (for recalculation and UI) */
    var ed = pendingEdits[it.item_id] || {};
    var compsEdited = ed.components && Object.keys(ed.components).some(function(k){
        if(k==='new') return Array.isArray(ed.components.new) && ed.components.new.length>0;
        var c = ed.components[k];
        return c && (c.delete || c.variant_id || c.quantity!=null);
    });
    return {
        item_id: it.item_id,
        name: ed.variant_name || it.name,
        /* The photo is also "effective": after replacing a product/bundle we show the new one's
           photo,
           otherwise the pin would keep the old image.
         */
        photo:(ed.photo!=null)    ? ed.photo    : it.photo,
        qty:  (ed.quantity!=null) ? ed.quantity : it.qty,
        price:(ed.price!=null)    ? ed.price    : it.price,
        is_drop: it.is_drop,
        is_course: it.is_course,
        is_bundle: it.is_bundle,
        bundle_items: it.bundle_items,
        edited: !!(ed.variant_id || ed.quantity!=null || ed.bundle_id || compsEdited),
    };
}
function effComp(it, comp){
    /* Returns the effective (with edits applied) data of a bundle component. */
    var ed = (pendingEdits[it.item_id] && pendingEdits[it.item_id].components) || {};
    var ce = comp.comp_id ? ed[comp.comp_id] : null;
    var per = comp.qty_per_set || 0;
    var name = comp.name, variantId = comp.variant_id, qtyPer = per, photo = comp.photo || '';
    if(ce){
        if(ce.variant_name) name = ce.variant_name;
        if(ce.variant_id)   variantId = ce.variant_id;
        if(ce.quantity!=null) qtyPer = ce.quantity;
        if(ce.photo!=null)  photo = ce.photo;   // photo of the replacement component
    }
    return {
        comp_id: comp.comp_id || null,
        name: name,
        photo: photo,
        variant_id: variantId,
        qty_per_set: qtyPer,
        deleted: !!(ce && ce.delete),
        edited: !!(ce && (ce.variant_id || ce.quantity!=null)),
    };
}
function recalcOrderSummary(orderEl, order){
    var items = order.items || [];
    var qty = 0, qtyAll = 0, includedSum = 0, excludedSum = 0;
    var includedCount = 0;
    items.forEach(function(it){
        var eit = effItem(it);
        var cb = orderEl.querySelector('.em-item-cb[data-item-id="'+it.item_id+'"]');
        var on = cb ? cb.checked : true;
        var line = orderEl.querySelector('.em-item[data-item-id="'+it.item_id+'"]');
        if(line) line.classList.toggle('excluded', !on);
        var lineSum = (parseFloat(eit.price||0)||0) * (parseInt(eit.qty||0)||0);
        if(on){
            var itQty = parseInt(eit.qty||0)||0;
            qty += itQty;
            includedSum += lineSum;
            includedCount++;
            /* qtyAll — physical quantity of units: for a bundle we break it down into components,
               a regular product takes its own qty.
             */
            if(it.is_bundle && it.bundle_items && it.bundle_items.length){
                it.bundle_items.forEach(function(bi){
                    var ec = effComp(it, bi);
                    if(!ec.deleted){
                        qtyAll += (parseInt(ec.qty_per_set||0)||0) * itQty;
                    }
                });
            } else {
                qtyAll += itQty;
            }
        }
        else  { excludedSum += lineSum; }
    });
    /* If nothing was edited — recalculate as before via order.total_price - excluded.
       If edited — total = sum of the included items.
     */
    var anyEdit = items.some(function(it){ return !!pendingEdits[it.item_id]; });
    var total = anyEdit ? includedSum : Math.max(0, parseFloat(order.total_price||0) - excludedSum);
    var sumEl = orderEl.querySelector('.em-order-summary');
    if(sumEl){
        var qtyEl = sumEl.querySelector('.em-sum-qty');
        if(qtyEl){
            qtyEl.textContent = (qtyAll !== qty) ? (qty + ' (' + qtyAll + ')') : String(qty);
        }
        sumEl.querySelector('.em-sum-price').textContent = fmtPriceUah(total);
    }
    /* If ALL items are excluded — strike through the whole order so the user sees:
       this order will not make it into the docx.
     */
    orderEl.classList.toggle('all-excluded', items.length > 0 && includedCount === 0);
}
/* Loads the composition of the new Bundle and recreates the component rows. */
function reloadBundleComponents(orderEl, order, it, bundleId){
    fetch('/admin/orders/bundle/'+bundleId+'/items/', {credentials:'same-origin'})
        .then(function(r){ return r.json(); })
        .then(function(data){
            var newItems = (data.items||[]).map(function(ci){
                /* Unique synthetic comp_id for the new template —
                   so that querySelector in rerenderComponentLine finds separate rows.
                 */
                return {
                    comp_id: 'new-'+bundleId+'-'+(ci.variant_id||'x')+'-'+Math.random().toString(36).slice(2,6),
                    name: ci.name,
                    qty_per_set: ci.qty_per_set,
                    variant_id: ci.variant_id,
                    sku: ci.sku,
                    photo: ci.photo || '',
                };
            });
            it.bundle_items = newItems;
            it.is_bundle = true;
            /* When the template changes, the component edits of the previous state are invalid */
            if(pendingEdits[it.item_id]) delete pendingEdits[it.item_id].components;
            /* Find/create em-item-children. If the item was a product — the children container doesn't exist. */
            var line = orderEl.querySelector('.em-item[data-item-id="'+it.item_id+'"]');
            if(!line) return;
            var kidsBlock = line.nextElementSibling;
            if(!kidsBlock || !kidsBlock.classList || !kidsBlock.classList.contains('em-item-children')){
                kidsBlock = document.createElement('div');
                kidsBlock.className = 'em-item-children';
                kidsBlock.dataset.parentItem = String(it.item_id);
                line.parentNode.insertBefore(kidsBlock, line.nextSibling);
            }
            kidsBlock.innerHTML = '';
            kidsBlock.style.display = '';
            newItems.forEach(function(bi){
                var child = document.createElement('div');
                child.className = 'em-item-child';
                child.dataset.compKey = String(bi.comp_key || bi.comp_id);
                kidsBlock.appendChild(child);
            });
            /* Re-render the bundle row (so the chevron appears) + components */
            rerenderItemLine(orderEl, order, it);
            newItems.forEach(function(bi){ rerenderComponentLine(orderEl, order, it, bi); });
        })
        .catch(function(){});
}

/* Hover-preview photo positioning (for products and bundle components).
   Constrained to the bounds of the #or-export-box modal, the popup sits below/above the pin icon,
   aligned to the left edge of the thumbnail.
 */
function attachPhotoPreviewHandler(wrap){
    if (!wrap) return;
    var preview = wrap.querySelector('.app-photo-preview');
    if (!preview) return;
    wrap.addEventListener('mouseenter', function(){
        var wr = wrap.getBoundingClientRect();
        var modal = document.getElementById('or-export-box');
        var bnd = modal ? modal.getBoundingClientRect()
                        : { left:0, top:0, right:window.innerWidth, bottom:window.innerHeight };
        var GAP = 6, MARGIN = 8;
        preview.style.visibility = 'hidden';
        preview.style.display = 'block';
        preview.style.left = '0px';
        preview.style.top = '0px';
        var pw = preview.offsetWidth, ph = preview.offsetHeight;
        preview.style.display = '';
        preview.style.visibility = '';
        var top = wr.bottom + GAP;
        if (top + ph > bnd.bottom - MARGIN) top = wr.top - ph - GAP;
        if (top < bnd.top + MARGIN) top = bnd.top + MARGIN;
        var POPUP_INNER_OFFSET = 0;
        var left = wr.left - POPUP_INNER_OFFSET;
        if (left + pw > bnd.right - MARGIN) left = bnd.right - pw - MARGIN;
        if (left < bnd.left + MARGIN) left = bnd.left + MARGIN;
        preview.style.left = left + 'px';
        preview.style.top  = top + 'px';
    });
}

function rerenderItemLine(orderEl, order, it, forcedChecked){
    var line = orderEl.querySelector('.em-item[data-item-id="'+it.item_id+'"]');
    if(!line) return;
    var eit = effItem(it);
    var idx = parseInt(line.dataset.idx||'0',10);
    /* Text color: red — dropshipping, blue — edited. If the item is edited,
       the drop indicator is removed (the new product may not be a drop item).
     */
    var showDrop = it.is_drop && !eit.edited;
    var showCourse = it.is_course && !eit.edited;
    var pe = pendingEdits[it.item_id] || {};
    var nameEdited = !!(pe.variant_id || pe.bundle_id);
    var qtyEdited  = pe.quantity != null;
    line.classList.toggle('edited', !!eit.edited);
    line.classList.toggle('name-edited', nameEdited);
    line.classList.toggle('qty-edited', qtyEdited);
    line.classList.toggle('is-drop', !!showDrop);
    line.classList.toggle('is-course', !!showCourse);
    /* Bundle→product conversion: there are no components anymore. */
    var becameVariant = !!(pe.variant_id);
    /* keep is-bundle only if the item is still a bundle */
    var stillBundle = (it.is_bundle && !becameVariant);
    var hasKids = !!(stillBundle && it.bundle_items && it.bundle_items.length);
    line.classList.toggle('is-bundle', stillBundle);
    var kidsBlock = line.nextElementSibling;
    if(kidsBlock && kidsBlock.classList && kidsBlock.classList.contains('em-item-children')){
        if(becameVariant){
            kidsBlock.style.display = 'none';
            kidsBlock.classList.remove('open');
        } else {
            kidsBlock.style.display = '';
        }
    }
    if(becameVariant) line.classList.remove('bundle-open');
    var cbChecked = line.querySelector('.em-item-cb');
    var stillChecked;
    if(typeof forcedChecked === 'boolean'){ stillChecked = forcedChecked; }
    else if(cbChecked){ stillChecked = cbChecked.checked; }
    else { stillChecked = !(it.is_drop || it.is_course); }
    /* If the item was replaced (another variant/bundle) — it is always active.
       Without this, a drop variant stays excluded even after the replacement.
     */
    if(nameEdited) stillChecked = true;
    /* The pencil is on both bundles and regular products (for a bundle only qty is editable) */
    var editBtn = '<button type="button" class="em-item-edit-btn" title="Edit item">'
        +'<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M9.5 2L12 4.5L4.5 12L1.5 12.5L2 9.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>'
        +'</button>';
    var chevronBtn = hasKids
        ? '<button type="button" class="em-item-chevron" title="Expand composition">'
          +'<svg width="12" height="12" viewBox="0 0 10 10" fill="none"><path d="M3 1.5L7 5L3 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          +'</button>'
        : '';
    /* Pin with photo — AFTER the number and BEFORE the name. Works for regular products
       and for bundles (bundle photo). Hover — preview, click — toggle selection.
       We use <button type="button"> because a span inside <label> natively
       flashes the row checkbox.
     */
    var pinPhoto = eit.photo;   // after replacing the product — the new one's photo
    var photoPin = pinPhoto
        ? '<button type="button" class="em-photo-wrap'+(pe.attach_photo?' is-selected':'')+'" title="Click — choose a photo for the docx">'
          +'<img class="em-item-photo-pin" src="'+esc(pinPhoto)+'" alt="">'
          +'<span class="em-photo-check"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L5.5 10.5L11.5 3.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
          +'<div class="app-photo-preview"><img src="'+esc(pinPhoto)+'"></div>'
          +'</button>'
        : '';
    line.innerHTML =
        '<input type="checkbox" class="em-item-cb" data-item-id="'+it.item_id+'"'+(stillChecked?' checked':'')+'>'
        +'<span class="em-item-num">'+idx+'.</span>'
        +photoPin
        +'<span class="em-item-text">'+esc(eit.name)+' — <span class="em-qty-num">'+esc(String(eit.qty))+'</span> pcs</span>'
        +chevronBtn
        +editBtn;
    var photoWrapEl = line.querySelector('.em-photo-wrap');
    attachPhotoPreviewHandler(photoWrapEl);
    if (photoWrapEl) {
        /* `.em-item` is a <label> with for pointing at the row checkbox, so a click on any
           element inside flashes the checkbox before our click handler fires.
           We suppress PD/SP already on mousedown so the label doesn't catch the click.
         */
        ['mousedown','mouseup','click'].forEach(function(ev){
            photoWrapEl.addEventListener(ev, function(e){
                e.preventDefault(); e.stopPropagation();
            });
        });
        photoWrapEl.addEventListener('click', function(e){
            if (!pendingEdits[it.item_id]) pendingEdits[it.item_id] = {};
            pendingEdits[it.item_id].attach_photo = !pendingEdits[it.item_id].attach_photo;
            if (!pendingEdits[it.item_id].attach_photo) {
                delete pendingEdits[it.item_id].attach_photo;
                if (!Object.keys(pendingEdits[it.item_id]).length) delete pendingEdits[it.item_id];
            }
            photoWrapEl.classList.toggle('is-selected',
                !!(pendingEdits[it.item_id] && pendingEdits[it.item_id].attach_photo));
        });
    }
    /* Explicitly sync the checked property with our desired state — so we don't depend
       on how the browser interprets the attribute after an innerHTML replace.
     */
    var freshCb = line.querySelector('.em-item-cb');
    if(freshCb) freshCb.checked = !!stillChecked;
    /* Sync excluded strictly with the checked state */
    line.classList.toggle('excluded', !stillChecked);
    /* rebinding handlers */
    freshCb.addEventListener('change', function(){ recalcOrderSummary(orderEl, order); });
    var btnEl = line.querySelector('.em-item-edit-btn');
    if(btnEl){
        btnEl.addEventListener('click', function(e){
            e.preventDefault(); e.stopPropagation();
            openItemEditor(orderEl, order, it);
        });
    }
    var chevEl = line.querySelector('.em-item-chevron');
    if(chevEl){
        chevEl.addEventListener('click', function(e){
            e.preventDefault(); e.stopPropagation();
            var kids = line.nextElementSibling;
            if(kids && kids.classList.contains('em-item-children')){
                var open = kids.classList.toggle('open');
                line.classList.toggle('bundle-open', open);
            }
        });
    }
}

/* Render a child bundle component with a pencil button */
function rerenderComponentLine(orderEl, order, it, comp){
    var childEl = orderEl.querySelector('.em-item-child[data-comp-key="'+(comp.comp_key||comp.comp_id||'?')+'"]');
    if(!childEl) return;
    var ec = effComp(it, comp);
    var pe = (pendingEdits[it.item_id] && pendingEdits[it.item_id].components && pendingEdits[it.item_id].components[comp.comp_id]) || {};
    var nameEdited = !!pe.variant_id;
    var qtyEdited  = pe.quantity != null;
    childEl.classList.toggle('edited', !!ec.edited);
    childEl.classList.toggle('name-edited', nameEdited);
    childEl.classList.toggle('qty-edited', qtyEdited);
    childEl.classList.toggle('deleted', !!ec.deleted);
    var qtyTotal = (ec.qty_per_set || 0) * (it.qty || 0);
    var btn = comp.comp_id
        ? '<button type="button" class="em-item-edit-btn" title="Edit component">'
          +'<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M9.5 2L12 4.5L4.5 12L1.5 12.5L2 9.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>'
          +'</button>'
        : '';
    /* The checkbox controls removal of the component: unchecked = exclude from export.
       It sits in the same column as the product checkbox (next to the left edge).
     */
    var cbHtml = comp.comp_id
        ? '<input type="checkbox" class="em-comp-cb" data-comp-key="'+esc(String(comp.comp_id))+'"'+(ec.deleted?'':' checked')+'>'
        : '<span style="width:13px;flex-shrink:0;"></span>';  // placeholder so the text indent doesn't shift
    /* Pin with the component photo — ALWAYS (if present). A click toggles "attach to docx". */
    var compPinPhoto = ec.photo;   // after replacing the component — the new one's photo
    var compPhotoPin = compPinPhoto
        ? '<button type="button" class="em-photo-wrap'+(pe.attach_photo?' is-selected':'')+'" title="Click — choose a photo for the docx">'
          +'<img class="em-item-photo-pin" src="'+esc(compPinPhoto)+'" alt="">'
          +'<span class="em-photo-check"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L5.5 10.5L11.5 3.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
          +'<div class="app-photo-preview"><img src="'+esc(compPinPhoto)+'"></div>'
          +'</button>'
        : '';
    childEl.innerHTML = cbHtml
        + '<span class="em-comp-indent"></span>'
        + compPhotoPin
        + '<span class="em-item-text">'+esc(ec.name)+' — <span class="em-qty-num">'+esc(String(qtyTotal))+'</span> pcs</span>'
        + btn;
    var compPhotoWrap = childEl.querySelector('.em-photo-wrap');
    attachPhotoPreviewHandler(compPhotoWrap);
    if (compPhotoWrap && comp.comp_id) {
        compPhotoWrap.addEventListener('click', function(e){
            e.preventDefault(); e.stopPropagation();
            if (!pendingEdits[it.item_id]) pendingEdits[it.item_id] = {};
            if (!pendingEdits[it.item_id].components) pendingEdits[it.item_id].components = {};
            var comps = pendingEdits[it.item_id].components;
            var c = comps[comp.comp_id] || {};
            c.attach_photo = !c.attach_photo;
            if (!c.attach_photo) {
                delete c.attach_photo;
                if (!Object.keys(c).length) delete comps[comp.comp_id];
                if (!Object.keys(comps).length) {
                    delete pendingEdits[it.item_id].components;
                    if (!Object.keys(pendingEdits[it.item_id]).length) delete pendingEdits[it.item_id];
                }
            } else {
                comps[comp.comp_id] = c;
            }
            compPhotoWrap.classList.toggle('is-selected', !!c.attach_photo);
        });
    }
    var btnEl = childEl.querySelector('.em-item-edit-btn');
    if(btnEl){
        btnEl.addEventListener('click', function(e){
            e.preventDefault(); e.stopPropagation();
            openComponentEditor(orderEl, order, it, comp);
        });
    }
    var cbEl = childEl.querySelector('.em-comp-cb');
    if(cbEl){
        cbEl.addEventListener('click', function(e){ e.stopPropagation(); });
        cbEl.addEventListener('change', function(){
            if(!comp.comp_id) return;
            if(!pendingEdits[it.item_id]) pendingEdits[it.item_id] = {};
            if(!pendingEdits[it.item_id].components) pendingEdits[it.item_id].components = {};
            var comps = pendingEdits[it.item_id].components;
            var c = comps[comp.comp_id] || {};
            if(cbEl.checked){
                delete c.delete;
                if(!Object.keys(c).length) delete comps[comp.comp_id];
                if(!Object.keys(comps).length){
                    delete pendingEdits[it.item_id].components;
                    if(!Object.keys(pendingEdits[it.item_id]).length) delete pendingEdits[it.item_id];
                }
            } else {
                c.delete = true;
                comps[comp.comp_id] = c;
            }
            childEl.classList.toggle('deleted', !cbEl.checked);
            recalcOrderSummary(orderEl, order);
        });
    }
}

        +revertBtn

    line.appendChild(ed);
    var vinp = ed.querySelector('.ee-vinput');
    var qinp = ed.querySelector('.ee-qty');
    var sug  = ed.querySelector('.ee-sug');
    var okBtn = ed.querySelector('.ee-btn.ok');
    var cancelBtn = ed.querySelector('.ee-btn.cancel');
    var revertBtnEl = ed.querySelector('.ee-btn.revert');
    /* editor state */
    var pickedVariantId = (pendingEdits[it.item_id] && pendingEdits[it.item_id].variant_id) || null;
    var pickedBundleId = (pendingEdits[it.item_id] && pendingEdits[it.item_id].bundle_id) || null;
    var pickedVariantName = null;
    var pickedVariantPrice = null;
    var pickedVariantPhoto = null;   // photo of the chosen product/packaging → into pendingEdits
    var searchTimer = null;
    var forceCheckedOnCommit = false;
    var prevChecked = savedChecked;
    function positionSug(){
        var r = vinp.getBoundingClientRect();
        sug.style.left = r.left + 'px';
        sug.style.top  = (r.bottom + 2) + 'px';
        sug.style.width = r.width + 'px';
    }
    function renderSug(items, query){
        sug.innerHTML = '';
        var inner = document.createElement('div'); inner.className = 'ee-sug-scroll';
        sug.appendChild(inner);
        /* Don't let the wheel event "leak" to the parent container/page.
           If the content fits — suppress it fully; if there is scroll — suppress only at the edges.
         */
        inner.addEventListener('wheel', function(e){
            var h = inner.scrollHeight - inner.clientHeight;
            if(h <= 0){ e.preventDefault(); return; }
            var top = inner.scrollTop;
            if((e.deltaY < 0 && top <= 0) || (e.deltaY > 0 && top >= h - 0.5)){
                e.preventDefault();
            }
        }, {passive:false});
        if(!items.length){
            var r = document.createElement('div'); r.className = 'ee-sug-row empty';
            r.textContent = (query && query.length>=2) ? 'Nothing found' : 'Enter at least 2 characters';
            inner.appendChild(r); positionSug(); sug.classList.add('open'); return;
        }
        items.forEach(function(v){
            var r = document.createElement('div'); r.className = 'ee-sug-row';
            var photo = v.photo
                ? '<img class="ee-sug-photo" src="'+esc(v.photo)+'" alt="">'
                : '<div class="ee-sug-photo"></div>';
            var st = parseInt(v.stock,10)||0;
            var stockHtml = st > 0
                ? '<span class="ee-sug-stock" style="color:#16a34a">'+st+' pcs</span>'
                : '<span class="ee-sug-stock" style="color:#dc2626">None</span>';
            r.innerHTML = photo
                +'<div class="ee-sug-info">'
                +'<span class="ee-sug-name">'+esc(v.name)+'</span>'
                +'<span class="ee-sug-meta">'
                +  '<span class="ee-sug-sku">'+esc(v.sku||'—')+'</span>'
                +  stockHtml
                +'</span>'
                +'</div>';
            r.addEventListener('click', function(e){
                /* Without this the click would bubble up to <label class="em-item">
                   and toggle the checkbox inside — the item would become excluded.
                 */
                e.preventDefault(); e.stopPropagation();
                if(v.__kind === 'bundle'){
                    pickedBundleId = v.__bundle.id;
                    pickedVariantId = null;
                    pickedVariantName = v.name;
                    pickedVariantPrice = parseFloat(v.price)||0;
                } else {
                    pickedVariantId = v.id;
                    pickedBundleId = null;
                    pickedVariantName = v.name;
                    /* with discount (variant/brand) — like the storefront price */
                    pickedVariantPrice = parseFloat(v.final_price || v.price)||0;
                }
                pickedVariantPhoto = v.photo || '';
                vinp.value = v.name;
                sug.classList.remove('open');
                forceCheckedOnCommit = true;
                /* If a bundle is selected — load its composition for the preview */
                var bundleIdToLoad = (v.__kind === 'bundle') ? v.__bundle.id : null;
                commit();
                /* Guarantee that excluded is cleared and the checkmark is set — in case
                   something went wrong in the rerender.
                 */
                var cb = line.querySelector('.em-item-cb');
                if(cb){ cb.checked = true; }
                line.classList.remove('excluded');
                recalcOrderSummary(orderEl, order);
                if(bundleIdToLoad){
                    reloadBundleComponents(orderEl, order, it, bundleIdToLoad);
                }
            });
            inner.appendChild(r);
        });
        positionSug();
        sug.classList.add('open');
    }
    /* On scrolling the modal body, close the dropdown — otherwise it "hangs" in the air */
    var bodyEl = document.getElementById('or-export-body');
    function _closeSugOnScroll(){ if(sug) sug.classList.remove('open'); }
    if(bodyEl) bodyEl.addEventListener('scroll', _closeSugOnScroll, {passive:true});
    window.addEventListener('resize', _closeSugOnScroll);
    function doSearch(){
        var q = vinp.value.trim();
        if(q === eit.name){ sug.classList.remove('open'); return; }
        if(q.length < 2){ renderSug([], q); return; }
        /* Universal search: products + bundles in parallel */
        var qs = encodeURIComponent(q);
        Promise.all([
            fetch('/admin/orders/invoice/search-variants/?q='+qs, {credentials:'same-origin'}).then(function(r){return r.json();}).catch(function(){return {results:[]};}),
            fetch('/admin/orders/search-bundles/?q='+qs, {credentials:'same-origin'}).then(function(r){return r.json();}).catch(function(){return {results:[]};}),
        ]).then(function(both){
            var rows = [];
            (both[0].results||[]).forEach(function(v){
                rows.push({
                    __kind: 'variant',
                    id: v.id, name: v.name,
                    sku: v.sku || '—',
                    stock: v.stock, price: v.price, final_price: v.final_price, photo: v.photo,
                });
            });
            (both[1].results||[]).forEach(function(b){
                if(b.is_active === false) return;
                rows.push({
                    __kind: 'bundle',
                    __bundle: {id: b.id, name: b.name, photo: b.photo},
                    id: 'b-'+b.id,
                    name: b.name,
                    sku: b.sku || '—',
                    stock: b.stock, price: b.price,
                    photo: b.photo,
                });
            });
            renderSug(rows, q);
        });
    }
    vinp.addEventListener('input', function(){
        pickedVariantId = null;
        pickedBundleId = null;
        pickedVariantName = null;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(doSearch, 200);
    });
    vinp.addEventListener('focus', function(){ if(vinp.value.trim().length>=2) doSearch(); });
    document.addEventListener('click', function _outside(e){
        if(!ed.contains(e.target)){ sug.classList.remove('open'); }
    });
    function commit(){
        var newQty = parseInt(qinp.value, 10);
        if(!(newQty > 0)) newQty = eit.qty;
        var rec = pendingEdits[it.item_id] ? Object.assign({}, pendingEdits[it.item_id]) : {};
        var changed = false;
        /* Universal replacement: can change the item type too (product↔bundle) */
        if(pickedVariantId){
            var sameVariant = !it.is_bundle && pickedVariantId === it.variant_id;
            if(!sameVariant){
                rec.variant_id = pickedVariantId;
                rec.bundle_id = null;
                rec.variant_name = pickedVariantName || vinp.value;
                if(pickedVariantPrice!=null) rec.price = pickedVariantPrice;
                if(pickedVariantPhoto!=null) rec.photo = pickedVariantPhoto;
                delete rec.components;
                changed = true;
            }
        } else if(pickedBundleId){
            var sameBundle = it.is_bundle && pickedBundleId === it.bundle_id;
            if(!sameBundle){
                rec.bundle_id = pickedBundleId;
                rec.variant_id = null;
                rec.variant_name = pickedVariantName || vinp.value;
                if(pickedVariantPrice!=null) rec.price = pickedVariantPrice;
                if(pickedVariantPhoto!=null) rec.photo = pickedVariantPhoto;
                delete rec.components;
                changed = true;
            }
        }
        if(newQty !== it.qty){
            rec.quantity = newQty;
            changed = true;
        }
        var hadPending = !!pendingEdits[it.item_id];
        if(!changed && !hadPending){
            // nothing changed and nothing pending — just close
        } else if(changed){
            pendingEdits[it.item_id] = rec;
        }
        line.classList.remove('editing');
        /* If the variant/bundle was replaced — the item must not stay excluded */
        var variantOrTypeChanged = !!(rec.variant_id || rec.bundle_id);
        if(variantOrTypeChanged) forceCheckedOnCommit = true;
        var forced = forceCheckedOnCommit ? true : prevChecked;
        rerenderItemLine(orderEl, order, it, forced);
        if(forceCheckedOnCommit){
            var cb = line.querySelector('.em-item-cb');
            if(cb) cb.checked = true;
            line.classList.remove('excluded');
        }
        recalcOrderSummary(orderEl, order);
    }
    function cancel(){
        line.classList.remove('editing');
        rerenderItemLine(orderEl, order, it, prevChecked);
        recalcOrderSummary(orderEl, order);
    }
    function revert(){
        delete pendingEdits[it.item_id];
        line.classList.remove('editing');
        rerenderItemLine(orderEl, order, it, prevChecked);
        recalcOrderSummary(orderEl, order);
    }
    okBtn.addEventListener('click', commit);
    cancelBtn.addEventListener('click', cancel);
    if(revertBtnEl) revertBtnEl.addEventListener('click', revert);
    qinp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); commit(); } if(e.key==='Escape'){ cancel(); } });
    if(vinp) vinp.addEventListener('keydown', function(e){ if(e.key==='Escape'){ cancel(); } });
    setTimeout(function(){
        if(vinp){ vinp.focus(); vinp.select(); }
        else if(qinp){ qinp.focus(); qinp.select(); }
    }, 30);
}

/* Bundle component editor: variant search + qty + delete + ✓/✕/(↶) */
function openComponentEditor(orderEl, order, it, comp){
    var childEl = orderEl.querySelector('.em-item-child[data-comp-key="'+(comp.comp_key||comp.comp_id||'?')+'"]');
    if(!childEl || childEl.classList.contains('editing')) return;
    closeAllOpenEditors();
    var ec = effComp(it, comp);
    childEl.classList.add('editing');
    childEl.innerHTML = '';
    var ed = document.createElement('div'); ed.className='em-item-editor';
    var revertBtn = ec.edited ? (
        '<button type="button" class="ee-btn revert" title="Revert to original">'
        +'<svg width="14" height="14" viewBox="0 0 14 14" fill="none">'
        +'<path d="M2 6h7a3 3 0 0 1 0 6H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>'
        +'<path d="M4 4 2 6l2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'
        +'</svg></button>'
    ) : '';
    ed.innerHTML =
        '<input type="text" class="ee-vinput" placeholder="Search product..." value="'+esc(ec.name)+'">'
        +'<span class="ee-mul"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>'
        +'<input type="number" class="ee-qty" min="1" value="'+esc(String(ec.qty_per_set||1))+'">'
        +'<button type="button" class="ee-btn ok" title="Save">'
        +'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7l3 3 5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
        +'<button type="button" class="ee-btn cancel" title="Cancel">'
        +'<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>'
        +revertBtn
        +'<div class="ee-sug"></div>';
    childEl.appendChild(ed);
    var vinp = ed.querySelector('.ee-vinput');
    var qinp = ed.querySelector('.ee-qty');
    var sug  = ed.querySelector('.ee-sug');
    var okBtn = ed.querySelector('.ee-btn.ok');
    var cancelBtn = ed.querySelector('.ee-btn.cancel');
    var revertEl = ed.querySelector('.ee-btn.revert');
    var pickedVariantId = (pendingEdits[it.item_id] && pendingEdits[it.item_id].components && pendingEdits[it.item_id].components[comp.comp_id] && pendingEdits[it.item_id].components[comp.comp_id].variant_id) || null;
    var pickedVariantName = null;
    var pickedVariantPhoto = null;   // photo of the chosen component → into pendingEdits
    var searchTimer = null;
    function positionSug(){
        var r = vinp.getBoundingClientRect();
        sug.style.left = r.left + 'px';
        sug.style.top  = (r.bottom + 2) + 'px';
        sug.style.width = r.width + 'px';
    }
    function renderSug(items, query){
        sug.innerHTML='';
        var inner = document.createElement('div'); inner.className='ee-sug-scroll';
        sug.appendChild(inner);
        inner.addEventListener('wheel', function(e){
            var h = inner.scrollHeight - inner.clientHeight;
            if(h <= 0){ e.preventDefault(); return; }
            var top = inner.scrollTop;
            if((e.deltaY < 0 && top <= 0) || (e.deltaY > 0 && top >= h - 0.5)) e.preventDefault();
        }, {passive:false});
        if(!items.length){
            var r = document.createElement('div'); r.className='ee-sug-row empty';
            r.textContent = (query && query.length>=2) ? 'Nothing found' : 'Enter at least 2 characters';
            inner.appendChild(r); positionSug(); sug.classList.add('open'); return;
        }
        items.forEach(function(v){
            var r = document.createElement('div'); r.className='ee-sug-row';
            var photo = v.photo
                ? '<img class="ee-sug-photo" src="'+esc(v.photo)+'" alt="">'
                : '<div class="ee-sug-photo"></div>';
            var st = parseInt(v.stock,10)||0;
            var stockHtml = st > 0
                ? '<span class="ee-sug-stock" style="color:#16a34a">'+st+' pcs</span>'
                : '<span class="ee-sug-stock" style="color:#dc2626">None</span>';
            r.innerHTML = photo
                +'<div class="ee-sug-info">'
                +  '<span class="ee-sug-name">'+esc(v.name)+'</span>'
                +  '<span class="ee-sug-meta">'
                +    '<span class="ee-sug-sku">'+esc(v.sku||'—')+'</span>'+stockHtml
                +  '</span>'
                +'</div>';
            r.addEventListener('click', function(){
                pickedVariantId = v.id;
                pickedVariantName = v.name;
                pickedVariantPhoto = v.photo || '';
                vinp.value = v.name;
                sug.classList.remove('open');
                commit();
            });
            inner.appendChild(r);
        });
        positionSug(); sug.classList.add('open');
    }
    function doSearch(){
        var q = vinp.value.trim();
        if(q === ec.name){ sug.classList.remove('open'); return; }
        if(q.length < 2){ renderSug([], q); return; }
        fetch('/admin/orders/invoice/search-variants/?q='+encodeURIComponent(q), {credentials:'same-origin'})
            .then(function(r){ return r.json(); })
            .then(function(data){ renderSug(data.results||[], q); })
            .catch(function(){ renderSug([], q); });
    }
    var bodyEl2 = document.getElementById('or-export-body');
    function _closeSugOnScroll(){ sug.classList.remove('open'); }
    if(bodyEl2) bodyEl2.addEventListener('scroll', _closeSugOnScroll, {passive:true});
    window.addEventListener('resize', _closeSugOnScroll);
    vinp.addEventListener('input', function(){
        pickedVariantId = null; pickedVariantName = null; pickedVariantPhoto = null;
        clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 200);
    });
    vinp.addEventListener('focus', function(){ if(vinp.value.trim().length>=2) doSearch(); });
    document.addEventListener('click', function _outside(e){
        if(!ed.contains(e.target)){ sug.classList.remove('open'); }
    });
    function ensureCompsBucket(){
        var p = pendingEdits[it.item_id] || {};
        if(!p.components) p.components = {};
        pendingEdits[it.item_id] = p;
        return p.components;
    }
    function commit(){
        if(!comp.comp_id){ cancel(); return; }
        var newQty = parseInt(qinp.value, 10);
        if(!(newQty > 0)) newQty = ec.qty_per_set || 1;
        var comps = ensureCompsBucket();
        var rec = comps[comp.comp_id] ? Object.assign({}, comps[comp.comp_id]) : {};
        var changed = false;
        if(pickedVariantId && pickedVariantId !== comp.variant_id){
            rec.variant_id = pickedVariantId;
            rec.variant_name = pickedVariantName || vinp.value;
            if(pickedVariantPhoto!=null) rec.photo = pickedVariantPhoto;
            changed = true;
        }
        if(newQty !== (comp.qty_per_set||1)){
            rec.quantity = newQty;
            changed = true;
        }
        if(rec.delete) delete rec.delete;
        if(changed) comps[comp.comp_id] = rec;
        else if(!Object.keys(rec).length) delete comps[comp.comp_id];
        childEl.classList.remove('editing');
        rerenderComponentLine(orderEl, order, it, comp);
        recalcOrderSummary(orderEl, order);
    }
    function cancel(){
        childEl.classList.remove('editing');
        rerenderComponentLine(orderEl, order, it, comp);
        recalcOrderSummary(orderEl, order);
    }
    function revert(){
        var comps = ensureCompsBucket();
        delete comps[comp.comp_id];
        if(!Object.keys(comps).length){
            delete pendingEdits[it.item_id].components;
            if(!Object.keys(pendingEdits[it.item_id]).length) delete pendingEdits[it.item_id];
        }
        childEl.classList.remove('editing');
        rerenderComponentLine(orderEl, order, it, comp);
        recalcOrderSummary(orderEl, order);
    }
    okBtn.addEventListener('click', commit);
    cancelBtn.addEventListener('click', cancel);
    if(revertEl) revertEl.addEventListener('click', revert);
    qinp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); commit(); } if(e.key==='Escape') cancel(); });
    vinp.addEventListener('keydown', function(e){ if(e.key==='Escape') cancel(); });
    setTimeout(function(){ vinp.focus(); vinp.select(); }, 30);
}

var exportToken = '';
function openExportModal(){
    /* A new token on every open: it is later used to pick up the finished files. */
    exportToken = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    var cf = document.getElementById('or-export-confirm');
    if (cf) { cf.style.display = ''; cf.disabled = false; cf.textContent = 'Download'; }
    var cn = document.getElementById('or-export-cancel');
    if (cn) cn.textContent = 'Cancel';
    /* Restore the fields hidden by the result panel of the previous export. */
    ['or-export-fname', 'or-export-include-packing'].forEach(function(id){
        var el = document.getElementById(id);
        var row = el && el.closest('.em-fname, .em-opt');
        if (row) row.style.display = '';
    });
    var ids=Array.from(selectedIds); if(!ids.length) return;
    pendingEdits = {};  // reset the edits for a new session
    var orders=ids.map(function(id){ return selectedData[id]; }).filter(Boolean);
    /* The same order as in the docx (Order.objects...order_by('created_at')):
       old orders on top → new ones at the bottom.
     */
    orders.sort(function(a, b){
        var ka = a.created_at || '', kb = b.created_at || '';
        if (ka === kb) return (a.id||0) - (b.id||0);
        return ka < kb ? -1 : 1;
    });
    /* "Packing" is a summary page across several orders; for a single one it is
       redundant,
       so the checkbox is unchecked by default (it can be checked manually). Set on EVERY
       open, otherwise the state would remain from the previous export.
     */
    var pkCb = document.getElementById('or-export-include-packing');
    if (pkCb) pkCb.checked = orders.length > 1;
    var dLabels={'nova_poshta':'Nova Poshta','pickup':'Pickup','ukr_poshta':'Ukrposhta'};
    document.getElementById('or-export-fname').value=defaultFilename();
    var body=document.getElementById('or-export-body'); body.innerHTML='';
    orders.forEach(function(o){
        var div=document.createElement('div'); div.className='em-order'; div.dataset.orderId=o.id;
        var phone = (o.customer_phone||'').replace(/\D/g,'');
        if (phone.length === 12 && phone.startsWith('380')) {
            phone = '+380 ' + phone.substr(3,2) + ' ' + phone.substr(5,3) + ' ' + phone.substr(8,2) + ' ' + phone.substr(10,2);
        } else if (phone) {
            phone = '+' + phone;
        }
        var head='<div class="em-order-head"><span class="em-order-num">#'+esc(o.order_number)+'</span>'
            +(o.delivery_type==='pickup'?'<span class="em-order-name">Pickup</span>':'')
            +(o.customer_name?'<span class="em-order-name">'+esc(o.customer_name)+'</span>':'')
            +(phone?'<span class="em-order-phone">'+esc(phone)+'</span>':'')
            +(o.delivery_type==='pickup'?'':'<span class="em-order-addr">'+esc(dLabels[o.delivery_type]||o.delivery_type||'')+(o.delivery_address?': '+esc(o.delivery_address):'')+'</span>')+'</div>';
        /* Order export options: payment at our expense + include comment.
           The word "comment" is clickable and opens the editor.
         */
        var noteText = (o.manager_comment || '').trim();
        var linkCls = 'em-note-link ' + (noteText ? 'has-text' : 'is-empty');
        var opts = '<div class="em-order-opts">'
            +'<label><input type="checkbox" class="em-opt-pay-we" data-order-id="'+o.id+'"'+(o.payment_method==='own_expense'?' checked':'')+'> Payment at our expense</label>'
            +'<label><input type="checkbox" class="em-opt-note" data-order-id="'+o.id+'"> '
            +'Include <span class="'+linkCls+'" data-order-id="'+o.id+'">comment</span> in docx</label>'
            +'</div>';
        /* Inline editor — just a textarea, no extra badges.
           If a manager comment exists, the panel is open right away (so the manager sees
           the comment without an extra click).
         */
        var note = '<div class="em-order-note'+(noteText ? ' open' : '')+'" data-order-id="'+o.id+'">'
            +'<textarea class="em-note-edit" data-order-id="'+o.id+'" placeholder="Enter a comment...">'+esc(noteText)+'</textarea>'
            +'</div>';
        /* We create the container; the line markup itself is built by rerenderItemLine */
        var wrap = document.createElement('div'); wrap.className='em-items';
        (o.items||[]).forEach(function(it,idx){
            var skipCollect = it.is_drop || it.is_course;
            var checked = skipCollect ? '' : 'checked';
            var cls = 'em-item'
                + (it.is_drop?' is-drop':'')
                + (it.is_course?' is-course':'')
                + (skipCollect?' excluded':'');
            /* <div>, not <label>: otherwise a click on any element inside (photo,
               text, even a button) makes the checkbox flicker in some browsers.
             */
            var line = document.createElement('div');
            line.className = cls;
            line.dataset.itemId = it.item_id;
            line.dataset.idx = String(idx+1);
            wrap.appendChild(line);
            // We fill in the content through the shared renderer (below)
            line.innerHTML = '<input type="checkbox" class="em-item-cb" data-item-id="'+it.item_id+'" '+checked+'>';
            if(it.is_bundle && it.bundle_items && it.bundle_items.length){
                var kids = document.createElement('div'); kids.className = 'em-item-children';
                kids.dataset.parentItem = String(it.item_id);
                it.bundle_items.forEach(function(bi){
                    var child = document.createElement('div'); child.className='em-item-child';
                    child.dataset.compKey = String(bi.comp_key || bi.comp_id || '?');
                    kids.appendChild(child);
                });
                wrap.appendChild(kids);
            }
        });
        var summary = document.createElement('div'); summary.className='em-order-summary';
        summary.innerHTML = '<span>Items: <b class="em-sum-qty">0</b></span>'
            + '<span>To pay: <b class="em-sum-price">0 ₴</b></span>';
        div.innerHTML = head + opts + note;
        div.appendChild(wrap);
        div.appendChild(summary);
        body.appendChild(div);
        /* We redraw every line item through rerenderItemLine — this gives the same markup
           with the pencil button + the correct checkbox handler.
         */
        (o.items||[]).forEach(function(it){
            rerenderItemLine(div, o, it);
            if(it.is_bundle && it.bundle_items){
                it.bundle_items.forEach(function(bi){ rerenderComponentLine(div, o, it, bi); });
            }
        });
        recalcOrderSummary(div, o);
        /* Click on the word "comment" (.em-note-link) — toggles the inline editor.
           The "Include in docx" checkbox is a separate click and does not open
           the editor.
         */
        var noteEl = div.querySelector('.em-order-note');
        var linkEl = div.querySelector('.em-note-link');
        if (noteEl && linkEl) {
            var ta = noteEl.querySelector('.em-note-edit');
            function autoResize() {
                if (!ta) return;
                ta.style.height = '0px';
                var h = ta.scrollHeight;
                if (h < 28) h = 28;
                ta.style.height = h + 'px';
            }
            function syncLinkColor() {
                var has = !!(ta && ta.value.trim());
                linkEl.classList.toggle('has-text', has);
                linkEl.classList.toggle('is-empty', !has);
            }
            if (ta) {
                ta.addEventListener('input', function(){
                    autoResize();
                    syncLinkColor();
                });
                ta.style.height = '0px';
                ta.style.height = Math.max(28, ta.scrollHeight) + 'px';
            }
            linkEl.addEventListener('click', function(e){
                e.preventDefault(); e.stopPropagation();
                var open = noteEl.classList.toggle('open');
                if (open) {
                    requestAnimationFrame(autoResize);
                    setTimeout(autoResize, 0);
                    if (ta) setTimeout(function(){ ta.focus(); }, 0);
                }
            });
        }
    });
    document.getElementById('or-export-modal').classList.add('open');
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    setTimeout(function(){ document.getElementById('or-export-fname').select(); },50);
}
function closeExportModal(){
    document.getElementById('or-export-modal').classList.remove('open');
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
}
function submitDocx(fname){
    var ids=Array.from(selectedIds);
    var form=document.createElement('form'); form.method='POST'; form.action='/admin/orders/generate-docx/';
    var m=document.cookie.match(/csrftoken=([^;]+)/);
    var ci=document.createElement('input'); ci.type='hidden'; ci.name='csrfmiddlewaretoken'; ci.value=m?m[1]:''; form.appendChild(ci);
    var fn=document.createElement('input'); fn.type='hidden'; fn.name='filename'; fn.value=fname; form.appendChild(fn);
    var pk=document.getElementById('or-export-include-packing');
    var ip=document.createElement('input'); ip.type='hidden'; ip.name='include_packing'; ip.value=(pk && pk.checked)?'1':'0'; form.appendChild(ip);
    ids.forEach(function(id){ var inp=document.createElement('input'); inp.type='hidden'; inp.name='ids[]'; inp.value=id; form.appendChild(inp); });
    /* Excluded order items: all checkboxes that are NOT checked */
    document.querySelectorAll('#or-export-body .em-item-cb').forEach(function(cb){
        if(!cb.checked){
            var inp=document.createElement('input'); inp.type='hidden'; inp.name='excluded_item_ids[]'; inp.value=cb.dataset.itemId; form.appendChild(inp);
        }
    });
    /* Order options: "payment at our expense" and "add manager comment". */
    document.querySelectorAll('#or-export-body .em-opt-pay-we').forEach(function(cb){
        if(cb.checked){
            var inp=document.createElement('input'); inp.type='hidden'; inp.name='pay_we_order_ids[]'; inp.value=cb.dataset.orderId; form.appendChild(inp);
        }
    });
    document.querySelectorAll('#or-export-body .em-opt-note').forEach(function(cb){
        if(cb.checked){
            var oid = cb.dataset.orderId;
            var inp=document.createElement('input'); inp.type='hidden'; inp.name='note_order_ids[]'; inp.value=oid; form.appendChild(inp);
            /* We take the text from the edited textarea, not from the comment hidden in the DB. */
            var ta = document.querySelector('#or-export-body .em-note-edit[data-order-id="'+oid+'"]');
            var txt = ta ? ta.value : '';
            var inpTxt = document.createElement('input'); inpTxt.type='hidden';
            inpTxt.name='note_text_'+oid; inpTxt.value = txt;
            form.appendChild(inpTxt);
        }
    });
    /* Inline edits: we send only the fields that were actually changed */
    var editsPayload = {};
    Object.keys(pendingEdits).forEach(function(k){
        var rec = pendingEdits[k];
        var clean = {};
        if(rec.variant_id) clean.variant_id = rec.variant_id;
        if(rec.quantity!=null) clean.quantity = rec.quantity;
        if(rec.bundle_id) clean.bundle_id = rec.bundle_id;
        if(rec.attach_photo) clean.attach_photo = true;
        if(rec.components){
            var comps = {};
            Object.keys(rec.components).forEach(function(ck){
                if(ck === 'new'){
                    if(Array.isArray(rec.components.new) && rec.components.new.length){
                        comps.new = rec.components.new.map(function(n){
                            return { variant_id:n.variant_id, quantity:n.quantity || 1 };
                        });
                    }
                    return;
                }
                var c = rec.components[ck];
                var cc = {};
                if(c.delete) cc.delete = true;
                if(c.variant_id) cc.variant_id = c.variant_id;
                if(c.quantity!=null) cc.quantity = c.quantity;
                if(c.attach_photo) cc.attach_photo = true;
                if(Object.keys(cc).length) comps[ck] = cc;
            });
            if(Object.keys(comps).length) clean.components = comps;
        }
        if(Object.keys(clean).length) editsPayload[k] = clean;
    });
    if(Object.keys(editsPayload).length){
        var ej=document.createElement('input'); ej.type='hidden'; ej.name='edits_json'; ej.value=JSON.stringify(editsPayload); form.appendChild(ej);
    }
    /* Instruction options + export token. */
    var inclIns = document.getElementById('or-export-include-instructions');
    var wantIns = !inclIns || inclIns.checked;
    /* We don't ask about duplex: the backend turns it on itself if at least one of the
       instructions is two pages long. Copies per number of bundles are always made: a bundle
       ALWAYS comes with an instruction, so three bundles in an order = three sheets.
     */
    [['export_token', exportToken],
     ['include_instructions', wantIns ? '1' : '0'],
    ].forEach(function(kv){
        var i=document.createElement('input'); i.type='hidden'; i.name=kv[0]; i.value=kv[1]; form.appendChild(i);
    });

    /* fetch, not form.submit(): this POST MUTATES THE DB (stock, bundle stock,
       totals), so it can't be repeated just to get a second file. One request produces
       both files, and the browser picks them up ready-made by token — in two separate
       clicks, because Chromium blocks a second download from a single gesture.
     */
    var btn = document.getElementById('or-export-confirm');
    var oldLabel = btn.textContent;
    btn.disabled = true; btn.textContent = 'Preparing…';
    var fd = new FormData(form);
    fetch('/admin/orders/generate-docx/', { method:'POST', body: fd, credentials:'same-origin' })
        .then(function(r){
            if (r.headers.get('content-type','').indexOf('application/json') === -1) {
                /* The backend responded with a file (old branch) or an error — we don't break. */
                return r.blob().then(function(b){ return { _blob: b }; });
            }
            return r.json();
        })
        .then(function(d){
            btn.disabled = false; btn.textContent = oldLabel;
            if (d._blob) { closeExportModal(); return; }
            renderExportResult(d);
        })
        .catch(function(e){
            btn.disabled = false; btn.textContent = oldLabel;
            alert('Export failed: ' + e);
        });
}

/* Result panel instead of a modal: two separate clicks for the two files. */
function renderExportResult(d){
    var body = document.getElementById('or-export-body');
    if (d.error) { body.innerHTML = '<div style="padding:20px;color:#b91c1c;">' + d.error + '</div>'; return; }

    /* The result screen has only download buttons and warnings. The name field
       and checkboxes apply to the NEXT export; here they would only confuse.
     */
    ['or-export-fname', 'or-export-include-packing'].forEach(function(id){
        var el = document.getElementById(id);
        var row = el && el.closest('.em-fname, .em-opt');
        if (row) row.style.display = 'none';
    });

    /* Both buttons in one row: they are two equal files of the same export, not a
       primary action and a secondary one. flex:1 — so they split the width equally.
     */
    var btn = 'flex:1;height:auto;text-align:center;padding:14px 16px;'
            + 'text-decoration:none;line-height:1.35;';

    var h = '<div style="padding:22px;display:flex;flex-direction:column;gap:14px;">';
    h += '<div style="display:flex;gap:12px;">';
    h += '<a class="em-btn primary" style="' + btn + '" href="' + d.docx_url + '">Orders (.docx)</a>';
    if (d.pdf_url) {
        h += '<a class="em-btn primary" style="' + btn + '" href="' + d.pdf_url + '">Instructions (.docx)</a>';
    }
    h += '</div>';
    if (d.placeholders && d.placeholders.length) {
        var n = d.placeholders.length;
        var word = n === 1 ? ' bundle' : ' bundles';
        /* We build the lines ONCE: the same lines go both to the screen and to the clipboard —
           otherwise the copied text would eventually diverge from what the person sees.
         */
        var lines = d.placeholders.map(function(p){
            return 'order ' + p.order_number + ' — ' + p.bundle + ': ' + p.reason +
                   (p.summary ? ' (' + p.summary + ')' : '');
        });
        h += '<div style="border:1px solid #fecaca;background:#fef2f2;border-radius:8px;padding:12px 14px;">' +
             '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">' +
             '<div style="font-weight:700;color:#b91c1c;font-size:13px;flex:1;">' +
             n + word + ' without instructions — include a paper copy</div>' +
             '<span role="button" tabindex="0" class="or-export-copy" ' +
             'style="font-size:11px;font-weight:600;padding:4px 10px;border-radius:5px;' +
             'cursor:pointer;border:1px solid #fca5a5;background:#fff;color:#b91c1c;' +
             'user-select:none;white-space:nowrap;">Copy</span></div>' +
             '<ul style="margin:0;padding-left:18px;font-size:12px;color:#7f1d1d;">';
        lines.forEach(function(t){ h += '<li>' + t + '</li>'; });
        h += '</ul></div>';
        pendingCopyText = lines.join('\n');
    } else {
        pendingCopyText = '';
    }
    /* Sheets where the composition was changed and the name was filled in by the machine. They are
       PRINTED —
       this is not an error but a place where the person needs to check the dose: recalculating it
       automatically doesn't always work, and this is where that is stated.
     */
    if (d.substituted && d.substituted.length) {
        var sl = d.substituted.map(function(p){
            return 'order ' + p.order_number + ' — ' + p.bundle + ': ' + (p.summary || 'composition changed');
        });
        h += '<div style="border:1px solid #fde68a;background:#fffbeb;border-radius:8px;padding:12px 14px;">' +
             '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">' +
             '<div style="font-weight:700;color:#92400e;font-size:13px;flex:1;">' +
             'Changed composition — the instructions were filled in automatically, check the dose</div>' +
             '<span role="button" tabindex="0" class="or-export-copy" ' +
             'style="font-size:11px;font-weight:600;padding:4px 10px;border-radius:5px;' +
             'cursor:pointer;border:1px solid #fcd34d;background:#fff;color:#92400e;' +
             'user-select:none;white-space:nowrap;">Copy</span></div>' +
             '<ul style="margin:0;padding-left:18px;font-size:12px;color:#78350f;">';
        sl.forEach(function(t){ h += '<li>' + t + '</li>'; });
        h += '</ul></div>';
        pendingCopyText = (pendingCopyText ? pendingCopyText + '\n' : '') + sl.join('\n');
    }
    (d.warnings || []).forEach(function(w){
        h += '<div style="border:1px solid #e5e7eb;background:#f9fafb;border-radius:8px;padding:10px 12px;font-size:12px;color:#6b7280;">' + w + '</div>';
    });
    h += '</div>';
    body.innerHTML = h;

    /* There may be two buttons (unchecked and substituted), but they copy the same
       thing — the whole list of warnings: the manager pastes it in one go.
     */
    Array.prototype.forEach.call(document.querySelectorAll('.or-export-copy'), function(btn){
        btn.addEventListener('click', function(){ exportCopyText(pendingCopyText, btn); });
    });

    document.getElementById('or-export-confirm').style.display = 'none';
    document.getElementById('or-export-cancel').textContent = 'Close';
}

/* Text of the last "no instruction" list — the same as on screen. */
var pendingCopyText = '';

function exportCopyText(text, btn){
    function done(ok){
        var old = btn.textContent;
        btn.textContent = ok ? 'Copied' : 'Failed';
        setTimeout(function(){ btn.textContent = old; }, 1800);
    }
    if (!text) { done(false); return; }
    /* navigator.clipboard exists only in a secure context. Prod is on https, but
       the local admin may be on http — then we fall back to textarea+execCommand,
       otherwise the button would silently do nothing.
     */
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function(){ done(true); },
                                                 function(){ done(false); });
        return;
    }
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    done(ok);
}

document.addEventListener('DOMContentLoaded', function(){
    var genBtn=document.getElementById('or-gen-top-btn');
    if(genBtn) genBtn.addEventListener('click', openExportModal);
    document.getElementById('or-export-close').addEventListener('click', closeExportModal);
    document.getElementById('or-export-cancel').addEventListener('click', closeExportModal);
    document.getElementById('or-export-modal').addEventListener('click', function(e){ if(e.target===this) closeExportModal(); });
    document.getElementById('or-export-confirm').addEventListener('click', function(){
        /* closeExportModal() WAS here and was removed: the modal becomes a result panel
           with links to both files.
         */
        submitDocx(document.getElementById('or-export-fname').value.trim() || defaultFilename());
    });
    updateActionBar();
    if(window._updateCounter) window._updateCounter();
    /* cl-bar is assembled in base_site.html on DOMContentLoaded — this is the only place
       where our "Reset filters" button can be inserted.
     */
    _renderResetBtn();
});

document.addEventListener('keydown', function(e){ if(e.key==='Escape') closePop(); });

/* ── Init ── */
/* We do NOT restore the list state on entry: we always show the fresh first page
   that the server has already rendered (allData/srvMeta). Previously, restoring the state made
   a repeated request to the server — and the table "reloaded by itself"/jumped
   a second after opening. Filtering/sorting/pagination work within
   the current session (without reload).
 */
function _hasActiveState(){
    return !!(sortField || currentPage > 1 || (pageSize && pageSize !== (srvMeta.page_size||25)) ||
        (F.numMode==='exact'&&F.numExact) || (F.numMode==='range'&&(F.numFrom||F.numTo)) ||
        F.clientQ || (F.statuses&&F.statuses.length) || F.payment!=='all' || F.delivery!=='all' ||
        F.dateMin || F.dateMax || F.priceMin!=null || F.priceMax!=null ||
        (F.selectedItems&&F.selectedItems.length) || (F.drops&&F.drops.length) ||
        F.commClient!=='all' || F.commManager!=='all' || F.commSource!=='all' || F.imported!=='all');
}
_loadState();
_syncColBadges();
if(_hasActiveState()){
    /* Saved filters/sorting/page → apply in one request
       (replaces the server's first render, without a "jump" a second later).
     */
    fetchOrders();
} else {
    renderRows(allData);
}
})();
</script>
