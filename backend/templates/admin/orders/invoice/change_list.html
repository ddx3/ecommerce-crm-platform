{% extends "admin/change_list.html" %}
{% block pagination %}{% endblock %}
{% block result_list %}
{{ block.super }}
<style>
#result_list { display: none !important; }
#toolbar { display: none !important; }
.results { display: none !important; }

/* ── Table ── */
#inv-list-table { table-layout: auto; width: 100%; border-collapse: collapse !important; border-top: none !important; }
#inv-list-table td, #inv-list-table th { border-top: none !important; }
#inv-list-table thead tr th {
    background: #f9fafb !important; border-bottom: 1px solid #e5e7eb !important;
    border-left: 1px solid #e5e7eb !important; padding: 10px 12px !important;
    font-size: 10px !important; font-weight: 700 !important; text-transform: uppercase !important;
    letter-spacing: 0.4px !important; color: #6b7280 !important; white-space: nowrap !important;
    vertical-align: middle !important; text-align: left !important;
}
#inv-list-table thead tr th:first-child { border-left: none !important; }
#inv-list-table thead tr th.col-cb { padding: 0 0 0 14px !important; width: 44px !important; }
#inv-list-table tbody td.col-cb { width: 44px !important; min-width: 44px !important; max-width: 44px !important; padding: 8px 0 8px 14px !important; }
.inv-cb { cursor: pointer; width: 16px; height: 16px; accent-color: #374151; }
th[data-col] { cursor: pointer !important; user-select: none !important; position: relative !important; }
#inv-list-table thead tr th[data-col] { padding-right: 26px !important; }
#inv-list-table thead tr th[data-col]:hover,
#inv-list-table thead tr th[data-col].col-open { color: #1f2937 !important; }
#inv-list-table thead tr th[data-col].col-on { background: #d1d5db !important; color: #1f2937 !important; }
.th-badge { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; pointer-events: none; }

#inv-list-table tbody tr { border-bottom: 1px solid #e5e7eb !important; height: 56px; }
#inv-list-table.tbl-touches-pager tbody tr:last-child { border-bottom: none !important; }
#inv-list-table tbody tr.row1 { background: #fff !important; }
#inv-list-table tbody tr.row2 { background: #f9fafb !important; }
#inv-list-table tbody tr.inv-pinned { background: #eff6ff !important; }
#inv-list-table tbody tr:hover { background: #eef0f3 !important; }
#inv-list-table tbody tr { cursor: pointer; }
#inv-list-table tbody tr.inv-empty-row, #inv-list-table tbody tr.inv-empty-row:hover { background: #fff !important; cursor: default !important; border-bottom: 1px solid #e5e7eb !important; }
#inv-list-table tbody tr.inv-empty-row td { border-bottom: 1px solid #e5e7eb !important; vertical-align: middle !important; text-align: center !important; padding: 0 !important; color: #9ca3af !important; font-size: 13px !important; }
table.tbl-touches-pager tbody tr.inv-empty-row, table.tbl-touches-pager tbody tr.inv-empty-row td { border-bottom: 1px solid #e5e7eb !important; }
#inv-list-table tbody td {
    padding: 8px 12px !important; font-size: 13px !important; vertical-align: middle !important;
    border-left: 1px solid #e5e7eb !important; border-bottom: none !important;
    font-weight: 400 !important; color: #374151 !important; text-align: left !important;
    overflow: hidden !important; white-space: nowrap !important; height: 56px !important; box-sizing: border-box !important;
}
#inv-list-table tbody td:first-child { border-left: none !important; }
#inv-list-table tbody td a { color: #374151 !important; text-decoration: none !important; pointer-events: none !important; }

/* ── Lightbox ── */
#inv-lightbox { display: none; position: fixed; inset: 0; z-index: 999999; background: rgba(0,0,0,0.82); align-items: center; justify-content: center; cursor: zoom-out; }
#inv-lightbox.open { display: flex; }
#inv-lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }

/* ── Photos ── */
#inv-list-table .col-photo { width: 1%; }
#inv-list-table thead tr th.col-photo { padding-right: 12px !important; }
.pv-photos { display: flex; gap: 3px; }
.pv-photo-wrap { position: relative; display: inline-block; flex-shrink: 0; cursor: zoom-in; }
.pv-photo-wrap img.pv-thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 4px; border: 1px solid #d1d5db; background: #f3f4f6; display: block; transition: filter .15s; }
.pv-photo-wrap:hover img.pv-thumb { filter: brightness(0.82); }
/* .pv-photo-preview — styles moved to base_site.html */

/* Status badge — global .or-picker-btn (data-tone), CRM standard. */

/* ── Popover ── */
#inv-flt-pop {
    display: none; position: fixed; z-index: 9999; background: #fff;
    border: 1px solid #e5e7eb; border-radius: 0 0 6px 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,.18);
    overflow: hidden;
    width: 220px;
}
#inv-flt-pop.open { display: block; }
.fp-sort-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; border-bottom: 1px solid #ececec;
    background: #fff; color: #374151; font-size: 13px;
    cursor: pointer; width: 100%; text-align: left;
    border-left: none; border-right: none; border-top: none;
}
.fp-sort-row:last-of-type { border-bottom: 1px solid #e5e7eb; }
.fp-sort-row:hover { background: #f5f5f5; }
.fp-sort-row.on { background: #e5e7eb; color: #374151; }
.fp-sort-arr { color: #d1d5db; font-size: 18px; line-height: 1; flex-shrink: 0; display: inline-flex; align-items: center; }
.fp-sort-row.on .fp-sort-arr { color: #374151; }
.fp-pop-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.fp-filter-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: #9ca3af; margin-bottom: 6px; }
.fp-divider { height: 1px; background: #e5e7eb; margin: 8px 0; }
.fp-item { display: flex; align-items: center; gap: 6px; padding: 0; font-size: 13px; line-height: 1; color: #374151; border-radius: 3px; }
.fp-item input[type=radio] { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; flex-shrink: 0; border: 1.5px solid #d1d5db; border-radius: 50%; background: #fff; cursor: pointer; position: relative; margin: 0; transition: background .12s, border-color .12s; }
.fp-item input[type=radio]:hover { border-color: #9ca3af; }
.fp-item input[type=radio]:checked { background: #1f2937; border-color: #1f2937; }
.fp-item input[type=radio]:checked::after { content: ''; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px; border: 1.5px solid #fff; border-top: none; border-left: none; transform: rotate(45deg); }

/* ── Calendar ── */
.cal-nav { display:flex; align-items:center; justify-content:space-between; padding:8px 10px 4px; }
.cal-nav-btn { background:#f9fafb; border:1px solid #d1d5db; border-radius:4px; width:26px; height:26px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:#374151; font-size:16px; line-height:1; padding:0; flex-shrink:0; }
.cal-nav-btn:hover { background:#e5e7eb; border-color:#9ca3af; }
.cal-title { font-size:12px; font-weight:600; color:#374151; text-align:center; flex:1; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); padding:0 6px 0; }
.cal-dow { font-size:10px; color:#9ca3af; text-align:center; padding:2px 0 5px; font-weight:600; }
.cal-day { font-size:12px; text-align:center; padding:5px 0; cursor:pointer; color:#374151; user-select:none; border-radius:4px; }
.cal-day.empty { cursor:default; pointer-events:none; }
.cal-day:not(.empty):not(.sel-start):not(.sel-end):hover { background:#d1d5db; }
.cal-day.today { font-weight:700; color:#111; }
.cal-day.sel-start, .cal-day.sel-end { background:#1f2937; color:#fff; border-radius:4px; }
.cal-day.in-range { background:#e5e7eb; border-radius:0; }
.cal-day.sel-start.has-range { border-radius:4px 0 0 4px; }
.cal-day.sel-end.has-range   { border-radius:0 4px 4px 0; }
.cal-reset { display:block; text-align:center; padding:0 10px 10px; font-size:11px; color:#9ca3af; cursor:pointer; background:none; border:none; width:100%; }
.cal-reset:hover { color:#dc2626; }

#content-main, #content { padding-bottom: 0 !important; }

/* ── Pager ── */
#inv-pager { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 10px 16px; font-size: 13px; color: #6b7280;
    border-top: 1px solid #e5e7eb; position: fixed; bottom: 0; right: 0; background: #fff; z-index: 1000; }
#inv-pager .pager-info { font-size: 12px; color: #9ca3af; }
#inv-pager .pg-btn { display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border: 1px solid #d1d5db; border-radius: 4px;
    background: #fff; color: #374151; font-size: 13px; cursor: pointer; line-height: 1; user-select: none; box-sizing: border-box; }
#inv-pager .pg-btn:hover { background: #f3f4f6; }
#inv-pager .pg-btn.pg-active { background: #1f2937; color: #fff; border-color: #1f2937; }
#inv-pager .pg-btn.pg-disabled { opacity: 0.35; pointer-events: none; }
#inv-pager .pager-nav { display: flex; align-items: center; gap: 4px; justify-self: center; }
#inv-pager .pager-right { display: flex; align-items: center; gap: 4px; justify-self: end; }
#inv-pager .pager-size { display: flex; align-items: center; gap: 4px; font-size: 12px; }
#inv-pager .pager-size > span:first-child { color: #9ca3af; }
#inv-pager .pager-size .pg-btn { width: auto; min-width: 36px; padding: 0 8px; }
</style>

<div id="inv-lightbox"><img id="inv-lightbox-img" src="" alt=""></div>
<div id="inv-flt-pop"></div>
<table id="inv-list-table"></table>
<div id="inv-pager"></div>

<script>
(function(){
var allData = {{ invoices_json|safe }};
var F = { photos: 'all', statuses: [], invDateMin: null, invDateMax: null, confDateMin: null, confDateMax: null, createdDateMin: null, createdDateMax: null, selectedItems: [], itemsMode: 'and' };
/* Catalog of products across all invoices (for searching in the items filter). allData holds
   ALL invoices (pagination is client-side), so the facet is complete.
 */
var allInvItems = (function(){
    var map = {};
    allData.forEach(function(inv){
        (inv.items||[]).forEach(function(it){
            var k = (it.name||'').toLowerCase(); if(!k) return;
            if(!map[k]) map[k] = { name: it.name, sku: it.sku||'', photo: it.photo||null, is_own: !!it.is_own };
            else if(it.is_own) map[k].is_own = true;
        });
    });
    return Object.keys(map).map(function(k){ return map[k]; })
        .sort(function(a,b){ return a.name.localeCompare(b.name,'uk'); });
})();
var sortField = null, sortDir = 'asc';
var currentPage = 1, pageSize = 50;
/* ── Persist table state (filters/sorting/page size) ── */
var STATE_KEY='invoice_list_state_v1';
function _saveState(){ try{ localStorage.setItem(STATE_KEY, JSON.stringify({F:F, sortField:sortField, sortDir:sortDir, pageSize:pageSize, currentPage:currentPage})); }catch(e){} }
function _loadState(){ try{ var s=JSON.parse(localStorage.getItem(STATE_KEY)||'null'); if(!s) return; if(s.F) Object.assign(F, s.F); if(typeof s.sortField!=='undefined') sortField=s.sortField; if(typeof s.sortDir!=='undefined') sortDir=s.sortDir; if(typeof s.pageSize!=='undefined') pageSize=s.pageSize; if(typeof s.currentPage!=='undefined') currentPage=s.currentPage; }catch(e){} }
_loadState();
/* Row selection (cross-page, as on products/reviews): name=_selected_action —
   so that the "Delete" button in the base_site cl-bar works with the standard delete.
   SEL stores STRING ids.
 */
var SEL = new Set();
var currentRows = [];
function _findById(id){ for(var k=0;k<allData.length;k++){ if(String(allData[k].id)===String(id)) return allData[k]; } return null; }
var pop = document.getElementById('inv-flt-pop');
var popOwner = null;
var lightbox = document.getElementById('inv-lightbox');
var lightboxImg = document.getElementById('inv-lightbox-img');
lightbox.addEventListener('click', function(){ lightbox.classList.remove('open'); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') lightbox.classList.remove('open'); });

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dateCmp(str){ var m=str&&str.match(/^(\d{2})\.(\d{2})\.(\d{4})/); return m?m[3]+'-'+m[2]+'-'+m[1]:null; }

/* ── Calendar helpers ── */
var CAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var CAL_DOWS   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function calParseYMD(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function calToYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function calSameDay(a,b){ return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

function applyFilters(data){
    return data.filter(function(inv){
        if(F.photos==='with' && !(inv.photos&&inv.photos.length)) return false;
        if(F.photos==='without' && (inv.photos&&inv.photos.length)) return false;
        if(F.statuses.length && F.statuses.indexOf(inv.status)===-1) return false;
        if(F.invDateMin||F.invDateMax){
            var d = dateCmp(inv.invoice_date);
            if(F.invDateMin && (!d||d<F.invDateMin)) return false;
            if(F.invDateMax && (!d||d>F.invDateMax)) return false;
        }
        if(F.confDateMin||F.confDateMax){
            var c = dateCmp(inv.action_at);
            if(F.confDateMin && (!c||c<F.confDateMin)) return false;
            if(F.confDateMax && (!c||c>F.confDateMax)) return false;
        }
        if(F.createdDateMin||F.createdDateMax){
            var cr = dateCmp(inv.created_at);
            if(F.createdDateMin && (!cr||cr<F.createdDateMin)) return false;
            if(F.createdDateMax && (!cr||cr>F.createdDateMax)) return false;
        }
        if(F.selectedItems.length){
            var sel = F.selectedItems.map(function(n){ return n.toLowerCase(); });
            var have = (inv.items||[]).map(function(it){ return (it.name||'').toLowerCase(); });
            var ok = F.itemsMode==='or'
                ? sel.some(function(n){ return have.indexOf(n)!==-1; })
                : sel.every(function(n){ return have.indexOf(n)!==-1; });
            if(!ok) return false;
        }
        return true;
    });
}

/* Quantity of units of each product in invoices filtered by everything EXCEPT the items filter
   itself — so that the counters in the popup don't collapse when a product is selected.
 */
function calcFilteredQty(){
    var qty = {};
    var save = F.selectedItems; F.selectedItems = [];
    var rows = applyFilters(allData);
    F.selectedItems = save;
    rows.forEach(function(inv){
        (inv.items||[]).forEach(function(it){
            var k = (it.name||'').toLowerCase();
            if(k) qty[k] = (qty[k]||0) + (it.qty||1);
        });
    });
    return qty;
}

function applySort(data){
    if(!sortField) return data;
    return data.slice().sort(function(a,b){
        var va,vb;
        if(sortField==='invoice_date'){ va=dateCmp(a.invoice_date)||''; vb=dateCmp(b.invoice_date)||''; }
        else if(sortField==='items'){ va=a.items_confirmed; vb=b.items_confirmed; }
        else if(sortField==='status'){ va=a.status; vb=b.status; }
        else if(sortField==='action_at'){ va=dateCmp(a.action_at)||''; vb=dateCmp(b.action_at)||''; }
        else if(sortField==='created_at'){ va=dateCmp(a.created_at)||''; vb=dateCmp(b.created_at)||''; }
        else return 0;
        return va<vb?(sortDir==='asc'?-1:1):va>vb?(sortDir==='asc'?1:-1):0;
    });
}

function _invCells(inv, isChecked){
    var statusLabel = inv.status==='confirmed' ? 'Confirmed' : inv.status==='reverted' ? 'Reverted' : 'Pending';
    var statusTone = inv.status==='confirmed' ? 'ok' : inv.status==='reverted' ? 'warn' : 'neutral';
    var statusBadge = '<span class="or-picker-btn is-static" data-field="status" data-val="'+esc(inv.status)+'" data-tone="'+statusTone+'"><span>'+statusLabel+'</span></span>';
    var itemsCell = inv.items_confirmed + ' / ' + inv.items_total;
    var checked = isChecked ? ' checked' : '';
    return '<td class="col-cb"><input type="checkbox" class="inv-cb inv-row-cb" name="_selected_action" value="'+inv.id+'" data-id="'+inv.id+'"'+checked+'></td>' +
        '<td class="col-photo"></td>' +
        '<td><a href="'+inv.id+'/change/">'+(inv.invoice_date||'—')+'</a></td>' +
        '<td>'+itemsCell+'</td>' +
        '<td>'+statusBadge+'</td>' +
        '<td>'+(inv.action_at||'—')+'</td>' +
        '<td>'+(inv.created_at||'—')+'</td>';
}

function renderTable(){
    _renderResetBtn();
    _saveState();
    var data = applySort(applyFilters(allData));
    currentRows = data;
    var table = document.getElementById('inv-list-table');

    var heads = [
        {col:'invoice_date', label:'Invoice date'},
        {col:'items',        label:'Items'},
        {col:'status',       label:'Status'},
        {col:'action_at', label:'Action date'},
        {col:'created_at',   label:'Creation date'},
    ];
    var photoOn = F.photos !== 'all';
    var photoBadge = photoOn
        ? '<span class="th-badge"><svg width="9" height="10" viewBox="0 0 10 11" fill="#374151"><path d="M0 0h10L6.5 5v6h-3V5z"></path></svg></span>'
        : '<span class="th-badge"></span>';
    var thead = '<thead><tr><th class="col-cb"><input type="checkbox" class="inv-cb" id="inv-cb-all"></th>' +
        '<th class="col-photo' + (photoOn ? ' col-on' : '') + '" data-col="photos">Photo' + photoBadge + '</th>';
    heads.forEach(function(h){
        var on = sortField===h.col;
        var hasFilter = (h.col==='status' && F.statuses.length) ||
                        (h.col==='items' && F.selectedItems.length) ||
                        (h.col==='invoice_date' && (F.invDateMin||F.invDateMax)) ||
                        (h.col==='action_at' && (F.confDateMin||F.confDateMax)) ||
                        (h.col==='created_at' && (F.createdDateMin||F.createdDateMax));
        var active = on || hasFilter;
        var badge = active ? '<span class="th-badge"><svg width="9" height="10" viewBox="0 0 10 11" fill="#374151"><path d="M0 0h10L6.5 5v6h-3V5z"></path></svg></span>' : '<span class="th-badge"></span>';
        thead += '<th data-col="'+h.col+'"'+(active?' class="col-on"':'')+'>'+h.label+badge+'</th>';
    });
    thead += '</tr></thead>';

    /* Pagination: slice currentRows into a page. pageSize===0 => all. */
    var pageSz = pageSize===0 ? (data.length||1) : pageSize;
    var pages = Math.ceil(data.length / pageSz) || 1;
    if(currentPage > pages) currentPage = pages;
    if(currentPage < 1) currentPage = 1;
    var from = (currentPage-1)*pageSz;
    var slice = data.slice(from, from+pageSz);

    /* pinned: selected rows that are not on the current page (cross-page) — at the top */
    var visibleIds={}; slice.forEach(function(inv){ visibleIds[String(inv.id)]=1; });
    var pinned=[];
    SEL.forEach(function(id){ if(visibleIds[String(id)]) return; var o=_findById(id); if(o) pinned.push(o); });

    var tbody = '<tbody>';
    if(!slice.length && !pinned.length){
        tbody += '<tr class="inv-empty-row"><td colspan="7" style="height:56px;box-sizing:border-box;">No results</td></tr>';
    }
    pinned.forEach(function(inv, i){
        tbody += '<tr class="row'+(i%2===0?1:2)+' inv-pinned" data-id="'+inv.id+'" data-photos="'+JSON.stringify(inv.photos||[]).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+_invCells(inv, true)+'</tr>';
    });
    slice.forEach(function(inv, i){
        tbody += '<tr class="row'+(i%2===0?1:2)+'" data-id="'+inv.id+'" data-photos="'+JSON.stringify(inv.photos||[]).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+_invCells(inv, SEL.has(String(inv.id)))+'</tr>';
    });
    tbody += '</tbody>';

    table.innerHTML = thead + tbody;
    if(window.padChangelistTable) window.padChangelistTable(table);

    /* Build photo cells with DOM (for mouseenter + click events) */
    table.querySelectorAll('tr[data-photos]').forEach(function(tr){
        var photos = JSON.parse(tr.dataset.photos || '[]');
        var td = tr.querySelector('.col-photo');
        if(!photos.length || !td) return;
        var photosDiv = document.createElement('div'); photosDiv.className = 'pv-photos';
        photos.forEach(function(url){
            var wrap = document.createElement('div'); wrap.className = 'pv-photo-wrap';
            var thumb = document.createElement('img'); thumb.className = 'pv-thumb'; thumb.src = url;
            thumb.onerror = function(){ wrap.style.display = 'none'; };
            var preview = document.createElement('div'); preview.className = 'pv-photo-preview';
            var pi = document.createElement('img'); pi.src = url; preview.appendChild(pi);
            wrap.appendChild(thumb); wrap.appendChild(preview);
            wrap.addEventListener('mouseenter', function(){
                var r = wrap.getBoundingClientRect();
                preview.style.left = (window.clX ? window.clX(r.left) : r.left) + 'px';
                preview.style.top = (window.clX ? window.clX(r.bottom + 6) : (r.bottom + 6)) + 'px';
            });
            wrap.addEventListener('click', function(e){
                e.stopPropagation();
                lightboxImg.src = url;
                lightbox.classList.add('open');
            });
            photosDiv.appendChild(wrap);
        });
        td.appendChild(photosDiv);
    });

    _syncCbAll();
    _updateInvCounter();
    table.querySelector('tbody').addEventListener('click', function(e){
        if(e.button!==0) return;
        if(e.target.closest('.col-cb')) return;
        var tr = e.target.closest('tr[data-id]');
        if(tr) window.location.href = tr.dataset.id + '/change/';
    });
    var theadEl = table.querySelector('thead');
    theadEl.addEventListener('click', function(e){
        var th = e.target.closest('th[data-col]');
        if(!th) return;
        e.stopPropagation();
        var fn = colBuilders[th.dataset.col];
        if(fn) openPop(th, fn);
    });
    /* theadEl.addEventListener('mouseleave', ...) -- disabled: keep popup open on mouseleave */
    renderPager();
}

/* ── Pager ── */
function renderPager(){
    _saveState();
    var pager = document.getElementById('inv-pager');
    if(!pager) return;
    var total = currentRows.length;
    pager.style.display = total > 50 ? '' : 'none';
    var pageSz = pageSize===0 ? (total||1) : pageSize;
    var pages = Math.ceil(total/pageSz) || 1;
    if(currentPage > pages) currentPage = pages;
    if(currentPage < 1) currentPage = 1;
    var from = total===0 ? 0 : (currentPage-1)*pageSz+1;
    var to = Math.min(currentPage*pageSz, total);
    var SVG_PREV='<svg width="6" height="10" viewBox="0 0 6 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,1 1,5 5,9"/></svg>';
    var SVG_NEXT='<svg width="6" height="10" viewBox="0 0 6 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,1 5,5 1,9"/></svg>';
    function pgBtn(label, page, active, disabled){
        var cls = 'pg-btn'+(active?' pg-active':'')+(disabled?' pg-disabled':'');
        return '<span class="'+cls+'" data-page="'+page+'">'+label+'</span>';
    }
    var nav = '';
    nav += pgBtn(SVG_PREV, currentPage-1, false, currentPage===1);
    for (var i=1; i<=pages; i++) nav += pgBtn(i, i, i===currentPage, false);
    nav += pgBtn(SVG_NEXT, currentPage+1, false, currentPage===pages);
    pager.innerHTML =
        '<span class="pager-info">'+from+'–'+to+' of '+total+'</span>'+
        '<div class="pager-nav">'+nav+'</div>'+
        '<div class="pager-right"><div class="pager-size"><span>Per page:</span>'+
          '<span class="pg-btn '+(pageSize===25?'pg-active':'')+'" data-size="25">25</span>'+
          '<span class="pg-btn '+(pageSize===50?'pg-active':'')+'" data-size="50">50</span>'+
          '<span class="pg-btn '+(pageSize===0?'pg-active':'')+'" data-size="0">All</span>'+
        '</div></div>';
    pager.querySelectorAll('.pg-btn[data-size]').forEach(function(b){
        b.addEventListener('click', function(){ pageSize = parseInt(b.dataset.size); if(isNaN(pageSize)) pageSize=50; currentPage=1; renderTable(); });
    });
    pager.querySelectorAll('.pg-btn[data-page]').forEach(function(b){
        b.addEventListener('click', function(){ currentPage = parseInt(b.dataset.page); renderTable(); });
    });
}

/* ── Popover ── */
function closePop(){
    pop.classList.remove('open');
    if(popOwner){ popOwner.classList.remove('col-open'); popOwner=null; }
}

function openPop(th, buildFn){
    if(popOwner===th && pop.classList.contains('open')){ closePop(); return; }
    popOwner = th;
    pop.innerHTML = '';
    buildFn();
    var resetBar = document.createElement('button'); resetBar.type='button';
    resetBar.textContent = 'Reset filter';
    resetBar.style.cssText = 'display:block;width:100%;padding:10px;border:none;border-bottom:1px solid #e5e7eb;background:none;color:#dc2626;font-size:13px;font-weight:500;cursor:pointer;text-align:left;';
    resetBar.addEventListener('mouseenter',function(){ this.style.background='#fef2f2'; });
    resetBar.addEventListener('mouseleave',function(){ this.style.background='none'; });
    resetBar.addEventListener('click',function(){ resetCol(th.dataset.col); closePop(); });
    pop.insertBefore(resetBar, pop.firstChild);
    pop.classList.add('open');
    var r = th.getBoundingClientRect();
    // items: width/left edge were already set by applyFit (to the longest name) — we don't
    // override.
    if(th.dataset.col !== 'items'){
        var pw = 220;
        pop.style.width = pw+'px';
        pop.style.left = (window.clFlipLeft?window.clFlipLeft(r,pw,8):Math.max(8,Math.min(r.left,window.innerWidth-pw-8)))+'px';
    }
    pop.style.top = (window.clFlipTop?window.clFlipTop(r,pop.offsetHeight,0):(r.bottom))+'px';
    th.classList.add('col-open');
}

document.addEventListener('click',function(e){
    if(e.button!==0) return;
    if(!pop.contains(e.target)&&!e.target.closest('th[data-col]')) closePop();
});
function popHasFocus(){ return !!pop.querySelector('input:focus,textarea:focus'); }
function onLeave(e){
    var to=e.relatedTarget;
    if(!to){ if(popHasFocus()) return; closePop(); return; }
    if(pop.contains(to)||to===pop) return;
    if(popOwner&&(popOwner===to||popOwner.contains(to))) return;
    closePop();
}
/* pop.addEventListener('mouseleave',onLeave); -- disabled: keep popup open on mouseleave */

function buildCalPop(getMin, setMin, getMax, setMax){
    var selStart=calParseYMD(getMin()), selEnd=calParseYMD(getMax());
    var pickStep=(selStart&&!selEnd)?2:1;
    var hovDate=null;
    var now=new Date();
    var calYear=(selStart||now).getFullYear(), calMonth=(selStart||now).getMonth();

    var b=popBody(); b.style.padding='0';
    var nav=document.createElement('div'); nav.className='cal-nav';
    var prevBtn=document.createElement('button'); prevBtn.type='button'; prevBtn.className='cal-nav-btn'; prevBtn.innerHTML='<svg width="6" height="10" viewBox="0 0 6 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,1 1,5 5,9"/></svg>';
    var title=document.createElement('span'); title.className='cal-title';
    var nextBtn=document.createElement('button'); nextBtn.type='button'; nextBtn.className='cal-nav-btn'; nextBtn.innerHTML='<svg width="6" height="10" viewBox="0 0 6 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,1 5,5 1,9"/></svg>';
    nav.appendChild(prevBtn); nav.appendChild(title); nav.appendChild(nextBtn);
    b.appendChild(nav);
    var grid=document.createElement('div'); grid.className='cal-grid'; b.appendChild(grid);
    var calSep=document.createElement('div'); calSep.style.cssText='height:1px;background:#e5e7eb;margin:0;'; b.appendChild(calSep);
    var resetBtn=document.createElement('button'); resetBtn.type='button'; resetBtn.className='cal-reset'; resetBtn.textContent='Reset';
    resetBtn.addEventListener('click',function(){ selStart=null; selEnd=null; pickStep=1; setMin(null); setMax(null); renderFiltered(); renderFull(); });
    b.appendChild(resetBtn);

    function effRange(){
        if(pickStep===2&&hovDate&&selStart) return hovDate<selStart?{s:hovDate,e:selStart}:{s:selStart,e:hovDate};
        return {s:selStart,e:selEnd};
    }
    function applyClasses(){
        var r=effRange(), today=new Date();
        grid.querySelectorAll('.cal-day[data-d]').forEach(function(cell){
            var d=calParseYMD(cell.dataset.d);
            var isS=calSameDay(d,r.s), isE=calSameDay(d,r.e), inR=r.s&&r.e&&d>r.s&&d<r.e;
            cell.className='cal-day';
            if(isS) cell.classList.add('sel-start');
            if(isE) cell.classList.add('sel-end');
            if(r.s&&r.e&&!calSameDay(r.s,r.e)&&(isS||isE)) cell.classList.add('has-range');
            if(inR) cell.classList.add('in-range');
            if(calSameDay(d,today)) cell.classList.add('today');
        });
    }
    function renderFull(){
        title.textContent=CAL_MONTHS[calMonth]+' '+calYear;
        grid.innerHTML='';
        CAL_DOWS.forEach(function(d){ var c=document.createElement('div'); c.className='cal-dow'; c.textContent=d; grid.appendChild(c); });
        var firstDay=(new Date(calYear,calMonth,1).getDay()+6)%7;
        var daysInMonth=new Date(calYear,calMonth+1,0).getDate();
        for(var i=0;i<firstDay;i++){ var e=document.createElement('div'); e.className='cal-day empty'; grid.appendChild(e); }
        for(var day=1;day<=daysInMonth;day++){
            var cell=document.createElement('div'); cell.className='cal-day';
            cell.dataset.d=calToYMD(new Date(calYear,calMonth,day)); cell.textContent=day;
            cell.addEventListener('click',function(){
                var date=calParseYMD(this.dataset.d);
                if(pickStep===1){ selStart=date; selEnd=null; pickStep=2; }
                else { if(date<selStart){selEnd=selStart;selStart=date;}else{selEnd=date;} pickStep=1; setMin(calToYMD(selStart)); setMax(calToYMD(selEnd)); renderFiltered(); }
                applyClasses();
            });
            cell.addEventListener('mouseenter',function(){ hovDate=calParseYMD(this.dataset.d); applyClasses(); });
            cell.addEventListener('mouseleave',function(){ hovDate=null; applyClasses(); });
            grid.appendChild(cell);
        }
        applyClasses();
    }
    prevBtn.addEventListener('click',function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderFull(); });
    nextBtn.addEventListener('click',function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderFull(); });
    renderFull();
}

function resetCol(col){
    if(col==='photos') F.photos='all';
    else if(col==='status') F.statuses=[];
    else if(col==='items'){ F.selectedItems=[]; F.itemsMode='and'; }
    else if(col==='invoice_date'){ F.invDateMin=null; F.invDateMax=null; }
    else if(col==='action_at'){ F.confDateMin=null; F.confDateMax=null; }
    else if(col==='created_at'){ F.createdDateMin=null; F.createdDateMax=null; }
    if(sortField===col) sortField=null;
    renderFiltered();
}

/* ── Invoice items filter (search + chips + AND/OR mode) ── */
function _itemPal(letter){
    var p=['#e0e7ff:#6366f1','#fce7f3:#db2777','#dcfce7:#16a34a','#fef9c3:#ca8a04','#ffedd5:#ea580c','#f3e8ff:#9333ea'];
    return p[letter.charCodeAt(0)%p.length].split(':');
}
function _itemEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function _itemHl(text,q){
    if(!q) return esc(text);
    return esc(text).replace(new RegExp('('+_itemEscRe(esc(q))+')','gi'),'<mark style="background:none;color:#1f2937;font-weight:600">$1</mark>');
}
/* Popup width — dynamic, fitted to the longest name in the current list (as in orders). */
function _measureMaxNameWidth(names){
    var probe = document.createElement('span');
    var bf = getComputedStyle(document.body);
    probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;font-size:12px;font-family:'+bf.fontFamily+';';
    document.body.appendChild(probe);
    var maxW = 0;
    for(var i=0;i<names.length;i++){ probe.textContent = names[i] || ''; if(probe.offsetWidth>maxW) maxW = probe.offsetWidth; }
    document.body.removeChild(probe);
    return maxW;
}
/* maxNameW + img(40)+gap(10)+padding(20)+scrollbar(14)+safety(8) = +92. Lower bound 300 — so the controls aren't cramped. */
function _itemPopWidth(names){
    var maxW = names.length ? _measureMaxNameWidth(names) : 0;
    return Math.max(300, Math.min(maxW + 92, window.innerWidth - 32));
}
function buildItemFilter(){
    var b = popBody();

    var modeRow = document.createElement('div');
    modeRow.style.cssText = 'display:flex;gap:4px;';
    function paintMode(){
        modeRow.querySelectorAll('[data-mode]').forEach(function(bb){
            var on = bb.dataset.mode===F.itemsMode;
            bb.style.background = on?'#1f2937':'#fff';
            bb.style.color = on?'#fff':'#6b7280';
            bb.style.borderColor = on?'#1f2937':'#d1d5db';
        });
    }
    [['and','All products'],['or','At least one']].forEach(function(o){
        var btn = document.createElement('button'); btn.type='button';
        btn.textContent = o[1]; btn.dataset.mode = o[0];
        btn.style.cssText = 'flex:1;padding:4px 0;font-size:11px;font-weight:500;border-radius:4px;cursor:pointer;border:1px solid #d1d5db;';
        btn.addEventListener('click', function(){ F.itemsMode=o[0]; paintMode(); renderFiltered(); renderSug(inp.value); });
        modeRow.appendChild(btn);
    });
    b.appendChild(modeRow); paintMode();

    var chipsEl = document.createElement('div');
    chipsEl.style.cssText = 'display:flex;flex-direction:column;gap:3px;';
    b.appendChild(chipsEl);

    var divTop = document.createElement('div'); divTop.style.cssText='height:1px;background:#e5e7eb;margin:0 -10px;';
    b.appendChild(divTop);

    var inp = document.createElement('input'); inp.type='text'; inp.className='fp-search';
    inp.placeholder = 'Product name...';
    b.appendChild(inp);

    /* Packaging type switch: all / own / factory (as in orders). */
    var pkFilter = 'all';
    var pkBar = document.createElement('div'); pkBar.style.cssText = 'display:flex;gap:4px;margin:0 -10px;padding:10px 10px 0;border-top:1px solid #e5e7eb;';
    [['all','All'],['own','Own'],['factory','Factory']].forEach(function(o){
        var btn = document.createElement('button'); btn.type='button'; btn.textContent = o[1];
        btn._paint = function(){
            var on = pkFilter===o[0];
            btn.style.cssText = 'flex:1;padding:4px 8px;font-size:11px;border-radius:4px;cursor:pointer;'+
                'border:1px solid '+(on?'#1f2937':'#e5e7eb')+';background:'+(on?'#1f2937':'#fff')+';color:'+(on?'#fff':'#6b7280')+';transition:all .12s;';
        };
        btn._paint();
        btn.addEventListener('click', function(){ pkFilter=o[0]; pkBar.querySelectorAll('button').forEach(function(bb){bb._paint();}); renderSug(inp.value); });
        pkBar.appendChild(btn);
    });
    b.appendChild(pkBar);

    var sugWrap = document.createElement('div'); sugWrap.style.cssText='margin:0 -10px -10px;overflow:hidden;border-radius:0 0 6px 6px;';
    var sug = document.createElement('div'); sug.className='fp-list'; sug.style.cssText='max-height:340px;overflow-y:auto;padding:0;margin:0;gap:0;border-top:1px solid #e5e7eb;';
    sugWrap.appendChild(sug); b.appendChild(sugWrap);

    /* Popup width fitted to the longest name in the CURRENT list + repositioning (as in orders).
       We reposition ONLY if popOwner is still in the DOM: selecting a product/changing the mode
       calls
       renderTable, which rebuilds thead → popOwner gets detached, its rect becomes {0,0}
       and the popup flew off into the corner. Columns don't move, so with a detached th we keep the
       position.
     */
    function applyFit(matches){
        var names = matches.map(function(m){ return (m.is_own ? 'own ' : '') + (m.name || ''); });
        var need = _itemPopWidth(names);
        pop.style.width = need + 'px';
        if(popOwner && document.body.contains(popOwner)){
            var r = popOwner.getBoundingClientRect();
            pop.style.left = (window.clFlipLeft?window.clFlipLeft(r,need,8):Math.max(8,Math.min(r.left,window.innerWidth-need-8)))+'px';
        }
    }

    function renderChips(){
        chipsEl.innerHTML='';
        chipsEl.style.display = F.selectedItems.length ? 'flex' : 'none';
        F.selectedItems.forEach(function(name){
            var item = allInvItems.find(function(i){ return i.name===name; }) || {name:name, photo:null};
            var chip = document.createElement('span');
            chip.style.cssText = 'display:flex;align-items:center;gap:6px;padding:4px 6px 4px 4px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:4px;font-size:11px;color:#2563eb;width:100%;box-sizing:border-box;min-width:0;';
            var letter = (item.name||'?')[0].toUpperCase();
            if(item.photo){
                var img = document.createElement('img'); img.src=item.photo;
                img.style.cssText='width:16px;height:16px;border-radius:50%;object-fit:cover;flex-shrink:0;';
                chip.appendChild(img);
            } else {
                var av = document.createElement('span');
                av.style.cssText='width:16px;height:16px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;background:#bfdbfe;color:#1d4ed8;';
                av.textContent=letter; chip.appendChild(av);
            }
            var nm = document.createElement('span');
            nm.style.cssText='flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
            nm.textContent = item.name; chip.appendChild(nm);
            var x = document.createElement('button'); x.type='button';
            x.style.cssText='border:none;background:none;cursor:pointer;color:#93c5fd;font-size:16px;line-height:1;padding:0;flex-shrink:0;margin-left:auto;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;';
            x.textContent='×';
            x.addEventListener('mouseenter', function(){ x.style.color='#1d4ed8'; });
            x.addEventListener('mouseleave', function(){ x.style.color='#93c5fd'; });
            x.addEventListener('mousedown', function(e){
                if(e.button!==0) return; e.preventDefault();
                F.selectedItems = F.selectedItems.filter(function(n){ return n!==name; });
                renderFiltered(); renderChips(); renderSug(inp.value);
            });
            chip.appendChild(x); chipsEl.appendChild(chip);
        });
    }

    function renderSug(q){
        sug.innerHTML='';
        var filteredQty = calcFilteredQty();
        var lq = q.toLowerCase().trim();
        /* Without a search — only products from the filtered invoices; with a search — across the whole catalog. */
        var matches = lq
            ? allInvItems.filter(function(i){ return i.name.toLowerCase().indexOf(lq)!==-1; })
            : allInvItems.filter(function(i){ return (filteredQty[(i.name||'').toLowerCase()]||0) > 0; });
        if(pkFilter!=='all'){
            matches = matches.filter(function(i){ return pkFilter==='own' ? !!i.is_own : !i.is_own; });
        }
        matches.sort(function(a,b){
            var qa = filteredQty[(a.name||'').toLowerCase()]||0;
            var qb = filteredQty[(b.name||'').toLowerCase()]||0;
            if((qa>0)!==(qb>0)) return qa>0?-1:1;
            return a.name.localeCompare(b.name,'uk');
        });
        applyFit(matches);   // popup width fitted to the longest name in the current list
        if(!matches.length){
            var em = document.createElement('div'); em.style.cssText='padding:10px 14px;font-size:13px;color:#9ca3af;';
            em.textContent = lq ? 'Nothing found' : 'Start typing a name to search all products';
            sug.appendChild(em); return;
        }
        matches.forEach(function(i){
            var already = F.selectedItems.indexOf(i.name)!==-1;
            var row = document.createElement('div'); row.className='fp-item';
            row.style.cssText='display:flex;align-items:stretch;gap:10px;padding:8px 10px;cursor:pointer;opacity:'+(already?'0.4':'1')+';border-radius:0;';
            var letter=(i.name||'?')[0].toUpperCase();
            if(i.photo){
                var img=document.createElement('img'); img.src=i.photo;
                img.style.cssText='width:40px;height:40px;object-fit:cover;border-radius:3px;border:1px solid #e5e7eb;flex-shrink:0;';
                row.appendChild(img);
            } else {
                var colors=_itemPal(letter);
                var av=document.createElement('div');
                av.style.cssText='width:40px;height:40px;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:'+colors[0]+';color:'+colors[1]+';';
                av.textContent=letter; row.appendChild(av);
            }
            var txt=document.createElement('div');
            txt.style.cssText='min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;';
            var nm=document.createElement('div');
            nm.style.cssText='font-size:12px;line-height:1.35;padding-bottom:2px;color:#1f2937;display:flex;align-items:baseline;';
            var ownBadge=i.is_own?'<span style="font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.4px;font-weight:600;margin-right:6px;flex-shrink:0;">own</span>':'';
            nm.innerHTML=ownBadge+'<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+_itemHl(i.name, lq)+'</span>';
            var bot=document.createElement('div');
            bot.style.cssText='display:flex;align-items:flex-end;justify-content:space-between;gap:6px;';
            var sk=document.createElement('div'); sk.style.cssText='font-size:11px;color:#9ca3af;'; sk.textContent=i.sku||'';
            bot.appendChild(i.sku?sk:document.createElement('span'));
            var iq=filteredQty[(i.name||'').toLowerCase()]||0;
            var qEl=document.createElement('div'); qEl.style.cssText='font-size:11px;color:#9ca3af;flex-shrink:0;'; qEl.textContent=iq||'';
            bot.appendChild(qEl);
            txt.appendChild(nm); txt.appendChild(bot); row.appendChild(txt);
            row.addEventListener('mousedown', function(e){
                if(e.button!==0) return; e.preventDefault();
                if(already){ F.selectedItems=F.selectedItems.filter(function(n){ return n!==i.name; }); }
                else { F.selectedItems.push(i.name); inp.value=''; }
                renderFiltered(); renderChips(); renderSug(inp.value);
            });
            row.addEventListener('mouseenter', function(){ row.style.background='#f3f4f6'; });
            row.addEventListener('mouseleave', function(){ row.style.background=''; });
            sug.appendChild(row);
        });
    }

    inp.addEventListener('input', function(){ renderSug(inp.value); });
    renderChips(); renderSug('');
    setTimeout(function(){ inp.focus(); }, 40);
}

var colBuilders = {
    photos: function(){
        var b=popBody();
        radioList(b,[['all','All'],['with','With photo'],['without','Without photo']],function(){return F.photos;},function(v){F.photos=v;});
    },
    invoice_date: function(){
        sortRows('invoice_date','Newest first','Oldest first');
        buildCalPop(function(){return F.invDateMin;},function(v){F.invDateMin=v;},function(){return F.invDateMax;},function(v){F.invDateMax=v;});
    },
    items: function(){
        sortRows('items','Ascending','Descending');
        buildItemFilter();
    },
    status: function(){
        var b=popBody();
        checkList(b,[['pending','Pending'],['confirmed','Confirmed'],['reverted','Reverted']],function(){return F.statuses;});
    },
    action_at: function(){

        buildCalPop(function(){return F.confDateMin;},function(v){F.confDateMin=v;},function(){return F.confDateMax;},function(v){F.confDateMax=v;});

    },
};

/* ── Row selection: per-page select-all + cross-page + counter + "Clear selection" ── */
function _pageInvIds(){
    var pageSz = pageSize===0 ? (currentRows.length||1) : pageSize;
    var from = (currentPage-1)*pageSz;
    return currentRows.slice(from, from+pageSz).map(function(inv){ return String(inv.id); });
}
function _syncCbAll(){
    var box=document.getElementById('inv-cb-all'); if(!box) return;
    var ids=_pageInvIds();
    var picked=ids.filter(function(id){ return SEL.has(id); }).length;
    box.indeterminate=(picked>0 && picked<ids.length);
    box.checked=(ids.length>0 && picked===ids.length);
}
function _updateInvCounter(){
    var counter=document.querySelector('.cl-counter'); if(!counter) return;
    var total=Math.max(currentRows.length, SEL.size);
    counter.textContent='Selected: '+SEL.size+' of '+total;
    var ids=_pageInvIds();
    var onPage=ids.filter(function(id){ return SEL.has(id); }).length;
    var cb=document.getElementById('cl-clear-sel');
    if(cb){ if(SEL.size-onPage>0) cb.style.removeProperty('display'); else cb.style.setProperty('display','none','important'); }
}
document.getElementById('inv-list-table').addEventListener('change', function(e){
    var t=e.target;
    if(t.id==='inv-cb-all'){
        var ids=_pageInvIds();
        var allOn=ids.length>0 && ids.every(function(id){ return SEL.has(id); });
        ids.forEach(function(id){ if(allOn) SEL.delete(id); else SEL.add(id); });
        renderTable();
        return;
    }
    if(t.classList && t.classList.contains('inv-row-cb')){
        if(t.checked) SEL.add(String(t.value)); else SEL.delete(String(t.value));
        renderTable();
    }
});
function _installInvCounter(){
    var counter=document.querySelector('.cl-counter'); if(!counter) return;
    if(!document.getElementById('cl-clear-sel')){
        var clearBtn=document.createElement('a');
        clearBtn.href='#'; clearBtn.id='cl-clear-sel'; clearBtn.className='cl-top-btn';
        clearBtn.textContent='Clear selection'; clearBtn.style.marginLeft='10px';
        clearBtn.style.setProperty('display','none','important');
        clearBtn.addEventListener('click',function(e){ e.preventDefault();
            var ids=new Set(_pageInvIds());
            Array.from(SEL).forEach(function(id){ if(!ids.has(String(id))) SEL.delete(id); });
            renderTable();
        });
        counter.insertAdjacentElement('afterend', clearBtn);
    }
    window._updateCounter=_updateInvCounter; _updateInvCounter();
    _renderResetBtn();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _installInvCounter);
else _installInvCounter();

renderTable();
})();
</script>
