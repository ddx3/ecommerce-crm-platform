{% extends "admin/change_list.html" %}

{% block extrahead %}{{ block.super }}
<style>
/* Hide the standard Django changelist until our JS renders #pv-table */
#result_list, .results, #toolbar, #changelist-form .actions, #changelist-search { display: none !important; }
</style>
{% endblock %}

{% block result_list %}
{{ block.super }}
<style>
#result_list { display: none !important; }
#toolbar { display: none !important; }
.results { display: none !important; }

/* ── Table ── */
#pv-table { table-layout: fixed; width: 100%; border-collapse: collapse !important; border-top: none !important; --hairline-color: transparent; }
#pv-table td, #pv-table th { border-top: none !important; }
#pv-table thead th { border-bottom: 1px solid #e5e7eb !important; }
#pv-table tr.pv-multi .pv-name-cell::before { content: "─"; color: #9ca3af; margin-right: 8px; }
#pv-table thead tr th {
    background: #f9fafb !important; border-bottom: 1px solid #e5e7eb !important;
    border-left: 1px solid #e5e7eb !important; padding: 10px 12px !important;
    font-size: 10px !important; font-weight: 700 !important; text-transform: uppercase !important;
    letter-spacing: 0.4px !important; color: #6b7280 !important; white-space: nowrap !important;
    vertical-align: middle !important; text-align: left !important;
}
#pv-table thead tr th:first-child { border-left: none !important; }
#pv-table thead tr th.col-cb { padding: 0 0 0 14px !important; width: 44px !important; }

th[data-col] { cursor: pointer !important; user-select: none !important; position: relative !important; }
#pv-table thead tr th[data-col] { padding-right: 26px !important; }
#pv-table thead tr th[data-col]:hover, #pv-table thead tr th[data-col].col-open { color: #1f2937 !important; }
/* Active sort — subtle tint */
#pv-table thead tr th[data-col].col-on { background: #d1d5db !important; color: #1f2937 !important; }
/* Badge — absolute right */
.th-badge { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; pointer-events: none; }

#pv-table tbody tr { border-bottom: 1px solid #e5e7eb !important; height: 56px; }
#pv-table.tbl-touches-pager tbody tr:last-child { border-bottom: none !important; }
#pv-table tbody tr.row1 { background: #fff !important; }
#pv-table tbody tr.row2 { background: #f9fafb !important; }
#pv-table tbody tr:hover { background: #eef0f3 !important; }
#pv-table tbody tr.pv-empty-row, #pv-table tbody tr.pv-empty-row:hover { background: #fff !important; cursor: default !important; border-bottom: 1px solid #e5e7eb !important; }
#pv-table tbody tr.pv-empty-row td { border-bottom: 1px solid #e5e7eb !important; vertical-align: middle !important; text-align: center !important; padding: 0 !important; }
#pv-table tbody tr:last-child.pv-empty-row { border-bottom: 1px solid #e5e7eb !important; }
table.tbl-touches-pager tbody tr.pv-empty-row, table.tbl-touches-pager tbody tr.pv-empty-row td { border-bottom: 1px solid #e5e7eb !important; }
#pv-table tbody td, #pv-table tbody th {
    padding: 8px 12px !important; font-size: 13px !important; vertical-align: middle !important;
    border-left: 1px solid #e5e7eb !important; border-bottom: none !important;
    font-weight: 400 !important; color: #374151 !important; text-align: left !important;
    overflow: hidden !important; height: 56px !important; box-sizing: border-box !important;
}
#pv-table tbody td:first-child, #pv-table tbody th:first-child { border-left: none !important; }
#pv-table tbody th a { color: #374151 !important; text-decoration: none !important; font-weight: 400 !important; }
#pv-table td, #pv-table th { white-space: nowrap; }
#pv-table .col-name  { min-width: 200px; }
/* Name — up to 3 lines; the cell grows with its content (the row gets taller as needed). */
#pv-table .col-name a, #pv-table .col-name .col-name-val { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; word-break: break-word; line-height: 1.35; }
#pv-table tbody th.col-name { height: auto !important; overflow: visible !important; }
.pv-mixed-badge { display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px; font-weight:600; background:#f59e0b; color:#fff; margin-left:5px; vertical-align:middle; }
#pv-table .col-cat   { min-width: 160px; max-width: 220px; }
#pv-table .col-cat .cat-wrap { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; max-height: 38px; white-space: normal; }
/* Dates column — as wide as the dates themselves (does not stretch). */
#pv-table .col-dates { width: 1%; white-space: nowrap; }
#pv-table .col-cb    { width: 44px !important; min-width: 44px !important; max-width: 44px !important; padding: 0 0 0 14px !important; }
#pv-table .col-active { padding: 6px 12px !important; }
#pv-table .col-price  { padding: 6px 10px !important; }
#pv-table .col-stock  { padding: 6px 8px !important; width: 1%; white-space: nowrap; }
.pv-active-cb { cursor: pointer; width: 16px; height: 16px; accent-color: #374151; }

/* Lightbox */
#pv-lightbox { display: none; position: fixed; inset: 0; z-index: 999999; background: rgba(0,0,0,0.82); align-items: center; justify-content: center; cursor: zoom-out; }
#pv-lightbox.open { display: flex; }
#pv-lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }

/* Photos */
#pv-table .col-photos { width: 1%; }
#pv-table thead tr th[data-col="photos"] { padding-right: 12px !important; }

/* ── Column widths (table-layout:fixed) ──
   Minimum ones (photo/SKU/dates/display/price/stock level + name for 2 lines) — JS measurements
   in CSS variables; the rest (Categories/Discount/Labels/Brand) split the remainder equally.
 */
#pv-table thead th[data-col="photos"]    { width: var(--pw-photos, 70px) !important; }
#pv-table thead th[data-col="sku"]       { width: var(--pw-sku, 90px) !important; }
#pv-table thead th[data-col="dates"]     { width: var(--pw-dates, 200px) !important; }
#pv-table thead th[data-col="is_active"] { width: var(--pw-active, 76px) !important; }
#pv-table thead th[data-col="price"]     { width: var(--pw-price, 116px) !important; }
#pv-table thead th[data-col="stock"]     { width: var(--pw-stock, 170px) !important; }
#pv-table thead th[data-col="discount"]  { width: var(--pw-disc, 80px) !important; }
#pv-table thead th[data-col="labels"]    { width: var(--pw-labels, 130px) !important; }
#pv-table thead th[data-col="brand"]     { width: var(--pw-brand, 110px) !important; }
#pv-table td.col-dates > div > div { white-space: nowrap !important; }
/* Dynamic hiding of secondary columns on narrow screens (the class is set by JS),
   so the table fits without horizontal scroll and the name stays full.
 */
#pv-table.pv-hide-brand    th[data-col="brand"],    #pv-table.pv-hide-brand    td.col-brand  { display: none !important; }
#pv-table.pv-hide-labels   th[data-col="labels"],   #pv-table.pv-hide-labels   td.col-labels { display: none !important; }
#pv-table.pv-hide-discount th[data-col="discount"], #pv-table.pv-hide-discount td.col-disc   { display: none !important; }
#pv-table.pv-hide-dates    th[data-col="dates"],    #pv-table.pv-hide-dates    td.col-dates  { display: none !important; }
/* Compact mode (narrow screen): only 1 photo (the stock level stays full — buttons + field). */
#pv-table.pv-compact td.col-photos .pv-photo-wrap:not(:first-child) { display: none !important; }
/* Name + Category are flexible: they split the free space (name 2/3, category 1/3)
   on top of their minimums. Widths are computed by JS (_fitProductCols), updated on resize.
 */
#pv-table thead th[data-col="cat"]  { width: var(--pw-cat, 220px) !important; }
#pv-table thead th[data-col="name"] { width: var(--pw-name, 435px) !important; }
.pv-photos { display: flex; gap: 3px; }
.pv-photo-wrap { position: relative; display: inline-block; flex-shrink: 0; }
.pv-photo-wrap img.pv-thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 4px; border: 1px solid #d1d5db; background: #f3f4f6; display: block; transition: filter .15s; }
.pv-photo-wrap:hover img.pv-thumb { filter: brightness(0.82); }
/* .pv-photo-preview — styles moved to base_site.html */
.pv-cat-tag { display: inline-block; font-size: 13px; background: transparent; border: 1px solid #e5e7eb; border-radius: 3px; padding: 1px 5px; margin: 1px 1px 0 0; color: #6b7280; white-space: nowrap; cursor: default; }

/* Price / stock inputs */
.pv-edit-cell { display: flex; align-items: center; gap: 4px; }
#pv-table .pv-edit-input { width: 76px; padding: 0 6px !important; height: 28px !important; border: 1px solid #d1d5db !important; border-radius: 4px !important; font-size: 13px !important; background: #fff !important; color: #374151 !important; box-shadow: none !important; }
#pv-table .pv-edit-input:focus { border-color: #9ca3af !important; }
#pv-table .pv-edit-input.saved  { border-color: #16a34a !important; background: #f0fdf4 !important; }
#pv-table .pv-edit-input.error  { border-color: #dc2626 !important; background: #fef2f2 !important; }
.pv-currency { font-size: 12px; color: #9ca3af; }
.delta-wrapper { display: inline-flex; align-items: center; gap: 2px; }
/* .delta-btn — styles moved to base_site.html */
#pv-table .delta-input { width: 46px; height: 28px !important; padding: 0 5px !important; border: 1px solid #d1d5db !important; border-radius: 4px !important; font-size: 13px !important; background: #fff !important; color: #374151 !important; box-shadow: none !important; }
#pv-table .pv-stock-main { width: 60px; height: 28px !important; padding: 0 5px !important; border: 1px solid #d1d5db !important; border-radius: 4px !important; font-size: 13px !important; background: #fff !important; color: #374151 !important; box-shadow: none !important; }
#pv-table .pv-stock-main.saved { border-color: #16a34a !important; background: #f0fdf4 !important; }
#pv-table .pv-stock-main.error { border-color: #dc2626 !important; background: #fef2f2 !important; }
/* Remove the type=number spinner in the stock fields (in Safari it is wider and clips digits;
   there are +/- buttons for the quantity). Frees up room for digits without widening the column.
 */
#pv-table .bulk-stock-qty::-webkit-inner-spin-button, #pv-table .bulk-stock-qty::-webkit-outer-spin-button,
#pv-table .pv-stock-main::-webkit-inner-spin-button, #pv-table .pv-stock-main::-webkit-outer-spin-button,
#pv-table .delta-input::-webkit-inner-spin-button, #pv-table .delta-input::-webkit-outer-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
#pv-table .bulk-stock-qty, #pv-table .pv-stock-main, #pv-table .delta-input { -moz-appearance: textfield; }


/* ── Popover ── */
#flt-pop {
    display: none; position: fixed; z-index: 9999; background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 0 0 6px 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,.18);
    overflow: hidden;
    width: 200px;
}
#flt-pop.open { display: block; }

/* Sort rows */
.fp-sort-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; border-bottom: 1px solid #ececec;
    background: #fff; color: #374151; font-size: 13px;
    cursor: pointer; width: 100%; text-align: left;
    border-left: none; border-right: none; border-top: none;
}
.fp-sort-row:last-of-type { border-bottom: 1px solid #e5e7eb; }
.fp-sort-row:hover { background: #f5f5f5; }
.fp-sort-row.on { background: #e5e7eb; color: #374151; }
.fp-sort-arr { color: #d1d5db; font-size: 18px; line-height: 1; flex-shrink: 0; display: inline-flex; align-items: center; }
.fp-sort-row.on .fp-sort-arr { color: #374151; }

/* Filter body */
.fp-pop-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.fp-filter-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: #9ca3af; margin-bottom: 6px; }
.fp-pills { display: flex; gap: 3px; flex-wrap: wrap; }
.fp-pill { padding: 3px 8px; border: 1px solid #d1d5db; border-radius: 20px; font-size: 11px; color: #6b7280; cursor: pointer; background: #fff; user-select: none; }
.fp-pill:hover { background: #f9fafb; color: #374151; }
.fp-pill.on { background: #1f2937; border-color: #1f2937; color: #fff; }
.fp-search { width: 100%; box-sizing: border-box; height: 28px; padding: 0 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; outline: none; margin-bottom: 0; }
.fp-search:focus { border-color: #9ca3af; }
.fp-list { display: flex; flex-direction: column; gap: 10px; max-height: 140px; overflow-y: auto; margin: 0 -10px -10px -10px; padding: 10px; border-radius: 0 0 6px 6px; border-top: 1px solid #e5e7eb; }
.fp-pop-body > .fp-list:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.fp-item { display: flex; align-items: center; gap: 6px; padding: 0; font-size: 13px; line-height: 1; color: #374151; border-radius: 3px; position: relative; }
/* Tree-lines in the category filter. */
/* 2px lines, same color as the checkbox (#d1d5db). */
.fp-item .pick-vline { position: absolute; top: -5px; bottom: -5px; width: 2px; background: #d1d5db; pointer-events: none; z-index: 0; }
.fp-item .pick-vline.is-first { top: -10px; }
.fp-item .pick-vline.is-last  { bottom: 50%; }
.fp-item .pick-hline { position: absolute; top: 50%; height: 2px; background: #d1d5db; pointer-events: none; z-index: 0; transform: translateY(-1px); }
.fp-item .pick-elbow {
    position: absolute;
    border-left: 2px solid #d1d5db;
    border-bottom: 2px solid #d1d5db;
    border-bottom-left-radius: 5px;
    pointer-events: none; z-index: 0;
}
.fp-item > label { position: relative; z-index: 1; }
.fp-item input[type=checkbox],
.fp-item input[type=radio] {
    appearance: none; -webkit-appearance: none;
    width: 14px; height: 14px; flex-shrink: 0;
    border: 1.5px solid #d1d5db;
    background: #fff; cursor: pointer; position: relative;
    margin: 0;
    transition: background .12s, border-color .12s;
}
.fp-item input[type=checkbox] { border-radius: 3px; }
.fp-item input[type=radio]    { border-radius: 50%; }
.fp-item input[type=checkbox]:hover,
.fp-item input[type=radio]:hover { border-color: #9ca3af; }
.fp-item input[type=checkbox]:checked,
.fp-item input[type=radio]:checked { background: #1f2937; border-color: #1f2937; }
.fp-item input[type=checkbox]:checked::after,
.fp-item input[type=radio]:checked::after {
    content: ''; position: absolute;
    left: 3px; top: 0px; width: 4px; height: 8px;
    border: 1.5px solid #fff; border-top: none; border-left: none;
    transform: rotate(45deg);
}
.fp-range { display: flex; align-items: center; gap: 4px; }
.fp-pop-body:has(> .fp-range:last-child) { padding-bottom: 8px; }
.fp-range input { flex: 1; min-width: 0; width: 0; height: 28px; padding: 0 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; outline: none; box-sizing: border-box; }
.fp-range input:focus { border-color: #9ca3af; }
.fp-range-sep { font-size: 0; color: transparent; width: 8px; height: 1px; background: #9ca3af; align-self: center; flex-shrink: 0; margin-top: -1px; }
.fp-divider { height: 1px; background: #e5e7eb; margin: 8px 0; }
/* Clear button inside popover */
.fp-clear { display: block; margin-top: 8px; padding: 0; border: none; background: none; font-size: 11px; color: #9ca3af; cursor: pointer; text-align: left; }
.fp-clear:hover { color: #dc2626; }

/* ── Calendar ── */
.cal-nav { display:flex; align-items:center; justify-content:space-between; padding:8px 10px 4px; }
.cal-nav-btn { background:#f9fafb; border:1px solid #d1d5db; border-radius:4px; width:26px; height:26px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:#374151; font-size:16px; line-height:1; padding:0; flex-shrink:0; transition:background .1s,border-color .1s; }
.cal-nav-btn:hover { background:#e5e7eb; border-color:#9ca3af; color:#111; }
.cal-nav-btn:active { background:#d1d5db; }
.cal-title { font-size:12px; font-weight:600; color:#374151; text-align:center; flex:1; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); padding:0 6px 0; }
.cal-dow { font-size:10px; color:#9ca3af; text-align:center; padding:2px 0 5px; font-weight:600; }
.cal-day { font-size:12px; text-align:center; padding:5px 0; cursor:pointer; color:#374151; user-select:none; border-radius:4px; transition:background .1s; }
.cal-day.empty { cursor:default; pointer-events:none; }
.cal-day:not(.empty):not(.sel-start):not(.sel-end):hover { background:#d1d5db; }
.cal-day.today { font-weight:700; color:#111; }
.cal-day.sel-start, .cal-day.sel-end { background:#1f2937; color:#fff; border-radius:4px; }
.cal-day.sel-start:hover, .cal-day.sel-end:hover { background:#374151; }
.cal-day.in-range { background:#e5e7eb; border-radius:0; }
.cal-day.in-range:hover { background:#d1d5db; }
.cal-day.sel-start.has-range { border-radius:4px 0 0 4px; }
.cal-day.sel-end.has-range   { border-radius:0 4px 4px 0; }
.cal-reset { display:block; text-align:center; padding:0 10px 10px; font-size:11px; color:#9ca3af; cursor:pointer; background:none; border:none; width:100%; }
.cal-reset:hover { color:#dc2626; }

/* ── Pager ── */
#pv-pager {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 10px 16px; font-size: 13px; color: #6b7280;
    border-top: 1px solid #e5e7eb;
    position: fixed; bottom: 0; right: 0;
    background: #fff; z-index: 1000;
}
#pv-pager .pager-info { font-size: 12px; color: #9ca3af; }
#pv-pager .pager-nav { display: flex; align-items: center; gap: 4px; justify-self: center; }
#pv-pager .pg-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0; border: 1px solid #d1d5db;
    border-radius: 4px; background: #fff; color: #374151;
    font-size: 13px; cursor: pointer; line-height: 1;
    user-select: none; text-decoration: none !important; box-sizing: border-box; flex-shrink: 0;
}
#pv-pager .pg-btn:hover { background: #f3f4f6; border-color: #d1d5db; }
/* No font-weight on active — otherwise the text button ("Group") changes
   width on activation and neighboring elements shift.
 */
#pv-pager .pg-btn.pg-active { background: #1f2937; color: #fff; border-color: #1f2937; }
#pv-pager .pg-btn.pg-disabled { opacity: 0.35; pointer-events: none; }
#pv-pager .pg-btn.pg-arrow { color: #6b7280; }
#pv-pager .pg-btn.pg-loading { pointer-events: none; }
#pv-pager .pg-btn.pg-loading > .pg-spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid #d1d5db; border-top-color: #1f2937; border-radius: 50%;
    animation: pg-spin .7s linear infinite;
}
@keyframes pg-spin { to { transform: rotate(360deg); } }
#pv-pager .pager-nav .pg-dots { padding: 0 2px; color: #9ca3af; font-size: 12px; line-height: 28px; }
#pv-pager .pager-right { display: flex; align-items: center; gap: 0; justify-self: end; }
#pv-pager .pager-size { display: flex; align-items: center; gap: 4px; font-size: 12px; }
#pv-pager .pager-size > span:first-child { color: #9ca3af; }
#pv-pager .pager-size .pg-btn { width: auto; min-width: 36px; padding: 0 8px; }
#pv-pager .pager-group { margin-left: 12px; padding-left: 12px; border-left: 1px solid #e5e7eb; }
#pv-pager .pager-group .pg-btn { width: auto; padding: 0 10px; }
#pv-table tbody tr.pv-pinned, #pv-table tbody tr.pv-pinned:hover { background: #eff6ff !important; }
#pv-table tbody tr.pv-pinned-first td, #pv-table tbody tr.pv-pinned-first th { border-top: 2px solid #d1d5db !important; }
#pv-table tbody tr.pv-pinned-last td, #pv-table tbody tr.pv-pinned-last th { border-bottom: 2px solid #d1d5db !important; }

/* Variants of a grouped product (≥2) — a gray stripe on the left (as in the bundle composition).
   The photo is NOT shifted — it stays on the same vertical as the header/ungrouped rows.
   The header row (product name) is left alone — we only remove the heavy outline above
   it (border-top from .group-start).
 */
#pv-table tbody tr.pv-group-header td, #pv-table tbody tr.pv-group-header th { border-top: none !important; }
#pv-table tbody tr.pv-group-child > td:first-child,
#pv-table tbody tr.pv-group-child > th:first-child { box-shadow: inset 3px 0 0 #9ca3af; }

/* Group header row (grouping enabled, the group has ≥2 variants) */
#pv-table tbody tr.pv-group-header,
#pv-table tbody tr.pv-group-header:hover {
    background: #f3f4f6 !important; cursor: pointer !important; height: 30px !important;
}
#pv-table tbody tr.pv-group-header:hover { background: #eceef1 !important; }
#pv-table tbody tr.pv-group-header td {
    height: 30px !important; padding: 4px 12px !important;
    border-bottom: 1px solid #e5e7eb !important; vertical-align: middle !important;
}
#pv-table tbody tr.pv-group-header td.col-cb { padding: 0 0 0 14px !important; }
.pv-group-cb { cursor: pointer; width: 16px; height: 16px; accent-color: #374151; vertical-align: middle; }
.pv-group-name-inner { display: flex; align-items: center; min-width: 0; }
.pv-group-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    margin-right: 8px; flex-shrink: 0; transition: transform .12s;
}
.pv-group-toggle svg { display: block; }
#pv-table tbody tr.pv-group-collapsed .pv-group-toggle { transform: rotate(-90deg); }
.pv-group-title {
    font-weight: 600; font-size: 13px; color: #1f2937;
    flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Counter = "Display" toggle: a click turns is_active on/off for all variants.
   Struck through = some/all variants are hidden.
 */
.pv-group-count {
    flex-shrink: 0; margin-left: 6px; color: #9ca3af; font-size: 13px; font-weight: 500;
    cursor: pointer; user-select: none;
}
.pv-group-count:hover { color: #4b5563; }

<div class="em-modal" id="wo-overlay">
  <div class="em-box">
    <div class="em-head">
      <h3>Product write-off</h3>
      <button type="button" class="em-close" id="wo-close">✕</button>
    </div>
    <div class="em-body" id="wo-body"></div>
    <div class="em-foot" id="wo-foot"></div>
  </div>
</div>

<script>
(function () {
    var overlay = document.getElementById('wo-overlay');
    var body = document.getElementById('wo-body');
    var foot = document.getElementById('wo-foot');
    if (!overlay) return;

    function csrf() { var m = document.cookie.match(/csrftoken=([^;]+)/); return m ? m[1] : ''; }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function el(id) { return document.getElementById(id); }

    var files = [];
    var woItems = null; // [{raw_name, qty, candidates:[{type,id,name,sku,price,stock,photo,score}], _sel}]
    var srcText = '';

    function open() {
        overlay.classList.add('open');
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
    }
    function close() {
        overlay.classList.remove('open');
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
    }
    el('wo-close').addEventListener('click', close);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    overlay.addEventListener('input', function (e) { e.stopPropagation(); });
    overlay.addEventListener('change', function (e) { e.stopPropagation(); });

    document.addEventListener('paste', function (e) {
        if (!overlay.classList.contains('open') || !el('wo-drop')) return;
        var items = (e.clipboardData && e.clipboardData.items) || [];
        var imgs = [];
        for (var i = 0; i < items.length; i++) {
            if (items[i].type && items[i].type.indexOf('image/') === 0) {
                var f = items[i].getAsFile();
                if (f) imgs.push(f);
            }
        }
        if (imgs.length) { e.preventDefault(); addFiles(imgs); }
    });

    // ── Phase 1: input ──
    function openInput() {
        files = []; woItems = null;
        body.innerHTML =
            '<div class="wo-pad">' +
            '<div class="wo-lbl">Write-off list (text or note)</div>' +
            '<textarea class="wo-ta" id="wo-text" placeholder="Paste the text here (e.g. Fertilizer 250 ml — 2 pcs, Insecticide 5 ml)…"></textarea>' +
            '<div class="wo-lbl" style="margin-top:16px;">Or a photo</div>' +
            '<div class="wo-drop" id="wo-drop">Drag, click or paste (Ctrl+V) a photo</div>' +
            '<input type="file" id="wo-file" accept="image/*" multiple style="display:none;">' +
            '<div class="wo-thumbs" id="wo-thumbs"></div>' +
            '<div id="wo-err-slot"></div>' +
            '</div>';
        foot.innerHTML =
            '<button type="button" class="em-btn" id="wo-cancel">Cancel</button>' +
            '<button type="button" class="em-btn primary" id="wo-go">Recognize</button>';
        el('wo-cancel').addEventListener('click', close);
        el('wo-go').addEventListener('click', runParse);
        var drop = el('wo-drop'), fileInp = el('wo-file');
        drop.addEventListener('click', function () { fileInp.click(); });
        fileInp.addEventListener('change', function () { addFiles(fileInp.files); });
        ['dragenter', 'dragover'].forEach(function (ev) {
            drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
            drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
        });
        drop.addEventListener('drop', function (e) { addFiles(e.dataTransfer.files); });
        open();
    }
    window._woOpenInput = openInput;

    function addFiles(list) {
        Array.from(list).forEach(function (f) { if (f.type.indexOf('image/') === 0) files.push(f); });
        renderThumbs();
    }
    function renderThumbs() {
        var wrap = el('wo-thumbs'); if (!wrap) return;
        wrap.innerHTML = '';
        files.forEach(function (f, i) {
            var d = document.createElement('div'); d.className = 'wo-thumb';
            var img = document.createElement('img'); img.src = URL.createObjectURL(f);
            img.title = 'Click to view';
            img.addEventListener('click', function () { openLightbox(img.src); });
            d.appendChild(img);
            var acts = document.createElement('div'); acts.className = 'wo-thumb-actions';
            var rep = document.createElement('button'); rep.type = 'button'; rep.textContent = '✎'; rep.title = 'Replace photo';
            rep.addEventListener('click', function (e) { e.stopPropagation(); replaceFile(i); });
            var x = document.createElement('button'); x.type = 'button'; x.className = 'wo-thumb-del'; x.textContent = '✕'; x.title = 'Delete';
            x.addEventListener('click', function (e) { e.stopPropagation(); files.splice(i, 1); renderThumbs(); });
            acts.appendChild(rep); acts.appendChild(x);
            d.appendChild(acts); wrap.appendChild(d);
        });
    }
    function replaceFile(i) {
        var inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*';
        inp.addEventListener('change', function () {
            if (inp.files && inp.files[0]) { files[i] = inp.files[0]; renderThumbs(); }
        });
        inp.click();
    }
    function openLightbox(src) {
        var lb = el('wo-lightbox');
        if (!lb) {
            lb = document.createElement('div'); lb.className = 'wo-lightbox'; lb.id = 'wo-lightbox';
            lb.appendChild(document.createElement('img'));
            lb.addEventListener('click', function () { lb.classList.remove('open'); });
            document.body.appendChild(lb);
        }
        lb.querySelector('img').src = src;
        lb.classList.add('open');
    }
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        var lb = el('wo-lightbox');
        if (lb && lb.classList.contains('open')) lb.classList.remove('open');
    });
    function showErr(msg) {
        var slot = el('wo-err-slot'); if (slot) slot.innerHTML = '<div class="wo-err">' + esc(msg) + '</div>';
    }

    function runParse() {
        var text = (el('wo-text') ? el('wo-text').value.trim() : '');
        if (!text && !files.length) { showErr('Add the write-off text or a photo.'); return; }
        srcText = text;
        var fd = new FormData();
        if (text) fd.append('text', text);
        files.forEach(function (f) { fd.append('photos[]', f); });
        body.innerHTML = '<div class="wo-spin">Recognizing the list… this may take 10–20 seconds</div>';
        foot.innerHTML = '';
        fetch('/admin/orders/parse-writeoff/', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'X-CSRFToken': csrf() }, body: fd
        })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
            if (!res.ok) { openInput(); showErr(res.d.error || 'Recognition error'); return; }
            woItems = (res.d.items || []).map(function (it) {
                // Bundles are not valid write-off candidates (confirm accepts only variant_id).
                it.candidates = (it.candidates || []).filter(function (c) { return c.type !== 'bundle'; });
                it._sel = it.candidates.length ? 0 : -1;
                return it;
            });
            if (!woItems.length) { openInput(); showErr('Nothing recognized. Try a different text/photo.'); return; }
            renderReview();
        })
        .catch(function (e) { openInput(); showErr('Network error: ' + e); });
    }

    // ── Phase 2: review/edit (#oi-table standard) ──
    function scoreCls(s) { return s >= 0.85 ? 'sim-high' : (s >= 0.75 ? 'sim-med' : 'sim-low'); }
    function woFmtNum(n) { return isFinite(n) ? n.toFixed(2).replace(/\.?0+$/, '') : ''; }
    /* Price: the line total (price × qty) large + the breakdown below. With qty 1 — price only. */
    function priceCellHtml(c, qty) {
        var price = c ? parseFloat(c.price) : NaN;
        if (!isFinite(price)) return '<span style="color:#9ca3af;">—</span>';
        qty = qty || 1;
        if (qty <= 1) return '<span style="font-size:13px;color:#374151;">' + esc(woFmtNum(price)) + '</span>';
        return '<div style="display:flex;flex-direction:column;gap:1px;line-height:1.2;">' +
            '<span style="font-size:13px;font-weight:600;color:#111827;">' + esc(woFmtNum(price * qty)) + '</span>' +
            '<span style="font-size:11px;color:#9ca3af;white-space:nowrap;">' + esc(woFmtNum(price)) + ' × ' + qty + '</span>' +
            '</div>';
    }
    function palette(name) {
        var palettes = ['#e0e7ff:#6366f1', '#fce7f3:#db2777', '#dcfce7:#16a34a', '#fef9c3:#ca8a04', '#ffedd5:#ea580c', '#f3e8ff:#9333ea'];
        var letter = (name || '?')[0].toUpperCase();
        var pal = palettes[letter.charCodeAt(0) % palettes.length].split(':');
        return { letter: letter, bg: pal[0], fg: pal[1] };
    }

    function renderReview() {
        body.innerHTML =
            '<div class="oi-toolbar"><input type="text" class="oi-add-inp" id="wo-add-inp" placeholder="Add a product manually…" autocomplete="off"></div>' +
            '<div style="overflow-x:auto;"><table id="wo-table">' +
            '<thead><tr>' +
            '<th class="inv-skip-cell"></th>' +
            '<th class="col-oi-photo">Photo</th>' +
            '<th class="col-oi-name">Product</th>' +
            '<th class="col-oi-src">Recognized</th>' +
            '<th class="col-oi-sku">SKU</th>' +
            '<th class="col-oi-price">Price</th>' +
            '<th class="col-oi-qty">Quantity</th>' +
            '</tr></thead><tbody id="wo-tbody"></tbody></table></div>';
        foot.innerHTML =
            '<button type="button" class="em-btn" id="wo-back">Back</button>' +
            '<button type="button" class="em-btn primary" id="wo-confirm">Write off</button>';
        el('wo-back').addEventListener('click', openInput);
        el('wo-confirm').addEventListener('click', runConfirm);
        woInitAdd(el('wo-add-inp'));
        renderRows();
    }

    function renderRows() {
        var tbody = el('wo-tbody'); if (!tbody) return;
        tbody.innerHTML = '';
        woItems.forEach(function (it, i) { tbody.appendChild(rowHtml(it, i)); });
        var rows = Array.from(tbody.querySelectorAll('tr'));
        rows.forEach(function (r, idx) {
            r.classList.add(idx % 2 === 0 ? 'row1' : 'row2');
            r.style.borderBottom = '';
        });
        // The last row has no border-bottom — otherwise it doubles up with the footer's border-top.
        if (rows.length) rows[rows.length - 1].style.borderBottom = 'none';
    }

    function rowHtml(it, i) {
        var c = (it._sel != null && it._sel >= 0) ? it.candidates[it._sel] : null;
        var tr = document.createElement('tr');
        tr.dataset.i = i;

        var tdCh = document.createElement('td'); tdCh.className = 'inv-skip-cell';
        var skipBtn = document.createElement('button');
        skipBtn.type = 'button'; skipBtn.className = 'inv-skip-btn'; skipBtn.title = 'Remove';
        skipBtn.textContent = '✕';
        skipBtn.addEventListener('click', function () { woItems.splice(i, 1); renderRows(); });
        tdCh.appendChild(skipBtn); tr.appendChild(tdCh);

        var tdP = document.createElement('td'); tdP.className = 'col-oi-photo';
        if (c && c.photo) {
            tdP.innerHTML = '<div class="oi-pv-wrap"><img class="oi-pv-thumb" src="' + esc(c.photo) + '" alt=""></div>';
        } else {
            var pal = palette(c ? c.name : it.raw_name);
            tdP.innerHTML = '<div style="width:40px;height:40px;border-radius:4px;border:1px solid #d1d5db;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:' + pal.bg + ';color:' + pal.fg + ';margin:0 auto;">' + pal.letter + '</div>';
        }
        tr.appendChild(tdP);

        var thN = document.createElement('th'); thN.className = 'col-oi-name';
        var nameFlex = document.createElement('div'); nameFlex.className = 'oi-name-flex';
        var nameSpan = document.createElement('span'); nameSpan.className = 'oi-name-clamp';
        if (c) { nameSpan.textContent = c.name; nameSpan.style.color = '#374151'; }
        else { nameSpan.textContent = 'Not found — choose a product'; nameSpan.style.color = '#dc2626'; }
        nameFlex.appendChild(nameSpan);
        var replBtn = document.createElement('button');
        replBtn.type = 'button'; replBtn.className = 'em-item-edit-btn'; replBtn.title = 'Choose a product';
        replBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M9.5 2L12 4.5L4.5 12L1.5 12.5L2 9.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path></svg>';
        replBtn.addEventListener('click', function (e) { e.stopPropagation(); openReplace(i, thN); });
        nameFlex.appendChild(replBtn);
        thN.appendChild(nameFlex);
        tr.appendChild(thN);

        var tdSrc = document.createElement('td'); tdSrc.className = 'col-oi-src';
        var sc = (c && c.score != null) ? Math.round(c.score * 100) : null;
        var srcName = it.raw_name ? esc(it.raw_name) : '<span style="color:#9ca3af;">Added manually</span>';
        tdSrc.innerHTML = '<div class="oi-src-row">' +
            (sc != null ? '<span class="sim-badge ' + scoreCls(c.score) + '">' + sc + '%</span>' : '') +
            '<span class="oi-src-name" title="' + esc(it.raw_name || '') + '">' + srcName + '</span></div>';
        tr.appendChild(tdSrc);

        var tdS = document.createElement('td'); tdS.className = 'col-oi-sku';
        tdS.innerHTML = '<span style="color:#9ca3af;font-size:12px">' + esc(c ? c.sku : '—') + '</span>';
        tr.appendChild(tdS);

        var tdPr = document.createElement('td'); tdPr.className = 'col-oi-price';
        tdPr.innerHTML = priceCellHtml(c, it.qty);
        tr.appendChild(tdPr);

        var tdQ = document.createElement('td'); tdQ.className = 'col-oi-qty';
        var qWrap = document.createElement('span'); qWrap.className = 'oi-qty-wrap';
        var minBtn = document.createElement('button'); minBtn.type = 'button'; minBtn.className = 'oi-qty-btn'; minBtn.disabled = (it.qty <= 1);
        var qInp = document.createElement('input'); qInp.type = 'number'; qInp.className = 'oi-qty-inp'; qInp.value = it.qty; qInp.min = 1;
        var plusBtn = document.createElement('button'); plusBtn.type = 'button'; plusBtn.className = 'oi-qty-btn is-plus';
        function syncQty() { qInp.value = it.qty; minBtn.disabled = it.qty <= 1; tdPr.innerHTML = priceCellHtml(c, it.qty); }
        minBtn.addEventListener('click', function () { it.qty = Math.max(1, (parseInt(qInp.value, 10) || 1) - 1); syncQty(); });
        plusBtn.addEventListener('click', function () { it.qty = (parseInt(qInp.value, 10) || 1) + 1; syncQty(); });
        qInp.addEventListener('input', function () { var n = parseInt(qInp.value, 10); it.qty = (isFinite(n) && n > 0) ? n : 1; syncQty(); });
        qWrap.appendChild(minBtn); qWrap.appendChild(qInp); qWrap.appendChild(plusBtn);
        tdQ.appendChild(qWrap); tr.appendChild(tdQ);

        return tr;
    }

    // ── Inline product replacement in a row (.em-item-editor / .ee-sug standard) ──
    function openReplace(i, thN) {
        var ed = document.createElement('div'); ed.className = 'em-item-editor';
        ed.innerHTML =
            '<input type="text" class="ee-vinput" placeholder="Find a product…" autocomplete="off">' +
            '<button type="button" class="ee-btn cancel" title="Cancel"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></button>' +
            '<div class="ee-sug"></div>';
        thN.innerHTML = ''; thN.appendChild(ed);
        var vinp = ed.querySelector('.ee-vinput');
        var sug = ed.querySelector('.ee-sug');
        var cancelBtn = ed.querySelector('.ee-btn.cancel');
        var tmr = null;
        function positionSug() {
            var r = vinp.getBoundingClientRect();
            sug.style.left = r.left + 'px'; sug.style.top = (r.bottom + 2) + 'px'; sug.style.width = Math.max(r.width, 260) + 'px';
        }
        function renderSug(list, query) {
            sug.innerHTML = '';
            var inner = document.createElement('div'); inner.className = 'ee-sug-scroll';
            sug.appendChild(inner);
            if (!list.length) {
                var r = document.createElement('div'); r.className = 'ee-sug-row empty';
                r.textContent = (query && query.length >= 2) ? 'Nothing found' : 'Enter at least 2 characters';
                inner.appendChild(r); positionSug(); sug.classList.add('open'); return;
            }
            list.forEach(function (v) {
                var row = document.createElement('div'); row.className = 'ee-sug-row';
                var photo = v.photo ? '<img class="ee-sug-photo" src="' + esc(v.photo) + '" alt="">' : '<div class="ee-sug-photo"></div>';
                var st = parseInt(v.stock, 10) || 0;
                var stockHtml = st > 0 ? '<span class="ee-sug-stock" style="color:#16a34a">' + st + ' pcs</span>' : '<span class="ee-sug-stock" style="color:#dc2626">None</span>';
                row.innerHTML = photo + '<div class="ee-sug-info"><span class="ee-sug-name">' + esc(v.name) + '</span>' +
                    '<span class="ee-sug-meta"><span class="ee-sug-sku">' + esc(v.sku || '—') + '</span>' + stockHtml + '</span></div>';
                row.addEventListener('mousedown', function (e) {
                    e.preventDefault(); e.stopPropagation();
                    var it = woItems[i];
                    it.candidates = it.candidates || [];
                    it.candidates.push({ type: 'variant', id: v.id, name: v.name, sku: v.sku || '', price: v.price, stock: v.stock, photo: v.photo || '', score: 1 });
                    it._sel = it.candidates.length - 1;
                    renderRows();
                });
                inner.appendChild(row);
            });
            positionSug(); sug.classList.add('open');
        }
        vinp.addEventListener('input', function () {
            clearTimeout(tmr);
            var q = vinp.value.trim();
            if (q.length < 2) { renderSug([], q); return; }
            tmr = setTimeout(function () {
                fetch('/admin/catalog/variant-search/?q=' + encodeURIComponent(q), { credentials: 'same-origin' })
                    .then(function (r) { return r.json(); })
                    .then(function (data) { renderSug(data.results || [], q); })
                    .catch(function () { renderSug([], q); });
            }, 250);
        });
        vinp.addEventListener('blur', function () { setTimeout(function () { if (document.body.contains(vinp)) renderRows(); }, 200); });
        cancelBtn.addEventListener('mousedown', function (e) { e.preventDefault(); renderRows(); });
        vinp.addEventListener('keydown', function (e) { if (e.key === 'Escape') renderRows(); });
        function reposOnScroll() { if (sug.classList.contains('open')) positionSug(); }
        window.addEventListener('scroll', reposOnScroll, true);
        window.addEventListener('resize', reposOnScroll);
        vinp.focus();
    }

    // ── Add a product manually (the same search in the toolbar) ──
    function woInitAdd(inp) {
        if (!inp) return;
        var wrap = inp.parentNode;
        wrap.style.position = 'relative';
        var sug = document.createElement('div'); sug.className = 'ee-sug';
        wrap.appendChild(sug);
        var tmr = null;
        function positionSug() {
            var r = inp.getBoundingClientRect();
            sug.style.left = r.left + 'px'; sug.style.top = (r.bottom + 2) + 'px'; sug.style.width = r.width + 'px';
        }
        function closeSug() { sug.classList.remove('open'); sug.innerHTML = ''; }
        inp.addEventListener('input', function () {
            clearTimeout(tmr);
            var q = inp.value.trim();
            if (q.length < 2) { closeSug(); return; }
            tmr = setTimeout(function () {
                fetch('/admin/catalog/variant-search/?q=' + encodeURIComponent(q), { credentials: 'same-origin' })
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        var list = data.results || [];
                        sug.innerHTML = '';
                        var inner = document.createElement('div'); inner.className = 'ee-sug-scroll';
                        sug.appendChild(inner);
                        if (!list.length) {
                            var r0 = document.createElement('div'); r0.className = 'ee-sug-row empty'; r0.textContent = 'Nothing found';
                            inner.appendChild(r0);
                        } else {
                            list.forEach(function (v) {
                                var row = document.createElement('div'); row.className = 'ee-sug-row';
                                var photo = v.photo ? '<img class="ee-sug-photo" src="' + esc(v.photo) + '" alt="">' : '<div class="ee-sug-photo"></div>';
                                var st = parseInt(v.stock, 10) || 0;
                                var stockHtml = st > 0 ? '<span class="ee-sug-stock" style="color:#16a34a">' + st + ' pcs</span>' : '<span class="ee-sug-stock" style="color:#dc2626">None</span>';
                                row.innerHTML = photo + '<div class="ee-sug-info"><span class="ee-sug-name">' + esc(v.name) + '</span>' +
                                    '<span class="ee-sug-meta"><span class="ee-sug-sku">' + esc(v.sku || '—') + '</span>' + stockHtml + '</span></div>';
                                row.addEventListener('mousedown', function (e) {
                                    e.preventDefault(); e.stopPropagation();
                                    woItems.push({
                                        raw_name: '', qty: 1, _sel: 0,
                                        candidates: [{ type: 'variant', id: v.id, name: v.name, sku: v.sku || '', price: v.price, stock: v.stock, photo: v.photo || '', score: 1 }]
                                    });
                                    inp.value = ''; closeSug(); renderRows();
                                });
                                inner.appendChild(row);
                            });
                        }
                        positionSug(); sug.classList.add('open');
                    });
            }, 250);
        });
        inp.addEventListener('blur', function () { setTimeout(closeSug, 200); });
        window.addEventListener('scroll', function () { if (sug.classList.contains('open')) positionSug(); }, true);
        window.addEventListener('resize', function () { if (sug.classList.contains('open')) positionSug(); });
    }

    function runConfirm() {
        var payload = [];
        woItems.forEach(function (it) {
            var c = (it._sel != null && it._sel >= 0) ? it.candidates[it._sel] : null;
            if (!c || c.type !== 'variant') return;
            payload.push({ variant_id: c.id, quantity: it.qty });
        });
        if (!payload.length) { alert('No product selected.'); return; }
        var btn = el('wo-confirm');
        btn.disabled = true; btn.textContent = 'Writing off…';
        fetch('/admin/orders/confirm-writeoff/', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
            body: JSON.stringify({ items: payload, source_text: srcText })
        })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
            if (!res.ok) { btn.disabled = false; btn.textContent = 'Write off'; alert(res.d.error || 'Write-off error'); return; }
            close();
            window.location.reload();
        })
        .catch(function (e) { btn.disabled = false; btn.textContent = 'Write off'; alert('Network error: ' + e); });
    }
})();
</script>

<script>
(function () {
    var allData = {{ variants_json|safe }};
    var catsTree = {{ cats_tree_json|safe }};
    var allLabels = {{ labels_json|safe }};

    var allBrands = [];
    (function(){
        var bs={};
        allData.forEach(function(v){ if(v.brand) bs[v.brand]=1; });
        allBrands = Object.keys(bs).sort();
    })();

    var F = {nameQ:'',skuQ:'',photos:'all',brands:[],cats:[],labels:[],priceMin:null,priceMax:null,stockOnly:false,stockNone:false,stockMin:null,stockMax:null,dateMin:null,dateMax:null,dateMinU:null,dateMaxU:null,status:'all',discount:'all',types:[],printout:'all'};

    /* Convert "DD.MM.YYYY HH:MM" → "YYYY-MM-DD" for string comparison */
    function toCmpDate(str){ var m=str&&str.match(/^(\d{2})\.(\d{2})\.(\d{4})/); return m?m[3]+'-'+m[2]+'-'+m[1]:null; }
    var sortField=null, sortDir='asc';
    var currentPage=1, pageSize=25, currentFiltered=[];
    var groupByProduct=false;
    /* Collapsed groups (group keys) — variant rows are hidden. */
    var collapsedGroups=new Set();
    /* Persistent selection across client-side pagination (row ids as strings). */
    var SEL = new Set();

    /* ── Persist state — filters + sorting + grouping + pagination.
       SEL (row selection) is also restored cross-page. ──
     */
    var STATE_KEY = 'catalog_product_list_state_v1';
    function _saveState(){
        try {
            localStorage.setItem(STATE_KEY, JSON.stringify({
                F: F,
                sortField: sortField, sortDir: sortDir,
                groupByProduct: groupByProduct,
                collapsedGroups: Array.from(collapsedGroups),
                currentPage: currentPage, pageSize: pageSize,
                SEL: Array.from(SEL),
            }));
        } catch (e) {}
    }
    function _loadState(){
        try {
            var raw = localStorage.getItem(STATE_KEY);
            if (!raw) return false;
            var s = JSON.parse(raw);
            if (s.F) Object.assign(F, s.F);
            if (typeof s.sortField      !== 'undefined') sortField      = s.sortField;
            if (typeof s.sortDir        !== 'undefined') sortDir        = s.sortDir;
            if (typeof s.groupByProduct !== 'undefined') groupByProduct = !!s.groupByProduct;
            if (Array.isArray(s.collapsedGroups)) collapsedGroups = new Set(s.collapsedGroups);
            if (typeof s.currentPage    !== 'undefined') currentPage    = s.currentPage;
            // "All" (pageSize=0) is NOT restored — to avoid loading all products on reload.
            if (typeof s.pageSize       !== 'undefined') pageSize       = (s.pageSize === 0 ? 25 : s.pageSize);
            /* Restore the cross-page selection, dropping ids that are no longer in the data. */
            if (Array.isArray(s.SEL)) {
                var exists={}; allData.forEach(function(v){ exists[String(v.id)]=1; });
                s.SEL.forEach(function(id){ if(exists[String(id)]) SEL.add(String(id)); });
            }
            return true;
        } catch (e) {}
        return false;
    }
    _loadState();

    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function getCsrf(){var el=document.querySelector('[name=csrfmiddlewaretoken]');return el?el.value:'';}

    /* Expand selected category names to include all descendants */
    function expandCats(names){
        var nameSet={}, idSet={};
        names.forEach(function(n){ nameSet[n]=1; });
        catsTree.forEach(function(c){ if(nameSet[c.name]) idSet[c.id]=1; });
        var changed=true;
        while(changed){
            changed=false;
            catsTree.forEach(function(c){
                if(!nameSet[c.name] && c.parent_id && idSet[c.parent_id]){
                    nameSet[c.name]=1; idSet[c.id]=1; changed=true;
                }
            });
        }
        return Object.keys(nameSet);
    }

    function applyFilters(data){
        var expandedCats=F.cats.length?expandCats(F.cats):[];
        return data.filter(function(v){
            if(F.nameQ && (v.name||'').toLowerCase().indexOf(F.nameQ.toLowerCase())===-1) return false;
            if(F.skuQ  && (v.sku||'').indexOf(F.skuQ)===-1) return false;
            if(F.photos==='with'    && !(v.photos&&v.photos.length)) return false;
            if(F.photos==='without' &&  (v.photos&&v.photos.length)) return false;
            if(F.brands.length && F.brands.indexOf(v.brand||'')===-1) return false;
            if(F.cats.length && !(v.categories||[]).some(function(c){return expandedCats.indexOf(c)!==-1;})) return false;
            if(F.labels.length){
                var _vl=v.labels||[];
                var _named=F.labels.some(function(n){return n!=='__none__' && _vl.some(function(l){return l.name===n;});});
                var _none=F.labels.indexOf('__none__')!==-1 && _vl.length===0;
                if(!(_named||_none)) return false;
            }
            var price=parseFloat(v.price)||0;
            if(F.priceMin!==null && price<F.priceMin) return false;
            if(F.priceMax!==null && price>F.priceMax) return false;
            var stock=v.stock!=null?parseInt(v.stock):0;
            if(F.stockOnly && stock<=0) return false;
            if(F.stockNone && stock>0) return false;
            if(F.stockMin!==null && stock<F.stockMin) return false;
            if(F.stockMax!==null && stock>F.stockMax) return false;
            if(F.dateMin||F.dateMax){ var cd=v.created_iso||toCmpDate(v.created_at); if(F.dateMin&&(!cd||cd<F.dateMin)) return false; if(F.dateMax&&(!cd||cd>F.dateMax)) return false; }
            if(F.dateMinU||F.dateMaxU){ var cu=v.updated_iso||toCmpDate(v.updated_at); if(F.dateMinU&&(!cu||cu<F.dateMinU)) return false; if(F.dateMaxU&&(!cu||cu>F.dateMaxU)) return false; }
            if(F.status==='active' && !v.is_active) return false;
            if(F.status==='hidden' &&  v.is_active) return false;
            if(F.discount==='percent' && !v.discount_percent && !v.brand_discount_percent) return false;
            if(F.discount==='amount'  && !v.discount_amount)  return false;
            if(F.discount==='none'    && (v.discount_percent||v.discount_amount||v.brand_discount_percent)) return false;
            if(F.printout==='with'    && !v.printout) return false;
            if(F.printout==='without' &&  v.printout) return false;
            if(F.types.length){
                var match = F.types.some(function(t){
                    if(t==='hybrid')  return !!v.is_hybrid;
                    if(t==='factory') return !v.is_own;
                    if(t==='own')     return !!v.is_own;
                    if(t==='paired')  return !!v.is_paired;
                    return false;
                });
                if(!match) return false;
            }
            return true;
        });
    }
    function applySort(data){
        if(!sortField) return data;
        return data.slice().sort(function(a,b){
            var va,vb;
            if     (sortField==='name')      {va=(a.name||'').toLowerCase();vb=(b.name||'').toLowerCase();}
            else if(sortField==='sku')       {va=a.sku||'';vb=b.sku||'';}
            else if(sortField==='brand')     {va=(a.brand||'').toLowerCase();vb=(b.brand||'').toLowerCase();}
            else if(sortField==='price')     {va=parseFloat(a.price)||0;vb=parseFloat(b.price)||0;}
            else if(sortField==='stock')     {va=a.stock!=null?parseInt(a.stock):0;vb=b.stock!=null?parseInt(b.stock):0;}
            else if(sortField==='created_at'){va=a.created_iso||'';vb=b.created_iso||'';}
            else if(sortField==='updated_at'){va=a.updated_iso||'';vb=b.updated_iso||'';}
            else if(sortField==='discount'){
                if(F.discount==='amount'){va=parseFloat(a.discount_amount)||0;vb=parseFloat(b.discount_amount)||0;}
                else{va=parseFloat(a.discount_percent||a.brand_discount_percent)||0;vb=parseFloat(b.discount_percent||b.brand_discount_percent)||0;}
            }
            else if(sortField==='is_active') {va=a.is_active?0:1;vb=b.is_active?0:1;}
            else return 0;
            return va<vb?(sortDir==='asc'?-1:1):va>vb?(sortDir==='asc'?1:-1):0;
        });
    }
    function hasFilters(){
        return F.nameQ||F.skuQ||F.photos!=='all'||F.printout!=='all'||F.brands.length||F.cats.length||
               F.priceMin!==null||F.priceMax!==null||F.stockOnly||F.stockNone||F.stockMin!==null||F.stockMax!==null||
               F.dateMin||F.dateMax||F.dateMinU||F.dateMaxU||F.status!=='all'||F.discount!=='all'||F.labels.length;
    }
    function isColFiltered(col){
        if(col==='photos')    return F.photos!=='all';
        if(col==='name')      return !!F.nameQ;
        if(col==='sku')       return !!F.skuQ;
        if(col==='brand')     return F.brands.length>0;
        if(col==='cat')       return F.cats.length>0;
        if(col==='labels')    return F.labels.length>0;
        if(col==='price')     return F.priceMin!==null||F.priceMax!==null;
        if(col==='stock')     return F.stockOnly||F.stockNone||F.stockMin!==null||F.stockMax!==null||F.types.length>0||F.printout!=='all';
        if(col==='dates') return !!(F.dateMin||F.dateMax||F.dateMinU||F.dateMaxU);
        if(col==='is_active') return F.status!=='all';
        if(col==='discount')  return F.discount!=='all';
        return false;
    }

    var pvTable=document.getElementById('pv-table');

    function applyGroup(data){
        if(!groupByProduct) return data;
        var indexed=data.map(function(v,i){return{v:v,i:i};});
        indexed.sort(function(a,b){
            var ka=a.v.pair_key||a.v.product_id, kb=b.v.pair_key||b.v.product_id;
            if(ka!==kb) return ka<kb?-1:1;
            if(a.v.product_id!==b.v.product_id) return a.v.product_id<b.v.product_id?-1:1;
            return a.i-b.i;
        });
        return indexed.map(function(x){return x.v;});
    }
    function updateTable(opts){
        if (!opts || !opts.preservePage) currentPage=1;
        _saveState();
        var filtered=applyGroup(applySort(applyFilters(allData)));
        pvTable.querySelectorAll('th[data-col]').forEach(function(th){
            var col=th.dataset.col;
            var filtered_col=isColFiltered(col), sorted_col=(sortField===col) || (col==='dates' && (sortField==='created_at'||sortField==='updated_at'));
            th.classList.toggle('col-filtered', filtered_col);
            th.classList.toggle('col-on', filtered_col || sorted_col);
            var badge=th.querySelector('.th-badge');
            if(badge) badge.innerHTML=(filtered_col||sorted_col)?'<svg width="9" height="10" viewBox="0 0 10 11" fill="#374151"><path d="M0 0h10L6.5 5v6h-3V5z"/></svg>':'';
        });
        renderRows(filtered);
    }
    function resetCol(col){
        if(col==='name')       F.nameQ='';
        else if(col==='sku')   F.skuQ='';
        else if(col==='photos') F.photos='all';
        else if(col==='brand') F.brands=[];
        else if(col==='cat')   F.cats=[];
        else if(col==='labels') F.labels=[];
        else if(col==='price') { F.priceMin=null; F.priceMax=null; }
        else if(col==='stock') { F.stockOnly=false; F.stockNone=false; F.stockMin=null; F.stockMax=null; F.types=[]; F.printout='all'; }
        else if(col==='dates') { F.dateMin=null; F.dateMax=null; F.dateMinU=null; F.dateMaxU=null; if(sortField==='created_at'||sortField==='updated_at'){ sortField=null; sortDir='asc'; } }
        else if(col==='is_active') F.status='all';
        else if(col==='discount')  F.discount='all';
        if(sortField===col){ sortField=null; sortDir='asc'; }
        updateTable();
    }
    function resetFilters(){
        F={nameQ:'',skuQ:'',photos:'all',brands:[],cats:[],labels:[],priceMin:null,priceMax:null,stockOnly:false,stockNone:false,stockMin:null,stockMax:null,dateMin:null,dateMax:null,dateMinU:null,dateMaxU:null,status:'all',discount:'all',types:[],printout:'all'};
        sortField=null; sortDir='asc';
        updateTable();
    }

    /* ── Popover: click to open/close ── */
    var pop=document.getElementById('flt-pop'), popOwner=null;

    var popWidths={dates:240,cat:320};
    function openPop(th, buildFn){
        if(popOwner===th && pop.classList.contains('open')){ closePop(); return; }
        if(popOwner) popOwner.classList.remove('col-open');
        popOwner=th;
        pop.innerHTML='';
        buildFn();
        var resetBar=document.createElement('button'); resetBar.type='button';
        resetBar.textContent='Reset filter';
        resetBar.style.cssText='display:block;width:100%;padding:10px;border:none;border-bottom:1px solid #e5e7eb;background:none;color:#dc2626;font-size:13px;font-weight:500;cursor:pointer;text-align:left;';
        resetBar.addEventListener('click',function(){resetCol(th.dataset.col);closePop();});
        resetBar.addEventListener('mouseenter',function(){this.style.background='#fef2f2';});
        resetBar.addEventListener('mouseleave',function(){this.style.background='none';});
        pop.insertBefore(resetBar,pop.firstChild);
        pop.classList.add('open');
        var r=th.getBoundingClientRect();
        var pw=popWidths[th.dataset.col]||200;
        pop.style.width=pw+'px';
        pop.style.left=(window.clFlipLeft?window.clFlipLeft(r,pw,8):Math.max(8,Math.min(r.left,window.innerWidth-pw-8)))+'px';
        pop.style.top=(window.clFlipTop?window.clFlipTop(r,pop.offsetHeight,0):(r.bottom))+'px';
        th.classList.add('col-open');
    }
    function closePop(){
        pop.classList.remove('open');
        if(popOwner){ popOwner.classList.remove('col-open'); popOwner=null; }
    }
    document.addEventListener('click',function(e){
        if(!pop.contains(e.target)&&!e.target.closest('th[data-col]')) closePop();
    });
    function popHasFocus(){ return !!pop.querySelector('input:focus,textarea:focus'); }
    function onLeave(e){
        var to=e.relatedTarget;
        if(!to){ if(popHasFocus()) return; closePop(); return; }
        if(pop.contains(to)||to===pop) return;
        if(popOwner&&(popOwner===to||popOwner.contains(to))) return;
        closePop();
    }
    /* pop.addEventListener('mouseleave',onLeave); -- disabled: keep popup open on mouseleave */
    pop.addEventListener('wheel',function(e){
        var scrollable=e.target.closest('.fp-list,.cal-grid');
        if(scrollable&&scrollable.scrollHeight>scrollable.clientHeight){
            var atTop=scrollable.scrollTop===0&&e.deltaY<0;
            var atBot=scrollable.scrollTop+scrollable.clientHeight>=scrollable.scrollHeight&&e.deltaY>0;
            if(!atTop&&!atBot) return;
        }
        e.preventDefault();
    },{passive:false});

    /* helpers */
    function popBody(){
        var d=document.createElement('div'); d.className='fp-pop-body';
        pop.appendChild(d); return d;
    }
    function sortRows(field, la, ld){
        [[la,'asc'],[ld,'desc']].forEach(function(p){
            var btn=document.createElement('button'); btn.type='button';
            btn.className='fp-sort-row'+(sortField===field&&sortDir===p[1]?' on':'');
            var sp=document.createElement('span'); sp.textContent=p[0];
            var arr=document.createElement('span'); arr.className='fp-sort-arr'; arr.textContent='›';
            btn.appendChild(sp); btn.appendChild(arr);
            btn.addEventListener('click',function(){
                sortField=field;sortDir=p[1];
                pop.querySelectorAll('.fp-sort-row').forEach(function(b){b.classList.remove('on');});
                btn.classList.add('on');
                updateTable();
            });
            pop.appendChild(btn);
        });
    }
    var _rgSeq = 0;
    function radioList(cont, opts, getVal, setVal, onSelect){
        /* A counter, not Date.now(): two radioLists in a row landed in the same
           millisecond, got the same name and merged into one group — then
           in "Availability" the stock-level choice got cleared when the printout was
           set.
         */
        var grp='fp-rg-'+(++_rgSeq);
        opts.forEach(function(o){
            var row=document.createElement('div'); row.className='fp-item';
            var lbl=document.createElement('label'); lbl.style.cssText='display:inline-flex;align-items:center;gap:6px;cursor:pointer;';
            var rb=document.createElement('input'); rb.type='radio'; rb.name=grp; rb.value=o[0]; rb.checked=getVal()===o[0];
            rb.addEventListener('change',function(){ if(rb.checked){setVal(o[0]);updateTable();if(onSelect)onSelect();} });
            lbl.appendChild(rb); lbl.appendChild(document.createTextNode(o[1]));
            row.appendChild(lbl); cont.appendChild(row);
        });
    }
    function checkList(cont, items, selected, onToggle){
        if(items.length>6){
            var inp=document.createElement('input'); inp.type='text'; inp.className='fp-search'; inp.placeholder='Search...';
            inp.addEventListener('input',function(){renderList(inp.value);});
            cont.appendChild(inp);
        }

    function buildCatPop(){
        var b=popBody();

        var catById={};
        catsTree.forEach(function(c){ catById[c.id]=c; });
        function catDepth(c){ var d=0,pid=c.parent_id; while(pid&&catById[pid]){d++;pid=catById[pid].parent_id;} return d; }
        /* children-by-parent: cascading selection of descendants when an ancestor is clicked. */
        var kidsByParent={};
        catsTree.forEach(function(c){
            if(c.parent_id){ (kidsByParent[c.parent_id]=kidsByParent[c.parent_id]||[]).push(c); }
        });
        function descendantsOf(c){
            var out=[]; var stack=(kidsByParent[c.id]||[]).slice();
            while(stack.length){ var n=stack.shift(); out.push(n); (kidsByParent[n.id]||[]).forEach(function(k){ stack.push(k); }); }
            return out;
        }

        /* Show only the categories actually present in at least one product.
           Include their ancestors too — so the hierarchy doesn't break.
         */
        var usedNames={};
        (allData||[]).forEach(function(v){
            (v.categories||[]).forEach(function(c){ usedNames[c]=1; });
        });
        var usedIds={};
        catsTree.forEach(function(c){ if(usedNames[c.name]) usedIds[c.id]=1; });
        catsTree.forEach(function(c){
            if(!usedIds[c.id]) return;
            var pid=c.parent_id;
            while(pid && catById[pid]){
                if(usedIds[pid]) break;
                usedIds[pid]=1;
                pid=catById[pid].parent_id;
            }
        });
        var visibleTree=catsTree.filter(function(c){ return usedIds[c.id]; });

        var inp=document.createElement('input'); inp.type='text'; inp.className='fp-search'; inp.placeholder='Search...';
        var ld=document.createElement('div'); ld.className='fp-list'; ld.style.maxHeight='320px';
        b.appendChild(inp); b.appendChild(ld);

        function renderCatList(q){
            ld.innerHTML='';
            var shown=q ? visibleTree.filter(function(c){return c.name.toLowerCase().indexOf(q.toLowerCase())!==-1;}) : visibleTree;
            /* \u041f\u0435\u0440\u0435\u0440\u0430\u0445\u0443\u043d\u043e\u043a depth \u0434\u043b\u044f \u043a\u043e\u0436\u043d\u043e\u0433\u043e \u0432\u0438\u0434\u0438\u043c\u043e\u0433\u043e \u043f\u0443\u043d\u043a\u0442\u0443 (q=\u043f\u043e\u0448\u0443\u043a \u2014 \u0434\u0435\u043f\u0442=0). */
            var parsed=shown.map(function(c){ return {c:c, depth: q?0:catDepth(c)}; });
            function isLastAtDepth(i,d){
                for(var j=i+1;j<parsed.length;j++){
                    if(parsed[j].depth<d) return true;
                    if(parsed[j].depth===d) return false;
                }
                return true;
            }
            /* LINE_OFFSET = visual center of the checkbox at depth 0.
               STEP = checkbox indent per level. The lines sit exactly under the checkboxes above.
             */
            var STEP=18, BASE_PAD=0, LINE_OFFSET=6;
            parsed.forEach(function(o,i){
                var c=o.c, depth=o.depth;
                var row=document.createElement('div'); row.className='fp-item';
                if(depth>0){
                    /* Vlines for all ancestor levels (not for the last one — there it's an elbow or vline+hline). */
                    for(var lvl=1;lvl<depth;lvl++){
                        if(isLastAtDepth(i,lvl)) continue;
                        var v=document.createElement('span');
                        v.className='pick-vline';
                        v.style.left=(LINE_OFFSET+(lvl-1)*STEP)+'px';
                        row.appendChild(v);
                    }
                    var isFirst = (i===0 || parsed[i-1].depth<depth);
                    var isLast  = isLastAtDepth(i,depth);
                    var ownX    = LINE_OFFSET+(depth-1)*STEP;
                    if (isLast) {
                        /* "└" — a single elbow with a rounded corner instead of vline+hline. */
                        var el=document.createElement('span');
                        el.className='pick-elbow';
                        el.style.left = ownX+'px';
                        el.style.top  = (isFirst ? '-10px' : '-5px');
                        el.style.height = isFirst ? 'calc(50% + 11px)' : 'calc(50% + 6px)';
                        el.style.width  = (STEP-6)+'px';
                        row.appendChild(el);
                    } else {
                        /* Middle child: a straight vline (through the whole row) + hline to the checkbox. */
                        var v=document.createElement('span');
                        v.className='pick-vline';
                        v.style.left = ownX+'px';
                        if (isFirst) v.classList.add('is-first');
                        row.appendChild(v);
                        var hl=document.createElement('span');
                        hl.className='pick-hline';
                        hl.style.left=ownX+'px';
                        hl.style.width=(STEP-6)+'px';
                        row.appendChild(hl);
                    }
                    row.style.paddingLeft=(BASE_PAD+depth*STEP)+'px';
                }
                var lbl=document.createElement('label'); lbl.style.cssText='display:inline-flex;align-items:center;gap:6px;cursor:pointer;';
                var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=F.cats.indexOf(c.name)!==-1;
                cb.addEventListener('change',function(){
                    var names=[c.name].concat(descendantsOf(c).map(function(d){return d.name;}));
                    if(cb.checked){
                        names.forEach(function(n){ if(F.cats.indexOf(n)===-1) F.cats.push(n); });
                    } else {
                        F.cats=F.cats.filter(function(x){ return names.indexOf(x)===-1; });
                    }
                    renderCatList(inp.value);
                    updateTable();
                });
                lbl.appendChild(cb);
                lbl.appendChild(document.createTextNode(c.name));
                row.appendChild(lbl); ld.appendChild(row);
            });
        }
        inp.addEventListener('input',function(){renderCatList(inp.value);});
        renderCatList('');
    }

    function _grpKey(v){ return v.pair_key||v.product_id; }
    /* Page boundaries. When grouping, we pack by whole groups: a page holds
       ~pageSize rows but does NOT split a group — the tail of a group doesn't go to the next
       page. A group larger than pageSize takes a whole page of its own.
     */
    function _pageBounds(){
        var data=currentFiltered||[];
        var n=data.length;
        if(pageSize===0 || n===0) return [{start:0,end:n}];
        if(!groupByProduct){
            var b=[];
            for(var s=0;s<n;s+=pageSize) b.push({start:s,end:Math.min(s+pageSize,n)});
            return b;
        }
        var bounds=[], pageStart=0, count=0, i=0;
        while(i<n){
            var key=_grpKey(data[i]), j=i;
            while(j<n && _grpKey(data[j])===key) j++;
            var groupLen=j-i;
            if(count>0 && count+groupLen>pageSize){ bounds.push({start:pageStart,end:i}); pageStart=i; count=0; }
            count+=groupLen; i=j;
        }
        bounds.push({start:pageStart,end:n});
        return bounds;
    }
    function _pageSlice(){
        var data=currentFiltered||[];
        if(pageSize===0) return data;
        var b=_pageBounds();
        if(currentPage>b.length) currentPage=b.length;
        if(currentPage<1) currentPage=1;
        var pg=b[currentPage-1]||{start:0,end:0};
        return data.slice(pg.start,pg.end);
    }

        var pageIds = _pageSlice().map(function(v){ return String(v.id); });
        var allOn = pageIds.length > 0 && pageIds.every(function(id){ return SEL.has(id); });
        pageIds.forEach(function(id){ if(allOn) SEL.delete(id); else SEL.add(id); });

    /* saveField */
    /* Counter of pending saves: block the reload while a POST is "in flight",
       otherwise the reload GET reads the DB before the save lands (the revision loses the number).
     */
    var _pvPending=0;
    if(!window._pvUnloadGuard){
        window._pvUnloadGuard=true;
        window.addEventListener('beforeunload',function(e){
            if(_pvPending>0){e.preventDefault();e.returnValue='';return '';}
        });

    function saveField(variantId,field,value,inputEl,cb){
        inputEl.classList.add('saving'); inputEl.classList.remove('saved','error');
        _pvPending++;
        fetch('/admin/catalog/save-variant-field/',{
            method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':getCsrf()},
            body:JSON.stringify({id:variantId,field:field,value:value}),
            keepalive:true,
        }).then(function(r){return r.json();}).then(function(data){
            inputEl.classList.remove('saving');
            if(data.ok){inputEl.classList.add('saved');setTimeout(function(){inputEl.classList.remove('saved');},1500);if(cb)cb(data);}
            else inputEl.classList.add('error');
        }).catch(function(){inputEl.classList.remove('saving');inputEl.classList.add('error');})
          .finally(function(){_pvPending--;});
    }
