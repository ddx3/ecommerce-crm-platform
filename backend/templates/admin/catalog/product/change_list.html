    function makeBulkStockWidget(v) {
        // In manual mode — show the standard counter (as for a regular product).
        if (v.stock_manual) {
            return makeStockWidget(v.id, v.stock);
        }
        // Auto: [bulk bag] g → N pcs (just a number, no input field).
        var wrap = document.createElement('span');
        wrap.className = 'bulk-stock-row';
        wrap.dataset.productId = v.product_id;
        wrap.dataset.variantId = v.id;
        wrap.style.cssText = 'display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;';
        var qtyInp = document.createElement('input');
        qtyInp.type = 'number'; qtyInp.min = '0'; qtyInp.step = '0.001';
        qtyInp.className = 'bulk-stock-qty';
        qtyInp.value = v.bag_quantity != null ? v.bag_quantity : '';
        qtyInp.style.cssText = 'width:70px;height:24px;padding:2px 4px;border:1px solid #d1d5db;border-radius:3px;font-size:12px;';
        qtyInp.title = 'Bag weight';
        var unitLbl = v.bag_unit === 'ml' ? 'ml' : (v.bag_unit === 'pcs' ? 'pcs' : 'g');
        var unitSpan = document.createElement('span'); unitSpan.textContent = unitLbl; unitSpan.style.color = '#6b7280';
        var arrow = document.createElement('span'); arrow.textContent = '→'; arrow.style.color = '#6b7280';
        // Calculation from the bulk bag — plain text.
        var piecesSpan = document.createElement('span');
        piecesSpan.className = 'bulk-stock-pieces';
        piecesSpan.style.cssText = 'font-size:12px;color:#374151;';
        // Packaging tolerance: 1 pack actually consumes sz×(1+%/100). For piece-counted bulk bags —
        // no tolerance.
        var bagWaste = (v.bag_unit === 'pcs') ? 0 : (parseFloat(v.bag_waste) || 0);
        function piecesFor(qty, sz, w) {
            if (!(qty >= 0 && sz > 0)) return 0;
            return Math.floor(qty / (sz * (1 + (w || 0) / 100)));
        }
        function recalcFromBag() {
            piecesSpan.textContent = piecesFor(parseFloat(qtyInp.value), parseFloat(v.unit_size), bagWaste);
        }
        recalcFromBag();
        var pcsLbl = document.createElement('span'); pcsLbl.textContent = 'pcs'; pcsLbl.style.color = '#6b7280';
        function propagate(newQty) {
            document.querySelectorAll('.bulk-stock-row[data-product-id="' + v.product_id + '"]').forEach(function(row){
                if (row === wrap) return;
                var inp = row.querySelector('.bulk-stock-qty');
                var pcs = row.querySelector('.bulk-stock-pieces');
                if (inp) inp.value = newQty;
                if (pcs) {
                    var sz = parseFloat(inp && inp.dataset.unitSize);
                    var w = parseFloat(inp && inp.dataset.waste) || 0;
                    pcs.textContent = piecesFor(parseFloat(newQty), sz, w);
                }
            });
        }
        qtyInp.dataset.unitSize = v.unit_size != null ? v.unit_size : '';
        qtyInp.dataset.waste = bagWaste;
        qtyInp.addEventListener('click', function(e){ e.stopPropagation(); });
        var _bagT=null;
        function pushBag() {
            var csrf = (document.cookie.match(/csrftoken=([^;]+)/)||[])[1] || '';
            _pvPending++;
            fetch('/admin/catalog/bulk-sources/link-variant/', {
                method: 'POST', credentials: 'same-origin', keepalive: true,
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf},
                body: JSON.stringify({
                    variant_id: v.id,
                    unit_size: v.unit_size != null ? v.unit_size : null,
                    bag_quantity: qtyInp.value !== '' ? qtyInp.value : 0,
                    product_id: v.product_id
                })
            }).then(function(r){ return r.json(); }).then(function(d){
                if (d && d.bag_quantity != null) v.bag_quantity = d.bag_quantity;
            }).catch(function(){}).finally(function(){_pvPending--;});
        }
        function saveBag(){ if(_bagT){clearTimeout(_bagT);_bagT=null;} recalcFromBag(); propagate(qtyInp.value); pushBag(); }
        qtyInp.addEventListener('keydown', function(e){
            if (e.key === 'Enter') { e.preventDefault(); saveBag(); }
        });
        // Instant recalculation + debounced save while typing; blur saves immediately.
        qtyInp.addEventListener('input', function(){
            recalcFromBag(); propagate(qtyInp.value);
            if(_bagT)clearTimeout(_bagT); _bagT=setTimeout(function(){_bagT=null;pushBag();},800);
        });
        qtyInp.addEventListener('blur', saveBag);
        wrap.appendChild(qtyInp); wrap.appendChild(unitSpan);
        wrap.appendChild(arrow);
        wrap.appendChild(piecesSpan); wrap.appendChild(pcsLbl);
        return wrap;
    }

    function makeStockWidget(variantId,currentVal){
        var wrap=document.createElement('span'); wrap.className='delta-wrapper';
        var input=document.createElement('input'); input.type='number'; input.className='pv-stock-main'; input.step='1'; input.value=currentVal!=null?currentVal:0;
        var plus=document.createElement('button'); plus.type='button'; plus.className='delta-btn is-plus'; plus.title='Increase'; plus.textContent='+';
        var minus=document.createElement('button'); minus.type='button'; minus.className='delta-btn'; minus.title='Decrease'; minus.textContent='−';
        var delta=document.createElement('input'); delta.type='number'; delta.className='delta-input'; delta.placeholder='0'; delta.min='0'; delta.step='1';
        wrap.appendChild(input); wrap.appendChild(plus); wrap.appendChild(minus); wrap.appendChild(delta);
        function getDelta(){return Math.max(1,parseInt(delta.value)||1);}
        var lastSaved=parseInt(input.value)||0;
        var _busy=false, _t=null;
        function doSave(val){saveField(variantId,'stock',val,input);lastSaved=val;}
        // Before saving the stock level — check recent orders (stock revision): if the
        // product has already been sold and written off, the modal offers to keep the entered value
        // or subtract.
        function commitStock(){
            if(_t){clearTimeout(_t);_t=null;}
            if(_busy) return;
            var val=parseInt(input.value)||0; input.value=val;
            if(val===lastSaved) return;
            if(!window.StockDemand){doSave(val);return;}
            _busy=true;
            window.StockDemand.check(variantId,val).then(function(res){
                _busy=false;
                if(res.action==='cancel'){input.value=lastSaved;return;}
                input.value=res.value; doSave(res.value);
            }).catch(function(){_busy=false;doSave(val);});
        }
        function scheduleCommit(){if(_t)clearTimeout(_t);_t=setTimeout(function(){_t=null;commitStock();},800);}
        function applyDelta(sign){var nv=(parseInt(input.value)||0)+sign*getDelta();input.value=nv;delta.value='';scheduleCommit();}
        plus.addEventListener('click',function(e){e.stopPropagation();applyDelta(1);});
        minus.addEventListener('click',function(e){e.stopPropagation();applyDelta(-1);});
        delta.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();applyDelta(1);}e.stopPropagation();});
        delta.addEventListener('click',function(e){e.stopPropagation();});
        // Debounce: the user typed a number and didn't press Enter/leave the field — the check
        // fires after 800ms.
        input.addEventListener('input',scheduleCommit);
        input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();commitStock();}e.stopPropagation();});
        input.addEventListener('blur',commitStock);
        input.addEventListener('click',function(e){e.stopPropagation();});
        return wrap;
    }

    function renderPager(){
        var total=currentFiltered.length;
        var pager=document.getElementById('pv-pager');
        if(!pager) return;
        pager.style.display='';
        var groupBtn='<div class="pager-group"><span class="pg-btn'+(groupByProduct?' pg-active':'')+'" onclick="window._pvToggleGroup()">Group</span></div>';
        /* Few rows (fit on one page) — keep the bar visible: "Per page"
           and "Group" are always needed. We hide ONLY the page navigation.
         */
        if(total<=25 && pageSize!==0){
            var info1=total===0?'No records':'1–'+total+' of '+total;
            pager.innerHTML=
                '<span class="pager-info">'+info1+'</span>'+
                '<div class="pager-nav"></div>'+
                '<div class="pager-right"><div class="pager-size"><span>Per page:</span>'+
                '<span class="pg-btn'+(pageSize===25?' pg-active':'')+'" onclick="window._pvSetPage(1,25,this)">25</span>'+
                '<span class="pg-btn'+(pageSize===50?' pg-active':'')+'" onclick="window._pvSetPage(1,50,this)">50</span>'+
                '<span class="pg-btn" onclick="window._pvSetPage(1,0,this)">All</span></div>'+groupBtn+'</div>';
            return;
        }
        if(pageSize===0){
            pager.innerHTML=
                '<span class="pager-info">Showing all '+total+' entries</span>'+
                '<div class="pager-nav"></div>'+
                '<div class="pager-right"><div class="pager-size"><span>Per page:</span>'+
                '<span class="pg-btn" onclick="window._pvSetPage(1,25,this)">25</span>'+
                '<span class="pg-btn" onclick="window._pvSetPage(1,50,this)">50</span>'+
                '<span class="pg-btn pg-active">All</span></div>'+groupBtn+'</div>';
            return;
        }
        var bounds=_pageBounds();
        var pages=bounds.length||1;
        if(currentPage>pages) currentPage=pages;
        if(currentPage<1) currentPage=1;
        var cur=bounds[currentPage-1]||{start:0,end:0};
        var from=total===0?0:cur.start+1;
        var to=cur.end;
        var SVG_PREV='<svg width="6" height="10" viewBox="0 0 6 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,1 1,5 5,9"/></svg>';
        var SVG_NEXT='<svg width="6" height="10" viewBox="0 0 6 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,1 5,5 1,9"/></svg>';
        function pgBtn(label,page,active,disabled,arrow){
            var cls='pg-btn'+(active?' pg-active':'')+(disabled?' pg-disabled':'')+(arrow?' pg-arrow':'');
            var handler=disabled||active?'':'onclick="window._pvSetPage('+page+','+pageSize+',this)"';
            return '<span class="'+cls+'" '+handler+'>'+label+'</span>';
        }
        var nav='';
        nav+=pgBtn(SVG_PREV,currentPage-1,false,currentPage===1,true);
        var pNums=[];
        if(pages<=7){
            for(var i=1;i<=pages;i++) pNums.push(i);
        } else {
            pNums.push(1);
            if(currentPage>3) pNums.push('…');
            for(var i=Math.max(2,currentPage-1);i<=Math.min(pages-1,currentPage+1);i++) pNums.push(i);
            if(currentPage<pages-2) pNums.push('…');
            pNums.push(pages);
        }
        pNums.forEach(function(p){
            if(p==='…'){ nav+='<span class="pg-dots">…</span>'; }
            else { nav+=pgBtn(p,p,p===currentPage,false); }
        });
        nav+=pgBtn(SVG_NEXT,currentPage+1,false,currentPage===pages,true);
        pager.innerHTML=
            '<span class="pager-info">'+from+'–'+to+' of '+total+'</span>'+
            '<div class="pager-nav">'+nav+'</div>'+
            '<div class="pager-right"><div class="pager-size"><span>Per page:</span>'+
            '<span class="pg-btn'+(pageSize===25?' pg-active':'')+'" onclick="window._pvSetPage(1,25,this)">25</span>'+
            '<span class="pg-btn'+(pageSize===50?' pg-active':'')+'" onclick="window._pvSetPage(1,50,this)">50</span>'+
            '<span class="pg-btn" onclick="window._pvSetPage(1,0,this)">All</span></div>'+groupBtn+'</div>';
    }

    window._pvSetPage=function(page,size,btnEl){
        // If a button element was passed — show a spinner in it while rendering
        // (renderRows is synchronous and for "All"/large pages can hang for 100-1000ms).
        if (btnEl && btnEl.nodeType === 1) {
            btnEl.dataset._origHtml = btnEl.innerHTML;
            btnEl.innerHTML = '<span class="pg-spinner"></span>';
            btnEl.classList.add('pg-loading');
        }
        pageSize=size; currentPage=page;
        // Two rAFs: the first lets the browser paint the spinner,
        // the second — after the next frame we start the heavy render.
        requestAnimationFrame(function(){
            requestAnimationFrame(function(){
                renderRows(currentFiltered);
                if(window._updateCounter) window._updateCounter();
                // after renderRows the pager is rebuilt completely and the button disappears,
                // so there is no need to restore its html.
            });
        });
    };
    window._pvToggleGroup=function(){
        groupByProduct=!groupByProduct;
        currentPage=1;

        if(window._updateCounter) window._updateCounter();
    };

                '<div><span style="color:#374151;display:inline-block;margin-right:6px">Added:</span>'+esc(v.created_at||'—')+'</div>'+
                '<div><span style="color:#374151;display:inline-block;margin-right:6px">Updated:</span>'+esc(v.updated_at||'—')+'</div>'+
            '</div>';
            var priceTd=document.createElement('td'); priceTd.className='col-price'; priceTd.appendChild(makePriceInput(v.id,v.price||''));
            var stockTd=document.createElement('td'); stockTd.className='col-stock';
            if (v.is_own) {
                stockTd.appendChild(makeBulkStockWidget(v));
            } else {
                stockTd.appendChild(makeStockWidget(v.id,v.stock));
            }
            [cbTd,photosTd,skuTd,nameTh,catTd,datesTd,discTd,labelsTd,brandTd,activeTd,priceTd,stockTd].forEach(function(cell){tr.appendChild(cell);});
            tr.addEventListener('click',function(e){
                if(e.button!==0) return;
                if(e.target.type==='checkbox'||e.target.tagName==='A'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON') return;
                if(window._hadSelection) return;
                window.location.href=editUrl;
            });
            return tr;
        }
    }

    /* Group header row: a "select the whole group" checkbox + the shared product name.
       Clicking the row collapses/expands the variants. Only for groups with ≥2 variants.
     */
    function buildGroupHeader(items,key,collapsed){
        var ids=items.map(function(v){return String(v.id);});
        var allSel=ids.every(function(id){return SEL.has(id);});
        var someSel=ids.some(function(id){return SEL.has(id);});
        var tr=document.createElement('tr');
        tr.className='pv-group-header group-start'+(collapsed?' pv-group-collapsed':'');
        var cbTd=document.createElement('td'); cbTd.className='col-cb';
        cbTd.innerHTML='<input type="checkbox" class="pv-group-cb">';
        var cb=cbTd.querySelector('input');
        cb.checked=allSel;
        cb.indeterminate=!allSel&&someSel;
        cb.addEventListener('click',function(e){e.stopPropagation();});
        cb.addEventListener('change',function(e){
            e.stopPropagation();
            ids.forEach(function(id){ if(cb.checked) SEL.add(id); else SEL.delete(id); });
            renderRows(currentFiltered);
            if(window._updateCounter) window._updateCounter();
        });
        /* Name (= "Display" toggle) + counter — one cell spanning the full width. */
        var nameTd=document.createElement('td'); nameTd.colSpan=11;
        var label=items[0].product_name||items[0].name||'—';
        var allActive=items.every(function(v){return !!v.is_active;});
        var someActive=items.some(function(v){return !!v.is_active;});
        nameTd.innerHTML='<div class="pv-group-name-inner">'+
            '<span class="pv-group-toggle">'+
            '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+
            '<span class="pv-group-title">'+esc(label)+'</span>'+
            /* Struck through only when ALL variants are hidden (partially hidden — normal). */
            '<span class="pv-group-count'+(someActive?'':' pv-group-count--off')+'" title="Click — show / hide all variants of the group">('+items.length+')</span>'+
        '</div>';
        /* Clicking the counter turns is_active on/off for all variants of the group. */
        var countEl=nameTd.querySelector('.pv-group-count');
        countEl.addEventListener('click',function(e){
            e.stopPropagation();
            var val=!allActive;
            items.forEach(function(v){
                v.is_active=val;
                saveField(v.id,'is_active',val,countEl);
                /* Update the row's checkmark in place — WITHOUT renderRows, so the row does not
                   disappear from under the "Active/Inactive" filter right after
                   the click.
                 */
                var rowCb=pvTable.querySelector('tbody tr[data-vid="'+v.id+'"] .pv-active-cb');
                if(rowCb) rowCb.checked=val;
            });
            allActive=val;
            countEl.classList.toggle('pv-group-count--off', !items.some(function(v){return !!v.is_active;}));
        });
        tr.appendChild(cbTd); tr.appendChild(nameTd);
        /* Clicking the header (except the selection checkbox and the counter) — collapse/expand. */
        tr.addEventListener('click',function(e){
            if(e.target.closest('input,.pv-group-count')) return;
            if(collapsedGroups.has(key)) collapsedGroups.delete(key);
            else collapsedGroups.add(key);
            renderRows(currentFiltered);
        });
        return tr;
    }

    /* ── Dynamic column widths ──────────────────────────────────────── */
    var _pvFontFam=null;
    function _pvFam(){ if(!_pvFontFam) _pvFontFam=getComputedStyle(document.body).fontFamily||'sans-serif'; return _pvFontFam; }
    var _pvCtx=document.createElement('canvas').getContext('2d');
    function _pvTextW(t,fontCss){ _pvCtx.font=fontCss; return _pvCtx.measureText(String(t||'')).width; }

    var _pvHdr=null;
    function _pvMeasureHdr(){
        if(_pvHdr) return _pvHdr;
        var fam=_pvFam();
        var sp=document.createElement('span');
        sp.style.cssText='position:absolute;left:-99999px;top:0;visibility:hidden;white-space:nowrap;text-transform:uppercase;letter-spacing:0.4px;font-weight:700;font-size:10px;';
        sp.style.fontFamily=fam; document.body.appendChild(sp);
        function h(t){ sp.textContent=t; return Math.ceil(sp.offsetWidth)+12+26; }  /* text + left padding + reserve for the filter icon */
        var skuMax=0; (allData||[]).forEach(function(v){ if(v.sku){ var w=_pvTextW(v.sku,'12px '+fam); if(w>skuMax)skuMax=w; } });
        var r={
            photosHdr: h('Photo'),
            datesHdr:  h('Dates'),
            catHdr:    h('Categories'),
            discHdr:   h('Discount'),
            labHdr:    h('Labels'),
            brandHdr:  h('Brand'),
            sku:    Math.max(h('SKU'), Math.ceil(skuMax)+24),
            active: Math.max(h('Display'), 40),
            priceH: h('Price'),
            stockH: h('Stock')
        };
        document.body.removeChild(sp); _pvHdr=r; return r;
    }

    var _pvNameW=null;
    function _pvMeasureName(){
        if(_pvNameW!=null) return _pvNameW;
        var fam=_pvFam(), cands=[];
        (allData||[]).forEach(function(v){ var n=v.name||''; if(n) cands.push({n:n,w:_pvTextW(n,'13px '+fam),own:!!v.is_own,multi:!!v.multi}); });
        cands.sort(function(a,b){return b.w-a.w;}); cands=cands.slice(0,40);  /* the 40 longest names */
        /* The probe is an exact copy of the <td>: border-box + 1px border + padding 8/12; inside it
           pv-name-cell (flex) with the "─" prefix, the "own" badge and .col-name-val
           (clamp:2).
           We look for the COLUMN width directly — so that it matches the real cell to the pixel.
         */
        var td=document.createElement('div');
        td.style.cssText='position:absolute;left:-99999px;top:0;visibility:hidden;box-sizing:border-box;border-left:1px solid #e5e7eb;padding:8px 12px;font-size:13px;line-height:1.35;';
        td.style.fontFamily=fam; document.body.appendChild(td);
        var cell=document.createElement('span'); cell.style.cssText='display:flex;align-items:center;'; td.appendChild(cell);
        function build(c){
            cell.innerHTML='';
            if(c.multi){ var pre=document.createElement('span'); pre.textContent='─'; pre.style.cssText='margin-right:8px;color:#9ca3af;'; cell.appendChild(pre); }
            if(c.own){ var b=document.createElement('span'); b.textContent='own'; b.style.cssText='font-size:10px;text-transform:uppercase;letter-spacing:0.4px;font-weight:600;margin-right:6px;'; cell.appendChild(b); }
            var val=document.createElement('span');
            val.style.cssText='display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;word-break:break-word;line-height:1.35;min-width:0;max-width:100%;';
            val.textContent=c.n; cell.appendChild(val); return val;
        }
        var need=200;
        cands.forEach(function(c){
            var val=build(c);
            var lo=80, hi=Math.max(160,Math.ceil(c.w)+120), best=hi;  /* min column width at which the name is not cut off yet (≤2 lines) */
            for(var it=0;it<12;it++){ var mid=Math.floor((lo+hi)/2);
                td.style.width=mid+'px';
                if(val.scrollHeight<=val.clientHeight){ best=mid; hi=mid-1; } else { lo=mid+1; } }
            if(best>need) need=best;
        });
        document.body.removeChild(td); _pvNameW=need+2; return _pvNameW;  /* +2 px margin for rounding */
    }

    /* Categories: show as many tags as fit in 2 lines; the rest → "+N". */
    function _fitCatTags(){
        pvTable.querySelectorAll('tbody:not(#pv-sel-hidden) td.col-cat .cat-wrap').forEach(function(wrap){
            var prev=wrap.querySelector('.pv-cat-more'); if(prev) prev.remove();
            var tags=Array.prototype.slice.call(wrap.querySelectorAll('.pv-cat-tag:not(.pv-cat-more)'));
            tags.forEach(function(t){ t.style.display=''; });
            if(wrap.scrollHeight<=wrap.clientHeight+1) return;          // everything fit in 2 lines
            var more=document.createElement('span');
            more.className='pv-cat-tag pv-cat-more'; more.style.color='#9ca3af';
            wrap.appendChild(more);
            var hidden=0;
            for(var i=tags.length-1;i>0;i--){                           // keep at least 1 tag
                tags[i].style.display='none'; hidden++;
                more.textContent='+'+hidden;
                if(wrap.scrollHeight<=wrap.clientHeight+1) break;
            }
            if(hidden===0){ more.remove(); }
        });
    }

    function _fitProductCols(){
        var fx=_pvMeasureHdr(), st=pvTable.style, rng=document.createRange();
        /* reset before measuring: all category tags, all columns, full (non-compact) mode */
        pvTable.querySelectorAll('tbody:not(#pv-sel-hidden) td.col-cat .cat-wrap').forEach(function(w){
            var m=w.querySelector('.pv-cat-more'); if(m) m.remove();
            w.querySelectorAll('.pv-cat-tag').forEach(function(t){ t.style.display=''; });
        });
        ['brand','labels','discount','dates'].forEach(function(k){ pvTable.classList.remove('pv-hide-'+k); });
        pvTable.classList.remove('pv-compact');

        var _host=document.querySelector('#content-main')||pvTable.parentElement;
        var _avail=_host?_host.clientWidth:pvTable.getBoundingClientRect().width;
        /* getBoundingClientRect/Range give visual px (smaller than layout px under the Mac zoom),
           while _avail (clientWidth) and style.width are layout px. So we divide these measurements
           by zoom.
           (scrollWidth is already layout px, we do NOT divide it.)
         */
        var _zoom=parseFloat(getComputedStyle(document.body).zoom)||1;

        /* --- measurements (full mode) --- */
        var wPrice=fx.priceH;
        pvTable.querySelectorAll('tbody:not(#pv-sel-hidden) td.col-price .pv-edit-input').forEach(function(el){ var w=Math.ceil(el.getBoundingClientRect().width/_zoom)+20; if(w>wPrice)wPrice=w; });
        var wDates=fx.datesHdr;
        pvTable.querySelectorAll('tbody:not(#pv-sel-hidden) td.col-dates > div > div').forEach(function(el){ rng.selectNodeContents(el); var w=Math.ceil(rng.getBoundingClientRect().width/_zoom)+24; if(w>wDates)wDates=w; });
        function contentMax(sel, base){ var m=base;
            pvTable.querySelectorAll('tbody:not(#pv-sel-hidden) '+sel).forEach(function(el){ rng.selectNodeContents(el); var w=Math.ceil(rng.getBoundingClientRect().width/_zoom)+24; if(w>m)m=w; });
            return m; }
        var wDisc  = contentMax('td.col-disc', fx.discHdr);
        var wBrand = contentMax('td.col-brand', fx.brandHdr);
        var wLab   = Math.min(contentMax('td.col-labels', fx.labHdr), 220);
        var catMin = Math.min(contentMax('td.col-cat .cat-wrap', fx.catHdr), 300);
        var thumb=pvTable.querySelector('tbody:not(#pv-sel-hidden) .pv-thumb');
        var tw=thumb?thumb.getBoundingClientRect().width/_zoom:38;
        function measureStock(){ var ws=fx.stockH; pvTable.querySelectorAll('tbody:not(#pv-sel-hidden) td.col-stock > *').forEach(function(el){ var w=el.scrollWidth+16; if(w>ws)ws=w; }); return ws; }
        function measurePhotos(){ var maxN=0; pvTable.querySelectorAll('tbody:not(#pv-sel-hidden) td.col-photos .pv-photos').forEach(function(ph){ var n=0; ph.querySelectorAll('.pv-photo-wrap').forEach(function(x){ if(getComputedStyle(x).display!=='none') n++; }); if(n>maxN)maxN=n; }); var wp=fx.photosHdr; if(maxN>0) wp=Math.max(wp, Math.ceil(maxN*tw + (maxN-1)*3) + 24 + 1); return wp; }
        var wStock=measureStock();
        var wPhotos=measurePhotos();
        var nameMin=_pvMeasureName();

        function fixedSumOf(p,s){ return 44 + p + fx.sku + fx.active + Math.ceil(wPrice) + s
            + Math.ceil(wDisc) + Math.ceil(wLab) + Math.ceil(wBrand) + Math.ceil(wDates); }

        /* --- COMPACT: if full mode doesn't fit — only 1 photo (stock level stays full) --- */
        if(fixedSumOf(wPhotos, Math.ceil(wStock)) + nameMin + catMin > _avail){
            pvTable.classList.add('pv-compact');
            wPhotos=Math.max(fx.photosHdr, Math.ceil(tw)+24+1);   // one photo
        }

        /* --- edge case: if it is still tight after compressing — hide the secondary columns
           (date first; discount/labels/brand are kept until the last) ---
         */
        var _wmap={dates:Math.ceil(wDates), brand:Math.ceil(wBrand), labels:Math.ceil(wLab), discount:Math.ceil(wDisc)};
        var _fixedSum=fixedSumOf(wPhotos, Math.ceil(wStock));
        var _drop=['dates','brand','labels','discount'];
        for(var _i=0; _i<_drop.length && (_fixedSum + nameMin + catMin) > _avail; _i++){
            pvTable.classList.add('pv-hide-'+_drop[_i]);
            _fixedSum -= _wmap[_drop[_i]];
        }

        /* --- set the widths --- */
        st.setProperty('--pw-photos', wPhotos+'px');
        st.setProperty('--pw-sku',    fx.sku+'px');
        st.setProperty('--pw-dates',  Math.ceil(wDates)+'px');
        st.setProperty('--pw-active', fx.active+'px');
        st.setProperty('--pw-price',  Math.ceil(wPrice)+'px');
        st.setProperty('--pw-stock',  Math.ceil(wStock)+'px');
        st.setProperty('--pw-disc',   Math.ceil(wDisc)+'px');
        st.setProperty('--pw-labels', Math.ceil(wLab)+'px');
        st.setProperty('--pw-brand',  Math.ceil(wBrand)+'px');

        /* name (2/3) + category (1/3) split the remainder; the name is full, the category shrinks if needed */
        /* The name takes ALL the free remainder; the category is the minimum for its content,
           and whatever doesn't fit in 2 lines → a "+N" stub (_fitCatTags).
         */
        var _catFloor=catMin, _rem=_avail - _fixedSum - nameMin;
        if(_rem < _catFloor) _catFloor=Math.max(60, _rem);
        var extra=Math.max(0, Math.floor(_avail - _fixedSum - nameMin - _catFloor));
        st.setProperty('--pw-name', (nameMin+extra)+'px');
        st.setProperty('--pw-cat',  _catFloor+'px');
        _fitCatTags();
    }

    function renderRows(data){
        currentFiltered=data;
        _saveState();
        _renderResetBtn();
        var slice = _pageSlice();
        var oldTbody=pvTable.querySelector('tbody'); if(oldTbody) oldTbody.remove();
        var tbody=document.createElement('tbody'), rowNum=1;
        /* pinned: selected rows from other pages, rendered on top */
        var visibleIds={}; slice.forEach(function(v){visibleIds[String(v.id)]=1;});
        var pinned=[];
        SEL.forEach(function(id){
            if(visibleIds[id]) return;
            for(var i=0;i<allData.length;i++){ if(String(allData[i].id)===id){ pinned.push(allData[i]); break; } }
        });
        pinned.forEach(function(v,idx){
            var tr=buildRow(v,rowNum++,false,true);
            if(idx===0) tr.classList.add('pv-pinned-first');
            if(idx===pinned.length-1) tr.classList.add('pv-pinned-last');
            tbody.appendChild(tr);
        });
        rowNum=1;
        if(groupByProduct){
            /* Collect consecutive rows into groups by key (pair_key|product_id). */
            var groups=[];
            slice.forEach(function(v){
                var key=v.pair_key||v.product_id;
                var last=groups[groups.length-1];
                if(last&&last.key===key) last.items.push(v);
                else groups.push({key:key,items:[v]});
            });
            groups.forEach(function(g,gi){
                if(g.items.length>=2){
                    /* ≥2 variants — a group header, which also serves as the separator. */
                    var collapsed=collapsedGroups.has(g.key);
                    tbody.appendChild(buildGroupHeader(g.items,g.key,collapsed));
                    g.items.forEach(function(v){
                        var row=buildRow(v,rowNum++,false,false);
                        row.classList.add('pv-group-child');
                        if(collapsed) row.style.display='none';
                        tbody.appendChild(row);
                    });
                } else {
                    /* A single product — a regular separator on top. */
                    g.items.forEach(function(v){ tbody.appendChild(buildRow(v,rowNum++,gi>0,false)); });
                }
            });
        } else {
            slice.forEach(function(v){ tbody.appendChild(buildRow(v,rowNum++,false,false)); });
        }
        if (slice.length === 0) {
            var emptyTr = document.createElement('tr');
            emptyTr.className = 'pv-empty-row';
            var emptyTd = document.createElement('td');
            emptyTd.colSpan = 12;
            emptyTd.style.cssText = 'text-align:center;color:#9ca3af;font-size:13px;height:56px;box-sizing:border-box;';
            emptyTd.textContent = 'No results';
            emptyTr.appendChild(emptyTd);
            tbody.appendChild(emptyTr);
        }
        pvTable.appendChild(tbody);
        _fitProductCols();
        _syncHiddenSel();
        _syncSelAll();
        renderPager();
        positionPager();
        if(window._updateCounter) window._updateCounter();
    }

    /* Off-page persistence: keep a hidden checked .pv-cb input inside the table
       for every selected id that is not currently rendered, so the shared
       bulk-action / delete code in base_site.html (which reads .pv-cb:checked)
       acts on the full cross-page selection. */
    function _syncHiddenSel(){
        var holder=pvTable.querySelector('#pv-sel-hidden');
        if(holder) holder.remove();
        holder=document.createElement('tbody');
        holder.id='pv-sel-hidden';
        holder.style.display='none';
        var visible={};
        pvTable.querySelectorAll('tbody:not(#pv-sel-hidden) .pv-cb').forEach(function(cb){visible[cb.value]=1;});
        SEL.forEach(function(id){
            if(visible[id]) return;
            var v=null;
            for(var i=0;i<allData.length;i++){ if(String(allData[i].id)===id){ v=allData[i]; break; } }
            var inp=document.createElement('input');
            inp.type='checkbox'; inp.className='pv-cb'; inp.name='variant_ids';
            inp.value=id; inp.checked=true;
            if(v) inp.dataset.productId=v.product_id;
            holder.appendChild(inp);
        });
        pvTable.appendChild(holder);
    }

    /* Delegated change listener: keep SEL in sync with row checkboxes. */
    pvTable.addEventListener('change',function(e){
        var cb=e.target;
        if(!cb.classList||!cb.classList.contains('pv-cb')) return;
        if(cb.parentNode&&cb.parentNode.id==='pv-sel-hidden') return;
        if(cb.checked) SEL.add(String(cb.value)); else SEL.delete(String(cb.value));
        renderRows(currentFiltered);
        if(window._updateCounter) window._updateCounter();
    });

    updateTable({preservePage: true});

    /* Override the shared counter so it reports the full cross-page selection
       (SEL.size) out of the whole filtered dataset. base_site sets
       window._updateCounter on DOMContentLoaded, so we wrap it after that. */
    function _installCounter(){
        var counter=document.querySelector('.cl-counter');
        if(!counter) return;
        // "Clear selection" — clears the whole cross-page selection (including
        // other pages).
        if(!document.getElementById('cl-clear-sel')){
            var clearBtn=document.createElement('a');
            clearBtn.href='#'; clearBtn.id='cl-clear-sel'; clearBtn.className='cl-top-btn';
            clearBtn.textContent='Clear selection';
            clearBtn.style.marginLeft='10px';
            clearBtn.style.setProperty('display','none','important');
            clearBtn.addEventListener('click',function(e){
                e.preventDefault();
                // Remove only the selection from OTHER pages, keeping the current page's selection.
                var pageIds=new Set(_pageSlice().map(function(v){return String(v.id);}));
                Array.from(SEL).forEach(function(id){ if(!pageIds.has(id)) SEL.delete(id); });
                renderRows(currentFiltered);
                if(window._updateCounter) window._updateCounter();
            });
            counter.insertAdjacentElement('afterend', clearBtn);
        }
        window._updateCounter=function(){
            // Show the cross-page selection (SEL.size) out of the whole filtered
            // dataset. Pinned rows are not in currentFiltered — take the max.
            var total = Math.max((currentFiltered && currentFiltered.length) || 0, SEL.size);
            counter.textContent='Selected: '+SEL.size+' of '+total;
            // "Clear selection" — only when there is a selection from OTHER pages
            // (outside the current one).
            // .cl-top-btn has display:inline-flex !important — hide it with !important too.
            var pageIds=_pageSlice().map(function(v){return String(v.id);});
            var onPage=pageIds.filter(function(id){return SEL.has(id);}).length;
            var offPage=SEL.size-onPage;
            var cb=document.getElementById('cl-clear-sel');
            if(cb){ if(offPage>0) cb.style.removeProperty('display'); else cb.style.setProperty('display','none','important'); }
        };
        window._updateCounter();
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', _installCounter);
    } else {
        _installCounter();
    }
    /* The reset button is drawn on DOMContentLoaded — .cl-bar is created there. */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', _renderResetBtn);
    } else {
        _renderResetBtn();
    }

    /* The "Write-off" button — opens the recognition modal (a separate script below).
       The button itself is only added to .cl-bar here; the handler is window._woOpenInput,
       which is already defined at click time regardless of script execution order.
     */
    function _renderWriteoffBtn(){
        var bar = document.querySelector('.submit-row.cl-bar'); if (!bar) return;
        if (document.getElementById('wo-open-btn')) return;
        var btn = document.createElement('button');
        btn.type='button'; btn.id='wo-open-btn';
        btn.className='cl-top-btn';
        btn.textContent='Write-off';
        btn.addEventListener('click', function(){ if (window._woOpenInput) window._woOpenInput(); });
        var counter = bar.querySelector('.cl-counter');
        if (counter) bar.insertBefore(btn, counter); else bar.appendChild(btn);
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', _renderWriteoffBtn);
    } else {
        _renderWriteoffBtn();
    }
})();
</script>
{% endblock %}
