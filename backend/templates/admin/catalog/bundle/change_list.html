{% extends "admin/change_list.html" %}

{% block result_list %}
{{ block.super }}
<style>
#result_list { display: none !important; }
#toolbar { display: none !important; }
.results { display: none !important; }

/* ── Table ── */
#pb-table { table-layout: fixed; width: 100%; border-collapse: collapse !important; border-top: none !important; --hairline-color: transparent; }
#pb-table td, #pb-table th { border-top: none !important; }
#pb-table thead th { border-bottom: 1px solid #e5e7eb !important; }
#pb-table thead tr th {
    background: #f9fafb !important; border-bottom: 1px solid #e5e7eb !important;
    border-left: 1px solid #e5e7eb !important; padding: 10px 12px !important;
    font-size: 10px !important; font-weight: 700 !important; text-transform: uppercase !important;
    letter-spacing: 0.4px !important; color: #6b7280 !important; white-space: nowrap !important;
    vertical-align: middle !important; text-align: left !important;
}
#pb-table thead tr th:first-child { border-left: none !important; }
#pb-table thead tr th.col-cb { padding: 0 0 0 14px !important; width: 44px !important; }

th[data-col] { cursor: pointer !important; user-select: none !important; position: relative !important; }
#pb-table thead tr th[data-col] { padding-right: 26px !important; }
#pb-table thead tr th[data-col]:hover, #pb-table thead tr th[data-col].col-open { color: #1f2937 !important; }
#pb-table thead tr th[data-col].col-on { background: #d1d5db !important; color: #1f2937 !important; }
.th-badge { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; pointer-events: none; }

#pb-table tbody tr { border-bottom: 1px solid #e5e7eb !important; height: 56px; }
#pb-table.tbl-touches-pager tbody tr:last-child { border-bottom: none !important; }
#pb-table tbody tr.row1 { background: #fff !important; }
#pb-table tbody tr.row2 { background: #f9fafb !important; }
#pb-table tbody tr:hover { background: #eef0f3 !important; }
#pb-table tbody tr.pb-empty-row, #pb-table tbody tr.pb-empty-row:hover { background: #fff !important; cursor: default !important; border-bottom: 1px solid #e5e7eb !important; }
#pb-table tbody tr.pb-empty-row td { border-bottom: 1px solid #e5e7eb !important; vertical-align: middle !important; text-align: center !important; padding: 0 !important; color: #9ca3af !important; font-size: 13px !important; }
table.tbl-touches-pager tbody tr.pb-empty-row, table.tbl-touches-pager tbody tr.pb-empty-row td { border-bottom: 1px solid #e5e7eb !important; }
#pb-table tbody td, #pb-table tbody th {
    padding: 8px 12px !important; font-size: 13px !important; vertical-align: middle !important;
    border-left: 1px solid #e5e7eb !important; border-bottom: none !important;
    font-weight: 400 !important; color: #374151 !important; text-align: left !important;
    overflow: hidden !important; height: 56px !important; box-sizing: border-box !important;
}
#pb-table tbody td:first-child, #pb-table tbody th:first-child { border-left: none !important; }
#pb-table tbody th a { color: #374151 !important; text-decoration: none !important; font-weight: 400 !important; }
#pb-table td, #pb-table th { white-space: nowrap; }
#pb-table .col-name  { min-width: 0; white-space: normal; }
/* Name — by default on one full line (column width fits the longest name). */
#pb-table .col-name a, #pb-table .col-name .col-name-val {
    white-space: nowrap;
    overflow: hidden;
    line-height: 1.35;
    max-width: 100%;
}
/* Narrow mode (Mac): name on 2 lines so the table fits without horizontal scroll. */
#pb-table.pb-name-2line .col-name a, #pb-table.pb-name-2line .col-name .col-name-val {
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
}
#pb-table.pb-name-2line tbody th.col-name { height: auto !important; overflow: visible !important; }
#pb-table tbody th.col-name { height: auto !important; overflow: visible !important; }
/* Width is set by --bw-items (table-layout:fixed); equal left/right paddings */
#pb-table .col-items {
    white-space: nowrap;
    overflow: hidden;
    padding-right: 12px !important;
    padding-left: 12px !important;
}
#pb-table .col-items > div { max-width: 100%; overflow: hidden; }
#pb-table tr.pb-multi .pb-name-cell::before { content: "─"; color: #9ca3af; margin-right: 8px; }
#pb-table .col-cat   { min-width: 0; }
#pb-table .col-cat .cat-wrap { display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; overflow: hidden; line-height: 1.4; }
/* Dates column — as wide as the dates themselves (does not stretch): width:1% + nowrap. */
#pb-table .col-dates { width: 1%; white-space: nowrap; }
.pb-cat-more {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; color: #6b7280;
    border: 1px solid #e5e7eb; border-radius: 3px;
    padding: 1px 6px; flex-shrink: 0; cursor: default;
    background: #f9fafb;
}
.pb-cat-popover {
    display: none; position: fixed; z-index: 99999;
    background: #fff; border: 1px solid #e5e7eb;
    border-radius: 6px; padding: 6px 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    min-width: 160px; max-width: 280px;
    pointer-events: auto;
}
.pb-cat-popover.open { display: block; }
.pb-cat-popover .pb-cat-line { font-size: 12px; line-height: 1.5; color: #374151; padding: 2px 0; white-space: normal; word-break: break-word; }
#pb-table .col-cb    { width: 44px !important; min-width: 44px !important; max-width: 44px !important; padding: 0 0 0 14px !important; }
#pb-table .col-price  { padding: 6px 10px !important; }
#pb-table .col-stock  { padding: 6px 8px !important; }
#pb-table .col-active { padding: 6px 12px !important; }
#pb-table .col-active .pv-active-cb { cursor: pointer; width: 16px; height: 16px; accent-color: #374151; }

/* Lightbox */
#pb-lightbox { display: none; position: fixed; inset: 0; z-index: 999999; background: rgba(0,0,0,0.82); align-items: center; justify-content: center; cursor: zoom-out; }
#pb-lightbox.open { display: flex; }
#pb-lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }

/* Photos */
#pb-table .col-photos { width: 1%; }

/* ── Column widths (table-layout:fixed) - px via JS (Safari-safe, no calc%) ── */
#pb-table thead th[data-col="photos"]    { width: var(--bw-photos, 70px) !important; }
#pb-table thead th[data-col="sku"]       { width: var(--bw-sku, 90px) !important; }
#pb-table thead th[data-col="items"]     { width: var(--bw-items, 400px) !important; }
#pb-table thead th[data-col="dates"]     { width: var(--bw-dates, 175px) !important; }
#pb-table thead th[data-col="discount"]  { width: var(--bw-disc, 80px) !important; }
#pb-table thead th[data-col="labels"]    { width: var(--bw-labels, 130px) !important; }
#pb-table thead th[data-col="is_active"] { width: var(--bw-active, 76px) !important; }
#pb-table thead th[data-col="price"]     { width: var(--bw-price, 110px) !important; }
#pb-table thead th[data-col="stock"]     { width: var(--bw-stock, 150px) !important; }
#pb-table td.col-dates > div > div { white-space: nowrap !important; }
/* Name + Category - flexible (name 2/3, category 1/3), JS computes px. */
#pb-table thead th[data-col="cat"]  { width: var(--bw-cat, 200px) !important; }
#pb-table thead th[data-col="name"] { width: var(--bw-name, 300px) !important; }
/* Compact (narrow screen): only 1 photo in the "Photo" column. */
#pb-table.pb-compact td.col-photos .pb-photo-wrap:not(:first-child) { display: none !important; }
/* Hiding secondary elements on narrow screens (class set by JS): discount → labels → dates. */
#pb-table.pb-hide-discount th[data-col="discount"], #pb-table.pb-hide-discount td.col-disc   { display: none !important; }
#pb-table.pb-hide-labels   th[data-col="labels"],   #pb-table.pb-hide-labels   td.col-labels { display: none !important; }
#pb-table.pb-hide-dates    th[data-col="dates"],    #pb-table.pb-hide-dates    td.col-dates  { display: none !important; }
/* Spacer column: no width (auto) → takes all the free space on the right,
   so other columns stay minimal for their content (no stretching).
 */
#pb-table thead th.col-spacer, #pb-table tbody td.col-spacer { border-left: none !important; padding: 0 !important; }
#pb-table thead tr th[data-col="photos"] { padding-right: 12px !important; }
#pb-table thead tr th[data-col="stock"]  { padding-right: 12px !important; }
.pb-photos { display: flex; gap: 3px; }
.pb-photo-wrap { position: relative; display: inline-block; flex-shrink: 0; }
.pb-photo-wrap img.pb-thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 4px; border: 1px solid #d1d5db; background: #f3f4f6; display: block; transition: filter .15s; }
.pb-photo-wrap:hover img.pb-thumb { filter: brightness(0.82); }
/* .pb-photo-preview — main styles moved to base_site.html. Only the .ic-* sub-classes (unique to bundle items) remain. */
/* Item avatar thumb (no photo) */
.pb-item-av { width: 40px; height: 40px; box-sizing: border-box; border: 1px solid transparent; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; transition: filter .15s; }
.pb-photo-wrap:hover .pb-item-av { filter: brightness(0.88); }
/* Item preview extra info */
.pb-photo-preview .ic-name { margin-top: 6px; font-size: 12px; color: #1f2937; font-weight: 500; line-height: 1.4; white-space: normal; width: 180px; padding: 0 4px; }
.pb-photo-preview .ic-sku { margin-top: 2px; font-size: 11px; color: #9ca3af; padding: 0 4px; }
.pb-photo-preview .ic-av { width: 180px; height: 180px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 700; }

/* Interactive popup with a list of products (+N badge) */
.pb-items-popover {
    display: none;
    position: fixed;
    z-index: 99999;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    min-width: 300px;
    max-width: 380px;
    pointer-events: auto;
    overflow: visible;
}
/* A real "bridge" DOM element between the badge and the popup so the cursor does not lose hover */
.pb-items-bridge {
    position: absolute;
    left: 0; right: 0;
    height: 8px;
    background: transparent;
    pointer-events: auto;
}
.pb-items-popover .pb-items-bridge { top: -6px; }
.pb-items-popover.up .pb-items-bridge { top: auto; bottom: -6px; }
.pb-items-popover.open { display: block; }
.pb-items-popover a:hover .pb-popover-thumb { filter: brightness(0.82); }

.pb-cat-tag { display: inline-block; font-size: 13px; background: transparent; border: 1px solid #e5e7eb; border-radius: 3px; padding: 1px 5px; margin: 1px 1px 0 0; color: #6b7280; white-space: nowrap; cursor: default; }
.pb-auto-val { font-size: 13px; color: #374151; }

/* Price / stock */
.pb-edit-cell { display: flex; align-items: center; gap: 4px; }
#pb-table .pb-edit-input { width: 76px; padding: 0 6px !important; height: 28px !important; border: 1px solid #d1d5db !important; border-radius: 4px !important; font-size: 13px !important; background: #fff !important; color: #374151 !important; box-shadow: none !important; }
#pb-table .pb-edit-input:focus { border-color: #9ca3af !important; }
#pb-table .pb-edit-input.saved  { border-color: #16a34a !important; background: #f0fdf4 !important; }
#pb-table .pb-edit-input.error  { border-color: #dc2626 !important; background: #fef2f2 !important; }
.pb-currency { font-size: 12px; color: #9ca3af; }
.delta-wrapper { display: inline-flex; align-items: center; gap: 2px; }
.delta-btn { width: 28px; height: 28px; padding: 0; background: #fff; border: 1px solid #d1d5db; border-radius: 4px; font-size: 16px; cursor: pointer; line-height: 1; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.delta-btn:hover { background: #f3f4f6 !important; border-color: #9ca3af !important; }
#pb-table .delta-input { width: 46px; height: 28px !important; padding: 0 5px !important; border: 1px solid #d1d5db !important; border-radius: 4px !important; font-size: 13px !important; background: #fff !important; color: #374151 !important; box-shadow: none !important; }
#pb-table .pb-stock-main { width: 54px; height: 28px !important; padding: 0 5px !important; border: 1px solid #d1d5db !important; border-radius: 4px !important; font-size: 13px !important; text-align: center; background: #fff !important; color: #374151 !important; box-shadow: none !important; }
#pb-table .pb-stock-main.saved { border-color: #16a34a !important; background: #f0fdf4 !important; }
#pb-table .pb-stock-main.error { border-color: #dc2626 !important; background: #fef2f2 !important; }

/* ── Popover ── */
#pb-flt-pop {
    display: none; position: fixed; z-index: 9999; background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 0 0 6px 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,.18);
    overflow: hidden;
    width: 200px;
}
#pb-flt-pop.open { display: block; }
.fp-sort-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; border-bottom: 1px solid #ececec;
    background: #fff; color: #374151; font-size: 13px;
    cursor: pointer; width: 100%; text-align: left;
    border-left: none; border-right: none; border-top: none;
}
.fp-sort-row:last-of-type { border-bottom: 1px solid #e5e7eb; }
.fp-sort-row:hover { background: #f5f5f5; }
.fp-sort-row.on { background: #e5e7eb; color: #374151; }
.fp-sort-arr { color: #d1d5db; font-size: 18px; line-height: 1; flex-shrink: 0; display: inline-flex; align-items: center; }
.fp-sort-row.on .fp-sort-arr { color: #374151; }
.fp-pop-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.fp-filter-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: #9ca3af; margin-bottom: 6px; }
.fp-pills { display: flex; gap: 3px; flex-wrap: wrap; }
.fp-pill { padding: 3px 8px; border: 1px solid #d1d5db; border-radius: 20px; font-size: 11px; color: #6b7280; cursor: pointer; background: #fff; user-select: none; }
.fp-pill:hover { background: #f9fafb; color: #374151; }
.fp-pill.on { background: #1f2937; border-color: #1f2937; color: #fff; }
.fp-search { width: 100%; box-sizing: border-box; height: 28px; padding: 0 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; outline: none; margin-bottom: 0; }
.fp-search:focus { border-color: #9ca3af; }
.fp-list { display: flex; flex-direction: column; gap: 10px; max-height: 140px; overflow-y: auto; margin: 0 -10px -10px -10px; padding: 10px; border-radius: 0 0 6px 6px; border-top: 1px solid #e5e7eb; }
.fp-pop-body > .fp-list:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.fp-item { display: flex; align-items: center; gap: 6px; padding: 0; font-size: 13px; line-height: 1; color: #374151; border-radius: 3px; position: relative; }
/* 2px lines, same color as the checkbox (#d1d5db). */
.fp-item .pick-vline { position: absolute; top: -5px; bottom: -5px; width: 2px; background: #d1d5db; pointer-events: none; z-index: 0; }
.fp-item .pick-vline.is-first { top: -10px; }
.fp-item .pick-vline.is-last  { bottom: 50%; }
.fp-item .pick-hline { position: absolute; top: 50%; height: 2px; background: #d1d5db; pointer-events: none; z-index: 0; transform: translateY(-1px); }
.fp-item .pick-elbow {
    position: absolute;
    border-left: 2px solid #d1d5db;
    border-bottom: 2px solid #d1d5db;
    border-bottom-left-radius: 5px;
    pointer-events: none; z-index: 0;
}
.fp-item > label { position: relative; z-index: 1; }
.fp-item input[type=checkbox],
.fp-item input[type=radio] {
    appearance: none; -webkit-appearance: none;
    width: 14px; height: 14px; flex-shrink: 0;
    border: 1.5px solid #d1d5db;
    background: #fff; cursor: pointer; position: relative;
    margin: 0;
    transition: background .12s, border-color .12s;
}
.fp-item input[type=checkbox] { border-radius: 3px; }
.fp-item input[type=radio]    { border-radius: 50%; }
.fp-item input[type=checkbox]:hover,
.fp-item input[type=radio]:hover { border-color: #9ca3af; }
.fp-item input[type=checkbox]:checked,
.fp-item input[type=radio]:checked { background: #1f2937; border-color: #1f2937; }
.fp-item input[type=checkbox]:checked::after,
.fp-item input[type=radio]:checked::after {
    content: ''; position: absolute;
    left: 3px; top: 0px; width: 4px; height: 8px;
    border: 1.5px solid #fff; border-top: none; border-left: none;
    transform: rotate(45deg);
}
.fp-range { display: flex; align-items: center; gap: 4px; }
.fp-pop-body:has(> .fp-range:last-child) { padding-bottom: 8px; }
.fp-range input { flex: 1; min-width: 0; width: 0; height: 28px; padding: 0 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; outline: none; box-sizing: border-box; }
.fp-range input:focus { border-color: #9ca3af; }
.fp-range-sep { font-size: 0; color: transparent; width: 8px; height: 1px; background: #9ca3af; align-self: center; flex-shrink: 0; margin-top: -1px; }
.fp-divider { height: 1px; background: #e5e7eb; margin: 8px 0; }
.fp-clear { display: block; margin-top: 8px; padding: 0; border: none; background: none; font-size: 11px; color: #9ca3af; cursor: pointer; text-align: left; }
.fp-clear:hover { color: #dc2626; }

/* ── Calendar ── */
.cal-nav { display:flex; align-items:center; justify-content:space-between; padding:8px 10px 4px; }
.cal-nav-btn { background:#f9fafb; border:1px solid #d1d5db; border-radius:4px; width:26px; height:26px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:#374151; font-size:16px; line-height:1; padding:0; flex-shrink:0; transition:background .1s,border-color .1s; }
.cal-nav-btn:hover { background:#e5e7eb; border-color:#9ca3af; color:#111; }
.cal-nav-btn:active { background:#d1d5db; }
.cal-title { font-size:12px; font-weight:600; color:#374151; text-align:center; flex:1; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); padding:0 6px 0; }
.cal-dow { font-size:10px; color:#9ca3af; text-align:center; padding:2px 0 5px; font-weight:600; }
.cal-day { font-size:12px; text-align:center; padding:5px 0; cursor:pointer; color:#374151; user-select:none; border-radius:4px; transition:background .1s; }
.cal-day.empty { cursor:default; pointer-events:none; }
.cal-day:not(.empty):not(.sel-start):not(.sel-end):hover { background:#d1d5db; }
.cal-day.today { font-weight:700; color:#111; }
.cal-day.sel-start, .cal-day.sel-end { background:#1f2937; color:#fff; border-radius:4px; }
.cal-day.sel-start:hover, .cal-day.sel-end:hover { background:#374151; }
.cal-day.in-range { background:#e5e7eb; border-radius:0; }
.cal-day.in-range:hover { background:#d1d5db; }
.cal-day.sel-start.has-range { border-radius:4px 0 0 4px; }
.cal-day.sel-end.has-range   { border-radius:0 4px 4px 0; }
.cal-reset { display:block; text-align:center; padding:0 10px 10px; font-size:11px; color:#9ca3af; cursor:pointer; background:none; border:none; width:100%; }
.cal-reset:hover { color:#dc2626; }

/* ── Pager ── */
#pb-pager {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 10px 16px; font-size: 13px; color: #6b7280;
    border-top: 1px solid #e5e7eb;
    position: fixed; bottom: 0; right: 0;
    background: #fff; z-index: 1000;
}
#pb-pager .pager-info { font-size: 12px; color: #9ca3af; }
#pb-pager .pager-nav { display: flex; align-items: center; gap: 4px; justify-self: center; }
#pb-pager .pg-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0; border: 1px solid #d1d5db;
    border-radius: 4px; background: #fff; color: #374151;
    font-size: 13px; cursor: pointer; line-height: 1;
    user-select: none; text-decoration: none !important; box-sizing: border-box; flex-shrink: 0;
}
#pb-pager .pg-btn:hover { background: #f3f4f6; border-color: #d1d5db; }
#pb-pager .pg-btn.pg-active { background: #1f2937; color: #fff; border-color: #1f2937; }
#pb-pager .pg-btn.pg-disabled { opacity: 0.35; pointer-events: none; }
#pb-pager .pg-btn.pg-arrow { color: #6b7280; }
#pb-pager .pager-nav .pg-dots { padding: 0 2px; color: #9ca3af; font-size: 12px; line-height: 28px; }
#pb-pager .pager-right { display: flex; align-items: center; gap: 0; justify-self: end; }
#pb-pager .pager-size { display: flex; align-items: center; gap: 4px; font-size: 12px; }
#pb-pager .pager-size > span:first-child { color: #9ca3af; }
#pb-pager .pager-size .pg-btn { width: auto; min-width: 36px; padding: 0 8px; }
#pb-pager .pager-group { margin-left: 12px; padding-left: 12px; border-left: 1px solid #e5e7eb; }
#pb-pager .pager-group .pg-btn { width: auto; padding: 0 10px; }
#pb-table tbody tr.pb-pinned, #pb-table tbody tr.pb-pinned:hover { background: #eff6ff !important; }
#pb-table tbody tr.pb-pinned-first td, #pb-table tbody tr.pb-pinned-first th { border-top: 2px solid #d1d5db !important; }
#pb-table tbody tr.pb-pinned-last td, #pb-table tbody tr.pb-pinned-last th { border-bottom: 2px solid #d1d5db !important; }

/* Variants of a grouped bundle (≥2) — gray strip on the left (photos are not shifted).
   We do not touch the header row, only remove the bold outline above it.
 */
#pb-table tbody tr.pv-group-header td, #pb-table tbody tr.pv-group-header th { border-top: none !important; }
#pb-table tbody tr.pv-group-child > td:first-child,

    cursor: pointer; user-select: none;

<div id="pb-lightbox"><img id="pb-lightbox-img" src="" alt=""></div>
<div id="pb-flt-pop"></div>
<table id="pb-table"></table>
<div id="pb-pager"></div>

<div id="pb-loading" style="padding:40px;text-align:center;color:#9ca3af;font-size:13px;">Loading…</div>
<script>
(function () {
    var allData = null;
    var catsTree = {{ cats_tree_json|safe }};
    var allLabels = {{ labels_json|safe }};

    var F = {nameQ:'',skuQ:'',photos:'all',cats:[],labels:[],priceMin:null,priceMax:null,stockOnly:false,stockNone:false,stockMode:'all',stockMin:null,stockMax:null,dateMin:null,dateMax:null,dateMinU:null,dateMaxU:null,status:'all',discount:'all'};
    /* Sort by default — null. The table is sorted via _defaultSort (new → old),
       but no button is highlighted in the dates popup until the user clicks one.
     */
    var sortField=null, sortDir='asc';
    var currentPage=1, pageSize=25, currentFiltered=[];
    var groupByBundle=false;
    /* Collapsed groups (keys = bundle_id) — variant rows are hidden. */
    var collapsedGroups=new Set();
    /* Persistent selection across client-side pagination (row ids as strings). */
    var SEL = new Set();
    /* Filter "by product" (a bundle component) - declared BEFORE _loadState(),
       otherwise the var hoisting below would overwrite the restored value with an empty array.
     */
    var selectedItems=[]; /* array of variant objects */

    /* ── Persist state — filters + sorting + grouping + pagination. ── */
    var STATE_KEY = 'catalog_bundle_list_state_v1';
    function _saveState(){
        try {
            localStorage.setItem(STATE_KEY, JSON.stringify({
                F:F,
                sortField:sortField, sortDir:sortDir,
                groupByBundle:groupByBundle, collapsedGroups: Array.from(collapsedGroups),
                currentPage:currentPage, pageSize:pageSize,
                SEL: Array.from(SEL),
                selectedItems: selectedItems,
            }));
        } catch(e) {}
    }
    function _loadState(){
        try {
            var raw = localStorage.getItem(STATE_KEY);
            if (!raw) return false;
            var s = JSON.parse(raw);
            if (s.F) Object.assign(F, s.F);
            if (typeof s.sortField     !== 'undefined') sortField     = s.sortField;
            if (typeof s.sortDir       !== 'undefined') sortDir       = s.sortDir;
            if (typeof s.groupByBundle !== 'undefined') groupByBundle = s.groupByBundle;
            if (Array.isArray(s.collapsedGroups)) collapsedGroups = new Set(s.collapsedGroups);
            if (typeof s.currentPage   !== 'undefined') currentPage   = s.currentPage;
            if (typeof s.pageSize      !== 'undefined') pageSize      = s.pageSize;
            /* Data loads asynchronously — restore the selection here, clean up in init(). */
            if (Array.isArray(s.SEL)) s.SEL.forEach(function(id){ SEL.add(String(id)); });
            if (Array.isArray(s.selectedItems)) selectedItems = s.selectedItems;
            return true;
        } catch(e) {}
        return false;
    }
    _loadState();

    /* Unique variants list for autocomplete — populated in init() */
    var allVariants=[];


    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function getCsrf(){var el=document.querySelector('[name=csrfmiddlewaretoken]');return el?el.value:'';}
    function toCmpDate(str){ var m=str&&str.match(/^(\d{2})\.(\d{2})\.(\d{4})/); return m?m[3]+'-'+m[2]+'-'+m[1]:null; }
    /* Sorting also needs the time. The display string dd.mm.yyyy HH:MM
       compares lexicographically wrong (01.09 < 11.05), so we convert
       it to YYYY-MM-DD HH:MM.
     */
    function toCmpDT(str){
        var m=str&&str.match(/^(\d{2})\.(\d{2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
        return m?m[3]+'-'+m[2]+'-'+m[1]+' '+String(m[4]||'00').padStart(2,'0')+':'+(m[5]||'00'):'';
    }

    function effectivePrice(b){return b.price_manual?(parseFloat(b.price)||0):(parseFloat(b.auto_price)||0);}
    function effectiveStock(b){return b.stock_manual?(b.stock!=null?parseInt(b.stock):0):(parseInt(b.auto_stock)||0);}

    function expandCats(names){
        var nameSet={}, idSet={};
        names.forEach(function(n){ nameSet[n]=1; });
        catsTree.forEach(function(c){ if(nameSet[c.name]) idSet[c.id]=1; });
        var changed=true;
        while(changed){
            changed=false;
            catsTree.forEach(function(c){
                if(!nameSet[c.name]&&c.parent_id&&idSet[c.parent_id]){nameSet[c.name]=1;idSet[c.id]=1;changed=true;}
            });
        }
        return Object.keys(nameSet);
    }

    function applyFilters(data){
        var expandedCats=F.cats.length?expandCats(F.cats):[];
        return data.filter(function(b){
            if(selectedItems.length && !selectedItems.every(function(sel){
                var sk=(sel.display_sku||sel.sku||'').toLowerCase();
                var nm=(sel.display_name||sel.name||'').toLowerCase();
                return (b.items_search||[]).some(function(i){
                    return (sk&&i.sku===sk)||(nm&&i.name===nm);
                });
            })) return false;
            if(F.nameQ && (b.name||'').toLowerCase().indexOf(F.nameQ.toLowerCase())===-1) return false;
            if(F.skuQ  && (b.sku||'').indexOf(F.skuQ)===-1) return false;
            if(F.photos==='with'    && !(b.photos&&b.photos.length)) return false;
            if(F.photos==='without' &&  (b.photos&&b.photos.length)) return false;
            if(F.cats.length && !(b.categories||[]).some(function(c){return expandedCats.indexOf(c)!==-1;})) return false;
            if(F.labels.length && !(b.labels||[]).some(function(l){return F.labels.indexOf(l.name)!==-1;})) return false;
            var price=effectivePrice(b);
            if(F.priceMin!==null && price<F.priceMin) return false;
            if(F.priceMax!==null && price>F.priceMax) return false;
            var stock=effectiveStock(b);
            if(F.stockOnly && stock<=0) return false;
            if(F.stockNone && stock>0) return false;
            if(F.stockMode==='manual' && !b.stock_manual) return false;
            if(F.stockMode==='auto'   &&  b.stock_manual) return false;
            if(F.stockMin!==null && stock<F.stockMin) return false;
            if(F.stockMax!==null && stock>F.stockMax) return false;
            if(F.dateMin||F.dateMax){ var cd=toCmpDate(b.created_at); if(F.dateMin&&(!cd||cd<F.dateMin)) return false; if(F.dateMax&&(!cd||cd>F.dateMax)) return false; }
            if(F.dateMinU||F.dateMaxU){ var cu=toCmpDate(b.updated_at); if(F.dateMinU&&(!cu||cu<F.dateMinU)) return false; if(F.dateMaxU&&(!cu||cu>F.dateMaxU)) return false; }
            if(F.status==='active' && !b.is_active) return false;
            if(F.status==='hidden' &&  b.is_active) return false;
            if(F.discount==='percent' && !b.discount_percent) return false;
            if(F.discount==='amount'  && !b.discount_amount)  return false;
            if(F.discount==='none'    && (b.discount_percent||b.discount_amount)) return false;
            return true;
        });
    }
    function applySort(data){
        if(!sortField){
            /* Default: newer → older by created_at — the user explicitly chose nothing. */
            return data.slice().sort(function(a,b){
                var va=toCmpDT(a.created_at), vb=toCmpDT(b.created_at);
                return va<vb?1:va>vb?-1:0;
            });
        }
        return data.slice().sort(function(a,b){
            var va,vb;
            if     (sortField==='name')      {va=(a.name||'').toLowerCase();vb=(b.name||'').toLowerCase();}
            else if(sortField==='sku')       {va=a.sku||'';vb=b.sku||'';}
            else if(sortField==='price')     {va=effectivePrice(a);vb=effectivePrice(b);}
            else if(sortField==='stock')     {va=effectiveStock(a);vb=effectiveStock(b);}
            else if(sortField==='created_at'){va=toCmpDT(a.created_at);vb=toCmpDT(b.created_at);}
            else if(sortField==='updated_at'){va=toCmpDT(a.updated_at);vb=toCmpDT(b.updated_at);}
            else if(sortField==='discount'){
            if(F.discount==='amount'){va=parseFloat(a.discount_amount)||0;vb=parseFloat(b.discount_amount)||0;}
            else{va=parseFloat(a.discount_percent)||0;vb=parseFloat(b.discount_percent)||0;}
        }
            else if(sortField==='is_active') {va=a.is_active?0:1;vb=b.is_active?0:1;}
            else return 0;
            return va<vb?(sortDir==='asc'?-1:1):va>vb?(sortDir==='asc'?1:-1):0;
        });
    }
    function isColFiltered(col){
        if(col==='photos')     return F.photos!=='all';
        if(col==='name')       return !!F.nameQ;
        if(col==='sku')        return !!F.skuQ;
        if(col==='items')      return selectedItems.length>0;
        if(col==='cat')        return F.cats.length>0;
        if(col==='labels')     return F.labels.length>0;
        if(col==='price')      return F.priceMin!==null||F.priceMax!==null;
        if(col==='stock')      return F.stockOnly||F.stockNone||F.stockMode!=='all'||F.stockMin!==null||F.stockMax!==null;
        if(col==='dates') return !!(F.dateMin||F.dateMax||F.dateMinU||F.dateMaxU);
        if(col==='is_active')  return F.status!=='all';
        if(col==='discount')   return F.discount!=='all';

        return false;
    }

    var pbTable=document.getElementById('pb-table');

    function applyGroup(data){
        if(!groupByBundle) return data;
        var indexed=data.map(function(b,i){return{b:b,i:i};});
        indexed.sort(function(a,b){
            var pa=a.b.product_id!=null?a.b.product_id:'';
            var pb=b.b.product_id!=null?b.b.product_id:'';
            if(pa!==pb) return pa<pb?-1:1;
            return a.i-b.i;
        });
        return indexed.map(function(x){return x.b;});
    }

    function updateTable(opts){
        if(!allData) return;
        if (!opts || !opts.preservePage) currentPage=1;
        _saveState();
        var filtered=applyGroup(applySort(applyFilters(allData)));
        pbTable.querySelectorAll('th[data-col]').forEach(function(th){
            var col=th.dataset.col;
            var fc=isColFiltered(col), sc=(sortField===col) || (col==='dates' && (sortField==='created_at'||sortField==='updated_at'));
            th.classList.toggle('col-filtered',fc);
            /* "Dates" column: filter/sorting work, but we do not show the funnel icon
               and the light-blue highlight.
             */
            var visual=(col!=='dates') && (fc||sc);
            th.classList.toggle('col-on',visual);
            var badge=th.querySelector('.th-badge');
            if(badge) badge.innerHTML=visual?'<svg width="9" height="10" viewBox="0 0 10 11" fill="#374151"><path d="M0 0h10L6.5 5v6h-3V5z"/></svg>':'';
        });
        renderRows(filtered);
    }
    function resetCol(col){
        if(col==='name')        F.nameQ='';
        else if(col==='sku')    F.skuQ='';
        else if(col==='items')  selectedItems=[];
        else if(col==='photos') F.photos='all';
        else if(col==='cat')    F.cats=[];
        else if(col==='labels') F.labels=[];
        else if(col==='price')  { F.priceMin=null; F.priceMax=null; }
        else if(col==='stock')  { F.stockOnly=false; F.stockNone=false; F.stockMode='all'; F.stockMin=null; F.stockMax=null; }
        else if(col==='dates') { F.dateMin=null; F.dateMax=null; F.dateMinU=null; F.dateMaxU=null; if(sortField==='created_at'||sortField==='updated_at'){ sortField=null; sortDir='asc'; } }
        else if(col==='is_active') F.status='all';
        else if(col==='discount')  F.discount='all';
        if(sortField===col){ sortField=null; sortDir='asc'; }
        updateTable();
    }

    /* ── Popover ── */
    var pop=document.getElementById('pb-flt-pop'), popOwner=null;
    /* Dynamic width for items — so that the longest variant name fits on one line.
       Measured via a DOM probe with the actual font (inherited from body) and font-weight:600,
       because on search <mark> makes the highlighted part bolder.
     */
    function _calcItemsWidth(){
        if(!allVariants||!allVariants.length) return 420;
        var probe=document.createElement('span');
        var bf=getComputedStyle(document.body);
        probe.style.cssText='position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;font-size:12px;font-weight:600;font-family:'+bf.fontFamily+';';
        document.body.appendChild(probe);
        var maxW=0;
        for(var i=0;i<allVariants.length;i++){
            var nm=allVariants[i].display_name||allVariants[i].name||'';
            probe.textContent=nm;
            var w=probe.offsetWidth;
            if(w>maxW) maxW=w;
        }
        document.body.removeChild(probe);
        /* maxW (text) + img 32 + gap 10 + padding 10+10 + scrollbar ~14 + safety 8 */
        var needed=maxW+32+10+20+14+8;
        var max=window.innerWidth-32;
        return Math.max(420, Math.min(needed, max));
    }
    var popWidths={dates:240,cat:320,items:_calcItemsWidth};

    function openPop(th, buildFn){
        if(popOwner===th && pop.classList.contains('open')){ closePop(); return; }
        if(popOwner) popOwner.classList.remove('col-open');
        popOwner=th;
        pop.innerHTML='';
        buildFn();
        var resetBar=document.createElement('button'); resetBar.type='button';
        resetBar.textContent='Reset filter';
        resetBar.style.cssText='display:block;width:100%;padding:10px;border:none;border-bottom:1px solid #e5e7eb;background:none;color:#dc2626;font-size:13px;font-weight:500;cursor:pointer;text-align:left;';
        resetBar.addEventListener('click',function(){resetCol(th.dataset.col);closePop();});
        resetBar.addEventListener('mouseenter',function(){this.style.background='#fef2f2';});
        resetBar.addEventListener('mouseleave',function(){this.style.background='none';});
        pop.insertBefore(resetBar,pop.firstChild);
        pop.classList.add('open');
        var r=th.getBoundingClientRect();
        var pw=popWidths[th.dataset.col];
        if(typeof pw==='function') pw=pw();
        pw=pw||200;
        pop.style.width=pw+'px';
        pop.style.left=(window.clFlipLeft?window.clFlipLeft(r,pop.offsetWidth,8):(function(){var left=r.left;if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;return Math.max(8,left);})())+'px';
        pop.style.top=(window.clFlipTop?window.clFlipTop(r,pop.offsetHeight,0):(r.bottom))+'px';
        th.classList.add('col-open');
    }
    function closePop(){
        pop.classList.remove('open');
        if(popOwner){ popOwner.classList.remove('col-open'); popOwner=null; }
    }
    document.addEventListener('click',function(e){
        if(e.button!==0) return;
        if(!pop.contains(e.target)&&!e.target.closest('th[data-col]')) closePop();
    });
    function popHasFocus(){ return !!pop.querySelector('input:focus,textarea:focus'); }
    function onLeave(e){
        var to=e.relatedTarget;
        if(!to){ if(popHasFocus()) return; closePop(); return; }
        if(pop.contains(to)||to===pop) return;
        if(popOwner&&(popOwner===to||popOwner.contains(to))) return;
        closePop();
    }
    /* pop.addEventListener('mouseleave',onLeave); -- disabled: keep popup open on mouseleave */
    pop.addEventListener('wheel',function(e){
        var scrollable=e.target.closest('.fp-list,.cal-grid');
        if(scrollable&&scrollable.scrollHeight>scrollable.clientHeight){
            var atTop=scrollable.scrollTop<=0&&e.deltaY<0;
            var atBot=scrollable.scrollTop+scrollable.clientHeight>=scrollable.scrollHeight-1&&e.deltaY>0;
            if(!atTop&&!atBot) { e.stopPropagation(); return; }
        }
        e.preventDefault();
    },{passive:false});

    /* helpers */
    function popBody(){ var d=document.createElement('div'); d.className='fp-pop-body'; pop.appendChild(d); return d; }
    function sortRows(field,la,ld){
        [[la,'asc'],[ld,'desc']].forEach(function(p){
            var btn=document.createElement('button'); btn.type='button';
            btn.className='fp-sort-row'+(sortField===field&&sortDir===p[1]?' on':'');
            var sp=document.createElement('span'); sp.textContent=p[0];
            var arr=document.createElement('span'); arr.className='fp-sort-arr'; arr.textContent='›';
            btn.appendChild(sp); btn.appendChild(arr);
            btn.addEventListener('click',function(){
                sortField=field;sortDir=p[1];
                pop.querySelectorAll('.fp-sort-row').forEach(function(b){b.classList.remove('on');});
                btn.classList.add('on');
                updateTable();
            });
            pop.appendChild(btn);
        });
    }
    function radioList(cont,opts,getVal,setVal,onSelect){
        var grp='fp-rg-'+Date.now();
        opts.forEach(function(o){
            var row=document.createElement('div'); row.className='fp-item';
            var lbl=document.createElement('label'); lbl.style.cssText='display:inline-flex;align-items:center;gap:6px;cursor:pointer;';
            var rb=document.createElement('input'); rb.type='radio'; rb.name=grp; rb.value=o[0]; rb.checked=getVal()===o[0];
            rb.addEventListener('change',function(){ if(rb.checked){setVal(o[0]);updateTable();if(onSelect)onSelect();} });
            lbl.appendChild(rb); lbl.appendChild(document.createTextNode(o[1]));
            row.appendChild(lbl); cont.appendChild(row);
        });
    }
    function checkList(cont,items,selected,onToggle){
        if(items.length>6){
            var inp=document.createElement('input'); inp.type='text'; inp.className='fp-search'; inp.placeholder='Search...';
            inp.addEventListener('input',function(){renderList(inp.value);});
            cont.appendChild(inp);
        }
        var ld=document.createElement('div'); ld.className='fp-list'; cont.appendChild(ld);
        function renderList(q){
            ld.innerHTML='';
            var sh=q?items.filter(function(i){return i.toLowerCase().indexOf(q.toLowerCase())!==-1;}):items;
            sh.forEach(function(item){
                var row=document.createElement('div'); row.className='fp-item';
                var lbl=document.createElement('label'); lbl.style.cssText='display:inline-flex;align-items:center;gap:6px;cursor:pointer;';
                var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=selected.indexOf(item)!==-1;
                cb.addEventListener('change',function(){onToggle(item,cb.checked);updateTable();});
                lbl.appendChild(cb); lbl.appendChild(document.createTextNode(item));
                row.appendChild(lbl); ld.appendChild(row);
            });
        }
        renderList('');
    }
    function rangeRow(cont,minV,maxV,onMin,onMax,unit){
        var wrap=document.createElement('div'); wrap.className='fp-range';
        var i1=document.createElement('input'); i1.type='number'; i1.placeholder='from'; i1.value=minV!==null?minV:'';
        var sep=document.createElement('span'); sep.className='fp-range-sep'; sep.textContent='—';
        var i2=document.createElement('input'); i2.type='number'; i2.placeholder='to'; i2.value=maxV!==null?maxV:'';
        i1.addEventListener('input',function(){onMin(i1.value!==''?parseFloat(i1.value):null);updateTable();});
        i2.addEventListener('input',function(){onMax(i2.value!==''?parseFloat(i2.value):null);updateTable();});
        wrap.appendChild(i1); wrap.appendChild(sep); wrap.appendChild(i2);
        cont.appendChild(wrap);
    }

    /* ── Calendar ── */
    var CAL_MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
    var CAL_DOWS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    function calParseYMD(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
    function calToYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function calSameDay(a,b){ return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

    function buildCalPop(getMin,setMin,getMax,setMax){
        var selStart=calParseYMD(getMin()), selEnd=calParseYMD(getMax());
        var pickStep=(selStart&&!selEnd)?2:1;
        var hovDate=null;
        var now=new Date();
        var calYear=(selStart||now).getFullYear(), calMonth=(selStart||now).getMonth();
        var b=popBody(); b.style.padding='0';
        var nav=document.createElement('div'); nav.className='cal-nav';
        var prevBtn=document.createElement('button'); prevBtn.type='button'; prevBtn.className='cal-nav-btn'; prevBtn.innerHTML='<svg width="6" height="10" viewBox="0 0 6 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,1 1,5 5,9"/></svg>';
        var title=document.createElement('span'); title.className='cal-title';
        var nextBtn=document.createElement('button'); nextBtn.type='button'; nextBtn.className='cal-nav-btn'; nextBtn.innerHTML='<svg width="6" height="10" viewBox="0 0 6 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,1 5,5 1,9"/></svg>';
        nav.appendChild(prevBtn); nav.appendChild(title); nav.appendChild(nextBtn);
        b.appendChild(nav);
        var grid=document.createElement('div'); grid.className='cal-grid'; b.appendChild(grid);
        var calSep=document.createElement('div'); calSep.style.cssText='height:1px;background:#e5e7eb;margin:0;';
        b.appendChild(calSep);
        var resetBtn=document.createElement('button'); resetBtn.type='button'; resetBtn.className='cal-reset'; resetBtn.textContent='Reset';
        resetBtn.addEventListener('click',function(){ selStart=null; selEnd=null; pickStep=1; setMin(null); setMax(null); updateTable(); renderFull(); });
        b.appendChild(resetBtn);
        function effRange(){

    function buildCatPop(){
        var b=popBody();
        var catById={};
        catsTree.forEach(function(c){ catById[c.id]=c; });
        function catDepth(c){ var d=0,pid=c.parent_id; while(pid&&catById[pid]){d++;pid=catById[pid].parent_id;} return d; }
        var kidsByParent={};
        catsTree.forEach(function(c){
            if(c.parent_id){ (kidsByParent[c.parent_id]=kidsByParent[c.parent_id]||[]).push(c); }
        });
        function descendantsOf(c){
            var out=[]; var stack=(kidsByParent[c.id]||[]).slice();
            while(stack.length){ var n=stack.shift(); out.push(n); (kidsByParent[n.id]||[]).forEach(function(k){ stack.push(k); }); }
            return out;
        }
        /* Show only the categories actually present in at least one bundle.
           We pull up the ancestors — so the hierarchy does not break.
         */
        var usedNames={};
        (allData||[]).forEach(function(bn){
            (bn.categories||[]).forEach(function(c){ usedNames[c]=1; });
        });
        var usedIds={};
        catsTree.forEach(function(c){ if(usedNames[c.name]) usedIds[c.id]=1; });
        catsTree.forEach(function(c){
            if(!usedIds[c.id]) return;
            var pid=c.parent_id;
            while(pid && catById[pid]){
                if(usedIds[pid]) break;
                usedIds[pid]=1;
                pid=catById[pid].parent_id;
            }
        });
        var visibleTree=catsTree.filter(function(c){ return usedIds[c.id]; });
        var inp=document.createElement('input'); inp.type='text'; inp.className='fp-search'; inp.placeholder='Search...';
        var ld=document.createElement('div'); ld.className='fp-list'; ld.style.maxHeight='320px';
        b.appendChild(inp); b.appendChild(ld);
        function renderCatList(q){
            ld.innerHTML='';
            var shown=q?visibleTree.filter(function(c){return c.name.toLowerCase().indexOf(q.toLowerCase())!==-1;}):visibleTree;
            var parsed=shown.map(function(c){ return {c:c, depth: q?0:catDepth(c)}; });
            function isLastAtDepth(i,d){
                for(var j=i+1;j<parsed.length;j++){
                    if(parsed[j].depth<d) return true;
                    if(parsed[j].depth===d) return false;
                }
                return true;
            }
            /* LINE_OFFSET = visual center of the checkbox at depth 0.
               STEP = checkbox indent per level. The lines sit exactly under the checkboxes above.
             */
            var STEP=18, BASE_PAD=0, LINE_OFFSET=6;
            parsed.forEach(function(o,i){
                var c=o.c, depth=o.depth;
                var row=document.createElement('div'); row.className='fp-item';
                if(depth>0){
                    for(var lvl=1;lvl<depth;lvl++){
                        if(isLastAtDepth(i,lvl)) continue;
                        var v=document.createElement('span');
                        v.className='pick-vline';
                        v.style.left=(LINE_OFFSET+(lvl-1)*STEP)+'px';
                        row.appendChild(v);
                    }
                    var isFirst = (i===0 || parsed[i-1].depth<depth);
                    var isLast  = isLastAtDepth(i,depth);
                    var ownX    = LINE_OFFSET+(depth-1)*STEP;
                    if (isLast) {
                        var el=document.createElement('span');
                        el.className='pick-elbow';
                        el.style.left = ownX+'px';
                        el.style.top  = (isFirst ? '-10px' : '-5px');
                        el.style.height = isFirst ? 'calc(50% + 11px)' : 'calc(50% + 6px)';
                        el.style.width  = (STEP-6)+'px';
                        row.appendChild(el);
                    } else {
                        var v=document.createElement('span');
                        v.className='pick-vline';
                        v.style.left = ownX+'px';
                        if (isFirst) v.classList.add('is-first');
                        row.appendChild(v);
                        var hl=document.createElement('span');
                        hl.className='pick-hline';
                        hl.style.left=ownX+'px';
                        hl.style.width=(STEP-6)+'px';
                        row.appendChild(hl);
                    }
                    row.style.paddingLeft=(BASE_PAD+depth*STEP)+'px';
                }
                var lbl=document.createElement('label'); lbl.style.cssText='display:inline-flex;align-items:center;gap:6px;cursor:pointer;';
                var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=F.cats.indexOf(c.name)!==-1;
                cb.addEventListener('change',function(){
                    var names=[c.name].concat(descendantsOf(c).map(function(d){return d.name;}));
                    if(cb.checked){
                        names.forEach(function(n){ if(F.cats.indexOf(n)===-1) F.cats.push(n); });
                    } else {
                        F.cats=F.cats.filter(function(x){ return names.indexOf(x)===-1; });
                    }
                    renderCatList(inp.value);
                    updateTable();
                });
                lbl.appendChild(cb);
                lbl.appendChild(document.createTextNode(c.name));
                row.appendChild(lbl); ld.appendChild(row);
            });
        }
        inp.addEventListener('input',function(){renderCatList(inp.value);});
        renderCatList('');
    }

    /* Page boundaries. When grouping, we pack by whole groups: a page holds
       ~pageSize rows but does NOT split a group — the tail of a group doesn't go to the next
       page. A group larger than pageSize takes a whole page of its own.
     */
    function _pageBounds(){
        var data=currentFiltered||[];
        var n=data.length;
        if(pageSize===0 || n===0) return [{start:0,end:n}];
        if(!groupByBundle){
            var b=[];
            for(var s=0;s<n;s+=pageSize) b.push({start:s,end:Math.min(s+pageSize,n)});
            return b;

        var infos = [];

        });
        // Phase 2: READ — one reflow, read the sizes of all
        infos.forEach(function(info){
            info.cw = info.wrap.clientWidth;
            info.tw = info.tags.map(function(t){ return t.offsetWidth; });
        });
        // Phase 3: WRITE — adjust
        infos.forEach(function(info){
            var sum = 0, firstHidden = -1;
            for (var i = 0; i < info.tags.length; i++) {
                var addedW = (i===0 ? 0 : GAP) + info.tw[i];
                var remaining = info.tags.length - 1 - i;
                var need = sum + addedW + (remaining > 0 ? GAP + MORE_RESERVED : 0);
                if (need > info.cw) { firstHidden = i; break; }
                sum += addedW;
            }
            if (firstHidden === -1) return;
            for (var j = info.tags.length - 1; j >= firstHidden; j--) info.wrap.removeChild(info.tags[j]);
            if (firstHidden === 0) {
                info.wrap.appendChild(info.tags[0]);
                info.tags[0].style.overflow='hidden'; info.tags[0].style.textOverflow='ellipsis';
                info.tags[0].style.minWidth='0';
            }
            var hidden = info.allCats.slice(Math.max(firstHidden, 1) === firstHidden ? firstHidden : 1);
            if (firstHidden === 0) hidden = info.allCats.slice(1);
            var more = document.createElement('span'); more.className='pb-cat-more'; more.textContent='+' + hidden.length;
            info.wrap.appendChild(more);
            var pop = document.createElement('div'); pop.className='pb-cat-popover';
            hidden.forEach(function(c){
                var line = document.createElement('div'); line.className='pb-cat-line'; line.textContent=c;
                pop.appendChild(line);
            });
            document.body.appendChild(pop);
            more.addEventListener('mouseenter', function(){
                var r = more.getBoundingClientRect();
                pop.style.left = (window.clX ? window.clX(r.left) : r.left) + 'px';
                pop.style.top = (window.clFlipTop ? window.clFlipTop(r, pop.offsetHeight, 4) : (r.bottom + 4)) + 'px';
                pop.classList.add('open');
            });
            more.addEventListener('mouseleave', function(){ pop.classList.remove('open'); });
        });
    }

    /* Group header row: arrow + bundle name + counter toggle.
       Clicking the row collapses/expands it; clicking the counter shows all variants.
     */
    function buildGroupHeader(items,key,collapsed){
        var tr=document.createElement('tr');
        tr.className='pv-group-header group-start'+(collapsed?' pv-group-collapsed':'');
        var cbTd=document.createElement('td'); cbTd.className='col-cb';
        var nameTd=document.createElement('td'); nameTd.colSpan=12;
        var label=items[0].bundle_name||items[0].name||'—';
        var allActive=items.every(function(b){return !!b.is_active;});
        var someActive=items.some(function(b){return !!b.is_active;});
        nameTd.innerHTML='<div class="pv-group-name-inner">'+
            '<span class="pv-group-toggle">'+
            '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+
            '<span class="pv-group-title">'+esc(label)+'</span>'+
            /* Struck through only when ALL variants are hidden (partially hidden — normal). */
            '<span class="pv-group-count'+(someActive?'':' pv-group-count--off')+'" title="Click — show / hide all variants of the group">('+items.length+')</span>'+
        '</div>';
        var countEl=nameTd.querySelector('.pv-group-count');
        countEl.addEventListener('click',function(e){
            e.stopPropagation();
            var val=!allActive;
            items.forEach(function(b){
                b.is_active=val;
                saveField(b.id,'is_active',val,countEl);
            });
            renderRows(currentFiltered);
        });
        tr.appendChild(cbTd); tr.appendChild(nameTd);
        tr.addEventListener('click',function(e){
            if(e.target.closest('input,.pv-group-count')) return;
            if(collapsedGroups.has(key)) collapsedGroups.delete(key);
            else collapsedGroups.add(key);
            renderRows(currentFiltered);
        });
        return tr;
    }

    function renderRows(data){
        currentFiltered=data;
        _saveState();
        _renderResetBtn();
        var slice=_pageSlice();
        // remove ALL previously created floating popups (avoid DOMNodeRemoved)
        document.querySelectorAll('.pb-items-popover, .pb-cat-popover').forEach(function(p){ p.remove(); });
        var oldTbody=pbTable.querySelector('tbody'); if(oldTbody) oldTbody.remove();
        var tbody=document.createElement('tbody'), rowNum=1, prevBundleId=null;
        /* pinned: selected rows from other pages, rendered on top */
        var visibleIds={}; slice.forEach(function(b){visibleIds[String(b.variant_id)]=1;});
        var pinned=[];
        SEL.forEach(function(id){
            if(visibleIds[id]) return;
            for(var i=0;i<allData.length;i++){ if(String(allData[i].variant_id)===id){ pinned.push(allData[i]); break; } }
        });
        pinned.forEach(function(b,idx){
            var tr=buildRow(b,rowNum++,false,false,true);
            if(idx===0) tr.classList.add('pb-pinned-first');
            if(idx===pinned.length-1) tr.classList.add('pb-pinned-last');
            tbody.appendChild(tr);
        });
        rowNum=1;
        if(groupByBundle){
            /* Collect consecutive rows into groups by bundle_id. */
            var groups=[];
            slice.forEach(function(b){
                var last=groups[groups.length-1];
                if(last&&last.key===b.bundle_id) last.items.push(b);
                else groups.push({key:b.bundle_id,items:[b]});
            });
            groups.forEach(function(g,gi){
                var hasHeader=g.items.length>=2;
                var collapsed=hasHeader&&collapsedGroups.has(g.key);
                if(hasHeader) tbody.appendChild(buildGroupHeader(g.items,g.key,collapsed));
                g.items.forEach(function(b,idx){
                    var isGroupStart=!hasHeader&&gi>0&&idx===0;
                    var isContinuation=b.multi&&idx>0;
                    var row=buildRow(b,rowNum++,isGroupStart,isContinuation,false);
                    if(hasHeader) row.classList.add('pv-group-child');
                    if(collapsed) row.style.display='none';
                    tbody.appendChild(row);
                });
            });
        } else {
            slice.forEach(function(b){
                var isContinuation=(b.multi && prevBundleId===b.bundle_id);
                prevBundleId=b.bundle_id;
                tbody.appendChild(buildRow(b,rowNum++,false,isContinuation,false));
            });
        }
        if (slice.length === 0) {
            var emptyTr = document.createElement('tr');
            emptyTr.className = 'pb-empty-row';
            var emptyTd = document.createElement('td');
            emptyTd.colSpan = 13;
            emptyTd.style.cssText = 'height:56px;box-sizing:border-box;';
            emptyTd.textContent = 'No results';
            emptyTr.appendChild(emptyTd);
            tbody.appendChild(emptyTr);
        }
        pbTable.appendChild(tbody);
        _syncHiddenSel();
        _syncSelAll();
        renderPager();
        positionPager();
        if(window._updateCounter) window._updateCounter();
        // Trim categories to the column width: show as many as fit + "+N" (popover).
        fitCategories(pbTable);
    }

    /* Off-page persistence: keep hidden checked .pb-sel-cb inputs inside the
       table for selected ids not currently rendered, so the shared delete
       code in base_site.html (input[name=_selected_action]:checked) acts on
       the full cross-page selection. */
    function _syncHiddenSel(){
        var holder=pbTable.querySelector('#pb-sel-hidden');
        if(holder) holder.remove();
        holder=document.createElement('tbody');
        holder.id='pb-sel-hidden';
        holder.style.display='none';
        var visible={};
        pbTable.querySelectorAll('tbody:not(#pb-sel-hidden) .pb-sel-cb').forEach(function(cb){visible[cb.value]=1;});
        SEL.forEach(function(id){
            if(visible[id]) return;
            var inp=document.createElement('input');
            inp.type='checkbox'; inp.className='action-select pb-sel-cb'; inp.name='_selected_action';
            inp.value=id; inp.checked=true;
            holder.appendChild(inp);
        });
        pbTable.appendChild(holder);
    }

    /* Delegated change listener: keep SEL in sync with row checkboxes. */
    pbTable.addEventListener('change',function(e){
        var cb=e.target;
        if(!cb.classList||!cb.classList.contains('pb-sel-cb')) return;
        if(cb.parentNode&&cb.parentNode.id==='pb-sel-hidden') return;
        if(cb.checked) SEL.add(String(cb.value)); else SEL.delete(String(cb.value));
        renderRows(currentFiltered);
        if(window._updateCounter) window._updateCounter();
    });

    function init(data) {
        allData = data;
        /* Filter out ids from the restored selection that no longer exist in the data. */
        if (SEL.size) {
            var exists={}; allData.forEach(function(b){ exists[String(b.variant_id)]=1; });
            Array.from(SEL).forEach(function(id){ if(!exists[String(id)]) SEL.delete(id); });
        }
        var seen={};
        allData.forEach(function(b){
            (b.items_search||[]).forEach(function(i){
                var key=i.sku||i.name;
                if(key&&!seen[key]){seen[key]=1;allVariants.push(i);}
            });
        });
        allVariants.sort(function(a,b){return (a.display_name||a.name)<(b.display_name||b.name)?-1:1;});
        var loading = document.getElementById('pb-loading');
        if (loading) loading.style.display = 'none';
        updateTable({preservePage: true});
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', _renderResetBtn);
        } else {
            _renderResetBtn();
        }
        positionPager();
        window.addEventListener('resize',positionPager);
        // Re-trim categories on window resize (debounced).
        var _catResizeT;
        window.addEventListener('resize',function(){ clearTimeout(_catResizeT); _catResizeT=setTimeout(function(){ fitCategories(pbTable); },150); });
        if(window.ResizeObserver){
            var contentEl=document.querySelector('#content-main')||document.querySelector('.content')||document.body;
            new ResizeObserver(positionPager).observe(contentEl);
        }
        var navSidebar=document.getElementById('nav-sidebar');
        if(navSidebar) navSidebar.addEventListener('transitionend',positionPager);
    }

    /* Override the shared counter so it reports the full cross-page selection
       (SEL.size) out of the entire filtered dataset. */
    function _installCounter(){
        var counter=document.querySelector('.cl-counter');
        if(!counter) return;
        // "Clear selection" — clears the whole cross-page selection (including
        // other pages).
        if(!document.getElementById('cl-clear-sel')){
            var clearBtn=document.createElement('a');
            clearBtn.href='#'; clearBtn.id='cl-clear-sel'; clearBtn.className='cl-top-btn';
            clearBtn.textContent='Clear selection';
            clearBtn.style.marginLeft='10px';
            clearBtn.style.setProperty('display','none','important');
            clearBtn.addEventListener('click',function(e){
                e.preventDefault();
                // Remove only the selection from OTHER pages, keeping the current page's selection.
                var pageIds=new Set(_pageSlice().map(function(b){return String(b.variant_id);}));
                Array.from(SEL).forEach(function(id){ if(!pageIds.has(id)) SEL.delete(id); });
                renderRows(currentFiltered);
                if(window._updateCounter) window._updateCounter();
            });
            counter.insertAdjacentElement('afterend', clearBtn);
        }
        window._updateCounter=function(){
            var total = Math.max((currentFiltered && currentFiltered.length) || 0, SEL.size);
            counter.textContent='Selected: '+SEL.size+' of '+total;
            // "Clear selection" — only when there is a selection from OTHER pages
            // (outside the current one).
            // .cl-top-btn has display:inline-flex !important — hide it with !important too.
            var pageIds=_pageSlice().map(function(b){return String(b.variant_id);});
            var onPage=pageIds.filter(function(id){return SEL.has(id);}).length;
            var offPage=SEL.size-onPage;
            var cb=document.getElementById('cl-clear-sel');
            if(cb){ if(offPage>0) cb.style.removeProperty('display'); else cb.style.setProperty('display','none','important'); }
        };
        window._updateCounter();
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', _installCounter);
    } else {
        _installCounter();
    }

    fetch('/admin/catalog/bundles-data/')
        .then(function(r){ return r.json(); })
        .then(function(data){ init(data); })
        .catch(function(e){
            var loading = document.getElementById('pb-loading');
            if (loading) loading.textContent = 'Failed to load data';
        });

})();
</script>
{% endblock %}
