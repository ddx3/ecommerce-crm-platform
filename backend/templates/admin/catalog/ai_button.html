{% extends "admin/change_form.html" %}

{% block after_field_sets %}
{{ block.super }}
<style>
.ai-btn {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 7px;
    background: #fff;
    color: #6b7280;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    vertical-align: middle;
    letter-spacing: 0.5px;
}
.ai-btn:hover {
    background: #f3f4f6;
    border-color: #9ca3af;
    color: #374151;
}
.ai-notice {
    display: none;
    font-size: 11px;
    color: #9ca3af;
    margin-left: 8px;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const descLabel = document.querySelector('.field-description label');
    if (!descLabel) return;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ai-btn';
    btn.textContent = 'AI';
    btn.title = 'Improve text with AI (coming soon)';

    const notice = document.createElement('span');
    notice.className = 'ai-notice';
    notice.textContent = 'Coming soon...';

    btn.addEventListener('click', function() {
        notice.style.display = 'inline';
        setTimeout(() => { notice.style.display = 'none'; }, 2000);
    });

    descLabel.appendChild(btn);
    descLabel.appendChild(notice);
});
</script>
{% endblock %}
