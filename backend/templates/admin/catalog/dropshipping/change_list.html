{% extends "admin/change_list.html" %}
{% load i18n %}

{% block extrahead %}{{ block.super }}
<script>document.documentElement.classList.add('ds-loading');</script>
<style>
/* Hide the standard Django changelist + our content until JS builds the table + cl-bar. */
#result_list, .results, #toolbar, #changelist-form .actions, #changelist-search { display: none !important; }
html.ds-loading #content-main { visibility: hidden; }
</style>
<script>
/* After DOMContentLoaded (when base_site.html has already created .cl-bar) and one paint,
   clear the flag and the content appears all at once.
 */
document.addEventListener('DOMContentLoaded', function(){
  requestAnimationFrame(function(){
    document.documentElement.classList.remove('ds-loading');
  });
});
</script>
{% endblock %}

{% block object-tools %}
<ul class="object-tools">
  <li>
    <form method="post" action="import/" style="display:inline">
      {% csrf_token %}
      <button type="submit"
        style="height:28px;padding:0 14px;background:#1f2937;color:#fff;border:none;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer;">
        Import from bradas.ua
      </button>
    </form>
  </li>
</ul>
{% endblock %}

{% block result_list %}
{{ block.super }}
<style>
#result_list { display: none !important; }
#toolbar { display: none !important; }
.results { display: none !important; }

/* ── Table ── */
#ds-table { table-layout: fixed; width: 100%; border-collapse: collapse !important; border-top: none !important; }
#ds-table td, #ds-table th { border-top: none !important; }
#ds-table thead th { border-bottom: 1px solid #e5e7eb !important; }
#ds-table thead tr th {
    background: #f9fafb !important; border-bottom: 1px solid #e5e7eb !important;
    border-left: 1px solid #e5e7eb !important; padding: 10px 12px !important;
    font-size: 10px !important; font-weight: 700 !important; text-transform: uppercase !important;
    letter-spacing: 0.4px !important; color: #6b7280 !important; white-space: nowrap !important;
    vertical-align: middle !important; text-align: left !important;
}
#ds-table thead tr th:first-child { border-left: none !important; }
#ds-table thead tr th.col-cb { padding: 0 0 0 14px !important; width: 44px !important; }

th[data-col] { cursor: pointer !important; user-select: none !important; position: relative !important; }
#ds-table thead tr th[data-col] { padding-right: 26px !important; }
#ds-table thead tr th[data-col]:hover, #ds-table thead tr th[data-col].col-open { color: #1f2937 !important; }
#ds-table thead tr th[data-col].col-on { background: #d1d5db !important; color: #1f2937 !important; }
.th-badge { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; pointer-events: none; }

#ds-table tbody tr { border-bottom: 1px solid #e5e7eb !important; height: 56px; }
#ds-table.tbl-touches-pager tbody tr:last-child { border-bottom: none !important; }
#ds-table tbody tr.row1 { background: #fff !important; }
#ds-table tbody tr.row2 { background: #f9fafb !important; }
#ds-table tbody tr:hover { background: #eef0f3 !important; }
#ds-table tbody tr.ds-empty-row, #ds-table tbody tr.ds-empty-row:hover { background: #fff !important; cursor: default !important; border-bottom: 1px solid #e5e7eb !important; }
#ds-table tbody tr.ds-empty-row td { border-bottom: 1px solid #e5e7eb !important; vertical-align: middle !important; text-align: center !important; padding: 0 !important; color: #9ca3af !important; font-size: 13px !important; }
table.tbl-touches-pager tbody tr.ds-empty-row, table.tbl-touches-pager tbody tr.ds-empty-row td { border-bottom: 1px solid #e5e7eb !important; }
#ds-table tbody td, #ds-table tbody th {
    padding: 8px 12px !important; font-size: 13px !important; vertical-align: middle !important;
    border-left: 1px solid #e5e7eb !important; border-bottom: none !important;
    font-weight: 400 !important; color: #374151 !important; text-align: left !important;
    overflow: hidden !important; height: 56px !important; box-sizing: border-box !important;
}
#ds-table tbody td:first-child, #ds-table tbody th:first-child { border-left: none !important; }
#ds-table td, #ds-table th { white-space: nowrap; }
#ds-table .col-name { min-width: 0; }
/* Name - up to 3 lines; the cell grows with its content (the row is taller if needed). */
/* width:fit-content - the span is as wide as the text (not the whole cell), so the hover underline
   (.copy-on-click) appears only on the text itself, not across the whole cell.
 */
#ds-table .col-name a, #ds-table .col-name .col-name-val { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; word-break: break-word; line-height: 1.35; width: fit-content; max-width: 100%; }
#ds-table tbody th.col-name { height: auto !important; overflow: visible !important; }
#ds-table .col-cb { width: 44px !important; min-width: 44px !important; max-width: 44px !important; padding: 0 0 0 14px !important; }
#ds-table .col-active { padding: 6px 12px !important; }
#ds-table .col-cat { min-width: 0; }
#ds-table .col-cat .cat-wrap { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; max-height: 38px; white-space: normal; }
/* Dates column — as wide as the dates themselves (does not stretch). */
#ds-table .col-dates { width: 1%; white-space: nowrap; }
#ds-table .col-labels { min-width: 110px; max-width: 200px; }
#ds-table .col-labels .app-label { margin: 1px 2px 1px 0; }
.pv-cat-tag { display: inline-block; font-size: 13px; background: transparent; border: 1px solid #e5e7eb; border-radius: 3px; padding: 1px 5px; margin: 1px 1px 0 0; color: #6b7280; white-space: nowrap; cursor: default; }
.pv-active-cb { cursor: pointer; width: 16px; height: 16px; accent-color: #374151; }

/* Lightbox */
#pv-lightbox { display: none; position: fixed; inset: 0; z-index: 999999; background: rgba(0,0,0,0.82); align-items: center; justify-content: center; cursor: zoom-out; }
#pv-lightbox.open { display: flex; }
#pv-lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }

/* Photos */
#ds-table .col-photos { width: 1%; }
#ds-table thead tr th[data-col="photos"] { padding-right: 12px !important; }

/* ── Column widths (table-layout:fixed) - px via JS (Safari-safe, no calc%) ── */
#ds-table thead th[data-col="photos"]    { width: var(--dw-photos, 70px) !important; }
#ds-table thead th[data-col="sku"]       { width: var(--dw-sku, 90px) !important; }
#ds-table thead th[data-col="dates"]     { width: var(--dw-dates, 175px) !important; }
#ds-table thead th[data-col="is_active"] { width: var(--dw-active, 76px) !important; }
#ds-table thead th[data-col="price"]     { width: var(--dw-price, 90px) !important; }
#ds-table thead th[data-col="stock"]     { width: var(--dw-stock, 90px) !important; }
#ds-table thead th[data-col="labels"]    { width: var(--dw-labels, 130px) !important; }
#ds-table td.col-dates > div > div { white-space: nowrap !important; }
/* Name + Category - flexible (name 2/3, category 1/3), JS computes px. */
#ds-table thead th[data-col="cat"]  { width: var(--dw-cat, 200px) !important; }
#ds-table thead th[data-col="name"] { width: var(--dw-name, 300px) !important; }
/* Compact (narrow screen): only 1 photo. */
#ds-table.ds-compact td.col-photos .pv-photo-wrap:not(:first-child) { display: none !important; }
/* Hiding secondary columns on narrow screens (class set by JS): date → labels. */
#ds-table.ds-hide-dates  th[data-col="dates"],  #ds-table.ds-hide-dates  td.col-dates  { display: none !important; }
#ds-table.ds-hide-labels th[data-col="labels"], #ds-table.ds-hide-labels td.col-labels { display: none !important; }
.pv-photos { display: flex; gap: 3px; }
.pv-photo-wrap { position: relative; display: inline-block; flex-shrink: 0; }
.pv-photo-wrap img.pv-thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 4px; border: 1px solid #d1d5db; background: #f3f4f6; display: block; transition: filter .15s; }
.pv-photo-wrap:hover img.pv-thumb { filter: brightness(0.82); }
/* .pv-photo-preview — styles moved to base_site.html */

/* ── Popover ── */
#flt-pop {
    display: none; position: fixed; z-index: 9999; background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 0 0 6px 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,.18);
    overflow: hidden;
    width: 200px;
}
#flt-pop.open { display: block; }

.fp-sort-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; border-bottom: 1px solid #ececec;
    background: #fff; color: #374151; font-size: 13px;
    cursor: pointer; width: 100%; text-align: left;
    border-left: none; border-right: none; border-top: none;
}
.fp-sort-row:last-of-type { border-bottom: 1px solid #e5e7eb; }
.fp-sort-row:hover { background: #f5f5f5; }
.fp-sort-row.on { background: #e5e7eb; color: #374151; }
.fp-sort-arr { color: #d1d5db; font-size: 18px; line-height: 1; flex-shrink: 0; display: inline-flex; align-items: center; }
.fp-sort-row.on .fp-sort-arr { color: #374151; }

.fp-pop-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.fp-filter-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: #9ca3af; margin-bottom: 6px; }
.fp-pills { display: flex; gap: 3px; flex-wrap: wrap; }
.fp-pill { padding: 3px 8px; border: 1px solid #d1d5db; border-radius: 20px; font-size: 11px; color: #6b7280; cursor: pointer; background: #fff; user-select: none; }
.fp-pill:hover { background: #f9fafb; color: #374151; }
.fp-pill.on { background: #1f2937; border-color: #1f2937; color: #fff; }
.fp-search { width: 100%; box-sizing: border-box; height: 28px; padding: 0 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; outline: none; margin-bottom: 0; }
.fp-search:focus { border-color: #9ca3af; }
.fp-list { display: flex; flex-direction: column; gap: 10px; max-height: 140px; overflow-y: auto; margin: 0 -10px -10px -10px; padding: 10px; border-radius: 0 0 6px 6px; border-top: 1px solid #e5e7eb; }
.fp-pop-body > .fp-list:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.fp-item { display: flex; align-items: center; gap: 6px; padding: 0; font-size: 13px; line-height: 1; color: #374151; border-radius: 3px; position: relative; }
/* 2px lines, same color as the checkbox (#d1d5db). */
.fp-item .pick-vline { position: absolute; top: -5px; bottom: -5px; width: 2px; background: #d1d5db; pointer-events: none; z-index: 0; }
.fp-item .pick-vline.is-first { top: -10px; }
.fp-item .pick-vline.is-last  { bottom: 50%; }
.fp-item .pick-hline { position: absolute; top: 50%; height: 2px; background: #d1d5db; pointer-events: none; z-index: 0; transform: translateY(-1px); }
.fp-item .pick-elbow {
    position: absolute;
    border-left: 2px solid #d1d5db;
    border-bottom: 2px solid #d1d5db;
    border-bottom-left-radius: 5px;
    pointer-events: none; z-index: 0;
}
.fp-item > label { position: relative; z-index: 1; }
.fp-item input[type=checkbox],
.fp-item input[type=radio] {
    appearance: none; -webkit-appearance: none;
    width: 14px; height: 14px; flex-shrink: 0;
    border: 1.5px solid #d1d5db;
    background: #fff; cursor: pointer; position: relative;
    margin: 0;
    transition: background .12s, border-color .12s;
}
.fp-item input[type=checkbox] { border-radius: 3px; }
.fp-item input[type=radio]    { border-radius: 50%; }
.fp-item input[type=checkbox]:hover,
.fp-item input[type=radio]:hover { border-color: #9ca3af; }
.fp-item input[type=checkbox]:checked,
.fp-item input[type=radio]:checked { background: #1f2937; border-color: #1f2937; }
.fp-item input[type=checkbox]:checked::after,
.fp-item input[type=radio]:checked::after {
    content: ''; position: absolute;
    left: 3px; top: 0px; width: 4px; height: 8px;
    border: 1.5px solid #fff; border-top: none; border-left: none;
    transform: rotate(45deg);
}
.fp-range { display: flex; align-items: center; gap: 4px; }
.fp-pop-body:has(> .fp-range:last-child) { padding-bottom: 8px; }
.fp-range input { flex: 1; min-width: 0; width: 0; height: 28px; padding: 0 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; outline: none; box-sizing: border-box; }
.fp-range input:focus { border-color: #9ca3af; }
.fp-range-sep { font-size: 0; color: transparent; width: 8px; height: 1px; background: #9ca3af; align-self: center; flex-shrink: 0; margin-top: -1px; }
.fp-divider { height: 1px; background: #e5e7eb; margin: 8px 0; }
.fp-clear { display: block; margin-top: 8px; padding: 0; border: none; background: none; font-size: 11px; color: #9ca3af; cursor: pointer; text-align: left; }
.fp-clear:hover { color: #dc2626; }

/* ── Calendar ── */
.cal-nav { display:flex; align-items:center; justify-content:space-between; padding:8px 10px 4px; }
.cal-nav-btn { background:#f9fafb; border:1px solid #d1d5db; border-radius:4px; width:26px; height:26px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:#374151; font-size:16px; line-height:1; padding:0; flex-shrink:0; transition:background .1s,border-color .1s; }
.cal-nav-btn:hover { background:#e5e7eb; border-color:#9ca3af; color:#111; }
.cal-nav-btn:active { background:#d1d5db; }
.cal-title { font-size:12px; font-weight:600; color:#374151; text-align:center; flex:1; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); padding:0 6px 0; }
.cal-dow { font-size:10px; color:#9ca3af; text-align:center; padding:2px 0 5px; font-weight:600; }
.cal-day { font-size:12px; text-align:center; padding:5px 0; cursor:pointer; color:#374151; user-select:none; border-radius:4px; transition:background .1s; }
.cal-day.empty { cursor:default; pointer-events:none; }
.cal-day:not(.empty):not(.sel-start):not(.sel-end):hover { background:#d1d5db; }
.cal-day.today { font-weight:700; color:#111; }
.cal-day.sel-start, .cal-day.sel-end { background:#1f2937; color:#fff; border-radius:4px; }
.cal-day.sel-start:hover, .cal-day.sel-end:hover { background:#374151; }
.cal-day.in-range { background:#e5e7eb; border-radius:0; }
.cal-day.in-range:hover { background:#d1d5db; }
.cal-day.sel-start.has-range { border-radius:4px 0 0 4px; }
.cal-day.sel-end.has-range   { border-radius:0 4px 4px 0; }
.cal-reset { display:block; text-align:center; padding:0 10px 10px; font-size:11px; color:#9ca3af; cursor:pointer; background:none; border:none; width:100%; }
.cal-reset:hover { color:#dc2626; }

/* ── Pager ── */
#ds-pager {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 10px 16px; font-size: 13px; color: #6b7280;
    border-top: 1px solid #e5e7eb;
    position: fixed; bottom: 0; right: 0;
    background: #fff; z-index: 1000;
}
#ds-pager .pager-info { font-size: 12px; color: #9ca3af; }
#ds-pager .pager-nav { display: flex; align-items: center; gap: 4px; justify-self: center; }
#ds-pager .pg-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0; border: 1px solid #d1d5db;
    border-radius: 4px; background: #fff; color: #374151;
    font-size: 13px; cursor: pointer; line-height: 1;
    user-select: none; text-decoration: none !important; box-sizing: border-box; flex-shrink: 0;
}
#ds-pager .pg-btn:hover { background: #f3f4f6; border-color: #d1d5db; }
#ds-pager .pg-btn.pg-active { background: #1f2937; color: #fff; border-color: #1f2937; }
#ds-pager .pg-btn.pg-disabled { opacity: 0.35; pointer-events: none; }
#ds-pager .pg-btn.pg-arrow { color: #6b7280; }
#ds-pager .pager-nav .pg-dots { padding: 0 2px; color: #9ca3af; font-size: 12px; line-height: 28px; }
#ds-pager .pager-right { display: flex; align-items: center; gap: 0; justify-self: end; }
#ds-pager .pager-size { display: flex; align-items: center; gap: 4px; font-size: 12px; }
#ds-pager .pager-size > span:first-child { color: #9ca3af; }
#ds-pager .pager-size .pg-btn { width: auto; min-width: 36px; padding: 0 8px; }
#ds-pager .pager-group { margin-left: 12px; padding-left: 12px; border-left: 1px solid #e5e7eb; }
#ds-pager .pager-group .pg-btn { width: auto; padding: 0 10px; }
#ds-table tbody tr.ds-pinned, #ds-table tbody tr.ds-pinned:hover { background: #eff6ff !important; }
#ds-table tbody tr.ds-pinned-first td, #ds-table tbody tr.ds-pinned-first th { border-top: 2px solid #d1d5db !important; }
#ds-table tbody tr.ds-pinned-last td, #ds-table tbody tr.ds-pinned-last th { border-bottom: 2px solid #d1d5db !important; }
#content-main, #content { padding-bottom: 0 !important; }

/* ── Group header row (group with ≥2 variants) ── */
/* Variants of a grouped product (≥2) - gray stripe on the left (the photo isn't shifted).
   We don't touch the header row, only remove the bold outline above it.
 */
#ds-table tbody tr.pv-group-header td, #ds-table tbody tr.pv-group-header th { border-top: none !important; }
#ds-table tbody tr.pv-group-child > td:first-child,
#ds-table tbody tr.pv-group-child > th:first-child { box-shadow: inset 3px 0 0 #9ca3af; }

#ds-table tbody tr.pv-group-header,
#ds-table tbody tr.pv-group-header:hover { background: #f3f4f6 !important; cursor: pointer !important; height: 30px !important; }
#ds-table tbody tr.pv-group-header:hover { background: #eceef1 !important; }
#ds-table tbody tr.pv-group-header td {
    height: 30px !important; padding: 4px 12px !important;
    border-bottom: 1px solid #e5e7eb !important; vertical-align: middle !important;
}
#ds-table tbody tr.pv-group-header td.col-cb { padding: 0 0 0 14px !important; }
#ds-table tbody tr.pv-group-collapsed .pv-group-toggle { transform: rotate(-90deg); }
.pv-group-name-inner { display: flex; align-items: center; min-width: 0; }
.pv-group-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    margin-right: 8px; flex-shrink: 0; transition: transform .12s;
}
.pv-group-toggle svg { display: block; }
.pv-group-title {
    font-weight: 600; font-size: 13px; color: #1f2937;
    flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* The counter = "Display" toggle: a click enables/disables is_active for all variants. */
.pv-group-count {
    flex-shrink: 0; margin-left: 6px; color: #9ca3af; font-size: 13px; font-weight: 500;
    cursor: pointer; user-select: none;
}
.pv-group-count:hover { color: #4b5563; }
.pv-group-count.pv-group-count--off { color: #9ca3af; text-decoration: line-through; }
.pv-group-count.pv-group-count--off:hover { color: #6b7280; }
</style>

<div id="flt-pop"></div>

<script>
(function() {
    var allData = {{ ds_variants_json|safe }};
    var catsTree = {{ ds_cats_tree_json|safe }};
    var allLabels = {{ ds_labels_json|safe }};

    var F = {nameQ:'',skuQ:'',photos:'all',cats:[],labels:[],priceMin:null,priceMax:null,stockOnly:false,stockNone:false,stockMode:'all',stockMin:null,stockMax:null,dateMin:null,dateMax:null,dateMinU:null,dateMaxU:null,status:'all',kinds:[]};
    function toCmpDate(str){ var m=str&&str.match(/^(\d{2})\.(\d{2})\.(\d{4})/); return m?m[3]+'-'+m[2]+'-'+m[1]:null; }
    var sortField=null, sortDir='asc';
    var currentPage=1, pageSize=25, currentFiltered=[];
    var groupByProduct=false;
    /* Collapsed groups (keys = product_id) - variant rows are hidden. */
    var collapsedGroups=new Set();
    /* Persistent selection across client-side pagination (row ids as strings). */
    var SEL = new Set();

    /* ── Persist filter / sort / pagination state across page loads ──
       Lives in localStorage so when the user returns from a product change-form
       (Save / Exit / browser-back), the same view is restored.
     */
    var STATE_KEY = 'dropshipping_list_state_v1';
    function _saveState(){
        try {
            localStorage.setItem(STATE_KEY, JSON.stringify({
                F: F, sortField: sortField, sortDir: sortDir,
                groupByProduct: groupByProduct,
                collapsedGroups: Array.from(collapsedGroups),
                currentPage: currentPage, pageSize: pageSize, SEL: Array.from(SEL),
            }));
        } catch (e) {}
    }
    function _loadState(){
        try {
            var raw = localStorage.getItem(STATE_KEY);
            if (!raw) return;
            var s = JSON.parse(raw);
            if (s.F) Object.assign(F, s.F);
            if (typeof s.sortField    !== 'undefined') sortField    = s.sortField;
            if (typeof s.sortDir      !== 'undefined') sortDir      = s.sortDir;
            if (typeof s.groupByProduct !== 'undefined') groupByProduct = !!s.groupByProduct;
            if (Array.isArray(s.collapsedGroups)) collapsedGroups = new Set(s.collapsedGroups);
            if (typeof s.currentPage  !== 'undefined') currentPage  = s.currentPage;
            if (typeof s.pageSize     !== 'undefined') pageSize     = s.pageSize;
            /* Restore the cross-page selection, dropping ids that are no longer in the data. */
            if (Array.isArray(s.SEL)) {
                var exists={}; allData.forEach(function(v){ exists[String(v.id)]=1; });
                s.SEL.forEach(function(id){ if(exists[String(id)]) SEL.add(String(id)); });
            }
        } catch (e) {}
    }
    _loadState();

    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function getCsrf(){var el=document.querySelector('[name=csrfmiddlewaretoken]');return el?el.value:'';}

    function expandCats(names){
        var nameSet={}, idSet={};
        names.forEach(function(n){ nameSet[n]=1; });
        catsTree.forEach(function(c){ if(nameSet[c.name]) idSet[c.id]=1; });
        var changed=true;
        while(changed){
            changed=false;
            catsTree.forEach(function(c){

    function applyFilters(data){

            if(F.skuQ  && (v.sku||'').indexOf(F.skuQ)===-1) return false;
            if(F.photos==='with'    && !(v.photos&&v.photos.length)) return false;
            if(F.photos==='without' &&  (v.photos&&v.photos.length)) return false;
            if(F.cats.length && !(v.categories||[]).some(function(c){return expandedCats.indexOf(c)!==-1;})) return false;
            if(F.labels.length && !(v.labels||[]).some(function(l){return F.labels.indexOf(l.name)!==-1;})) return false;
            var price=parseFloat(v.price)||0;
            if(F.priceMin!==null && price<F.priceMin) return false;
            if(F.priceMax!==null && price>F.priceMax) return false;
            var stock=v.stock!=null?parseInt(v.stock):0;
            if(F.stockOnly && stock<=0) return false;
            if(F.stockNone && stock>0) return false;
            if(F.stockMode==='manual' && !v.stock_manual) return false;
            if(F.stockMode==='auto'   &&  v.stock_manual) return false;
            if(F.stockMin!==null && stock<F.stockMin) return false;
            if(F.stockMax!==null && stock>F.stockMax) return false;
            if(F.dateMin||F.dateMax){ var cd=toCmpDate(v.created_at); if(F.dateMin&&(!cd||cd<F.dateMin)) return false; if(F.dateMax&&(!cd||cd>F.dateMax)) return false; }
            if(F.dateMinU||F.dateMaxU){ var cu=toCmpDate(v.updated_at); if(F.dateMinU&&(!cu||cu<F.dateMinU)) return false; if(F.dateMaxU&&(!cu||cu>F.dateMaxU)) return false; }
            if(F.status==='active' && !v.is_active) return false;
            if(F.status==='hidden' &&  v.is_active) return false;
            if(F.kinds.length){
                var kOk = (F.kinds.indexOf('drop')!==-1 && v.is_dropshipping)
                       || (F.kinds.indexOf('hybrid')!==-1 && v.is_hybrid);

    function applySort(data){

    function calParseYMD(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
    function calToYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function calSameDay(a,b){ return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

    function buildCalPop(getMin, setMin, getMax, setMax){
        var selStart=calParseYMD(getMin()), selEnd=calParseYMD(getMax());
        var pickStep=(selStart&&!selEnd)?2:1;
        var hovDate=null;

        b.appendChild(calSep);
        var resetBtn=document.createElement('button'); resetBtn.type='button'; resetBtn.className='cal-reset'; resetBtn.textContent='Reset';
        resetBtn.addEventListener('click',function(){ selStart=null; selEnd=null; pickStep=1; setMin(null); setMax(null); updateTable(); renderFull(); });
        b.appendChild(resetBtn);
        function effRange(){
            if(pickStep===2&&hovDate&&selStart) return hovDate<selStart?{s:hovDate,e:selStart}:{s:selStart,e:hovDate};
            return {s:selStart,e:selEnd};
        }
        function applyClasses(){
            var r=effRange(), today=new Date();
            grid.querySelectorAll('.cal-day[data-d]').forEach(function(cell){
                var d=calParseYMD(cell.dataset.d);
                var isS=calSameDay(d,r.s), isE=calSameDay(d,r.e);
                var inR=r.s&&r.e&&d>r.s&&d<r.e;
                cell.className='cal-day';
                if(isS) cell.classList.add('sel-start');
                if(isE) cell.classList.add('sel-end');
                if(r.s&&r.e&&!calSameDay(r.s,r.e)&&(isS||isE)) cell.classList.add('has-range');
                if(inR) cell.classList.add('in-range');
                if(calSameDay(d,today)) cell.classList.add('today');

        function renderFull(){
            title.textContent=CAL_MONTHS[calMonth]+' '+calYear;
            grid.innerHTML='';
            CAL_DOWS.forEach(function(d){ var c=document.createElement('div'); c.className='cal-dow'; c.textContent=d; grid.appendChild(c); });
            var firstDay=(new Date(calYear,calMonth,1).getDay()+6)%7;

            for(var i=0;i<firstDay;i++){ var e=document.createElement('div'); e.className='cal-day empty'; grid.appendChild(e); }

                    applyClasses();
                });
                cell.addEventListener('mouseenter',function(){ hovDate=calParseYMD(this.dataset.d); applyClasses(); });
                cell.addEventListener('mouseleave',function(){ hovDate=null; applyClasses(); });
                grid.appendChild(cell);
            }
            applyClasses();
        }
        prevBtn.addEventListener('click',function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderFull(); });
        nextBtn.addEventListener('click',function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderFull(); });
        renderFull();
    }

    function buildCatPop(){
        var b=popBody();

        function catDepth(c){ var d=0,pid=c.parent_id; while(pid&&catById[pid]){d++;pid=catById[pid].parent_id;} return d; }
        var kidsByParent={};
        catsTree.forEach(function(c){
            if(c.parent_id){ (kidsByParent[c.parent_id]=kidsByParent[c.parent_id]||[]).push(c); }
        });
        function descendantsOf(c){
            var out=[]; var stack=(kidsByParent[c.id]||[]).slice();
            while(stack.length){ var n=stack.shift(); out.push(n); (kidsByParent[n.id]||[]).forEach(function(k){ stack.push(k); }); }
            return out;
        }
        /* Show only categories actually present in at least one dropshipping variant.
           We promote ancestors so the hierarchy doesn't break.
         */
        var usedNames={};

            (v.categories||[]).forEach(function(c){ usedNames[c]=1; });
        });

        catsTree.forEach(function(c){
            if(!usedIds[c.id]) return;
            var pid=c.parent_id;
            while(pid && catById[pid]){
                if(usedIds[pid]) break;
                usedIds[pid]=1;
                pid=catById[pid].parent_id;
            }
        });

    /* Page boundaries. When grouping, we pack by whole groups: a page holds
       ~pageSize rows but does NOT split a group — the tail of a group doesn't go to the next
       page. A group larger than pageSize takes a whole page of its own.
     */
    function _pageBounds(){
        var data=currentFiltered||[];
        var n=data.length;
        if(pageSize===0 || n===0) return [{start:0,end:n}];
        if(!groupByProduct){
            var b=[];
            for(var s=0;s<n;s+=pageSize) b.push({start:s,end:Math.min(s+pageSize,n)});
            return b;
        }
        var bounds=[], pageStart=0, count=0, i=0;
        while(i<n){
            var key=_grpKey(data[i]), j=i;
            while(j<n && _grpKey(data[j])===key) j++;
            var groupLen=j-i;
            if(count>0 && count+groupLen>pageSize){ bounds.push({start:pageStart,end:i}); pageStart=i; count=0; }
            count+=groupLen; i=j;
        }
        bounds.push({start:pageStart,end:n});
        return bounds;
    }
    function _pageSlice(){
        var data=currentFiltered||[];
        if(pageSize===0) return data;

        if(currentPage>b.length) currentPage=b.length;

        return data.slice(pg.start,pg.end);
    }

            '<span class="pv-group-toggle">'+
            '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+
            '<span class="pv-group-title">'+esc(label)+'</span>'+
            /* Struck through only when ALL variants are hidden (partially hidden — normal). */
            '<span class="pv-group-count'+(someActive?'':' pv-group-count--off')+'" title="Click — show / hide all variants of the group">('+items.length+')</span>'+
        '</div>';
        var countEl=nameTd.querySelector('.pv-group-count');
        countEl.addEventListener('click',function(e){
            e.stopPropagation();
            var val=!allActive;
            items.forEach(function(v){
                v.is_active=val;
                saveField(v.id,'is_active',val,countEl);
            });
            renderRows(currentFiltered);
        });
        tr.appendChild(cbTd); tr.appendChild(nameTd);
        tr.addEventListener('click',function(e){
            if(e.target.closest('input,.pv-group-count')) return;
            if(collapsedGroups.has(key)) collapsedGroups.delete(key);
            else collapsedGroups.add(key);
            renderRows(currentFiltered);
        });
        return tr;
    }

    function renderRows(data){
        currentFiltered=data;
        _saveState();  // remember filters/sort/page for next visit
        _renderResetBtn();
        var slice=_pageSlice();
        var oldTbody=dsTable.querySelector('tbody'); if(oldTbody) oldTbody.remove();
        var tbody=document.createElement('tbody'), rowNum=1;
        /* pinned: selected rows from other pages, rendered on top */
        var visibleIds={}; slice.forEach(function(v){visibleIds[String(v.id)]=1;});
        var pinned=[];
        SEL.forEach(function(id){
            if(visibleIds[id]) return;
            for(var i=0;i<allData.length;i++){ if(String(allData[i].id)===id){ pinned.push(allData[i]); break; } }
        });
        pinned.forEach(function(v,idx){
            var tr=buildRow(v,rowNum++,false,true);
            if(idx===0) tr.classList.add('ds-pinned-first');
            if(idx===pinned.length-1) tr.classList.add('ds-pinned-last');
            tbody.appendChild(tr);
        });
        rowNum=1;
        if(groupByProduct){
            /* Collect consecutive rows into groups by product_id. */
            var groups=[];
            slice.forEach(function(v){
                var last=groups[groups.length-1];
                if(last&&last.key===v.product_id) last.items.push(v);
                else groups.push({key:v.product_id,items:[v]});
            });
            groups.forEach(function(g,gi){
                if(g.items.length>=2){
                    var collapsed=collapsedGroups.has(g.key);
                    tbody.appendChild(buildGroupHeader(g.items,g.key,collapsed));
                    g.items.forEach(function(v){
                        var row=buildRow(v,rowNum++,false,false);
                        row.classList.add('pv-group-child');
                        if(collapsed) row.style.display='none';
                        tbody.appendChild(row);
                    });
                } else {
                    g.items.forEach(function(v){ tbody.appendChild(buildRow(v,rowNum++,gi>0,false)); });
                }
            });
        } else {
            slice.forEach(function(v){ tbody.appendChild(buildRow(v,rowNum++,false,false)); });
        }
        if (slice.length === 0) {
            var emptyTr = document.createElement('tr');
            emptyTr.className = 'ds-empty-row';
            var emptyTd = document.createElement('td');
            emptyTd.colSpan = 10;
            emptyTd.style.cssText = 'height:56px;box-sizing:border-box;';
            emptyTd.textContent = 'No results';
            emptyTr.appendChild(emptyTd);
            tbody.appendChild(emptyTr);
        }
        dsTable.appendChild(tbody);
        _syncSelAll();
        renderPager();
        positionPager();
        if(window._updateCounter) window._updateCounter();
    }

    function buildRow(v,rowNum,isGroupStart,pinned){
        {
            var tr=document.createElement('tr');
            tr.className=(rowNum%2===0?'row2':'row1')+(isGroupStart?' group-start':'')+(pinned?' ds-pinned':'');
            tr.style.cursor='pointer';
            // Anchor #v<variant_id> tells the product change_form's JS to
            // activate the tab for *this* variant (not the first one).
            var editUrl=(v.is_hybrid && !v.is_dropshipping)
                ? '/admin/catalog/product/'+v.product_id+'/change/#v'+v.id
                : '/admin/catalog/dropshippingproduct/'+v.product_id+'/change/#v'+v.id;

            /* checkbox */
            var cbTd=document.createElement('td'); cbTd.className='col-cb action-checkbox';
            cbTd.innerHTML='<input type="checkbox" class="ds-cb" value="'+v.id+'">';
            cbTd.querySelector('.ds-cb').checked=SEL.has(String(v.id));

            /* photos */
            var photosTd=document.createElement('td'); photosTd.className='col-photos';
            if(v.photos&&v.photos.length){
                var photosDiv=document.createElement('div'); photosDiv.className='pv-photos';
                v.photos.forEach(function(url){
                    var wrap=document.createElement('div'); wrap.className='pv-photo-wrap';
                    var thumb=document.createElement('img'); thumb.className='pv-thumb'; thumb.src=url; thumb.onerror=function(){wrap.style.display='none';};
                    var preview=document.createElement('div'); preview.className='pv-photo-preview';
                    var pi=document.createElement('img'); pi.src=url; preview.appendChild(pi);
                    wrap.appendChild(thumb); wrap.appendChild(preview);
                    wrap.addEventListener('mouseenter',function(){var r=wrap.getBoundingClientRect();preview.style.left=(window.clX?window.clX(r.left):r.left)+'px';preview.style.top=(window.clFlipTop?window.clFlipTop(r,preview.offsetHeight,6):(r.bottom+6))+'px';});
                    wrap.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();lightboxImg.src=url;lightbox.classList.add('open');});
                    photosDiv.appendChild(wrap);
                });
                photosTd.appendChild(photosDiv);
            } else {photosTd.textContent='—';photosTd.style.color='#9ca3af';}

            /* sku */
            var skuTd=document.createElement('td'); skuTd.className='col-sku';
            skuTd.innerHTML = v.sku
                ? '<span class="copy-on-click" data-copy="'+esc(v.sku)+'" title="Copy SKU" style="color:#9ca3af;font-size:12px">'+esc(v.sku)+'</span>'
                : '<span style="color:#9ca3af;font-size:12px">—</span>';

            /* name */
            var nameTh=document.createElement('th'); nameTh.className='col-name';
            nameTh.innerHTML='<span class="col-name-val copy-on-click" data-copy="'+esc(v.name||'')+'" title="Copy" style="color:#374151;">'+esc(v.name||'—')+'</span>';

            /* price */
            var priceTd=document.createElement('td'); priceTd.className='col-price';
            priceTd.textContent=v.price?v.price:'—';
            if(!v.price) priceTd.style.color='#9ca3af';

            /* is_active */
            var activeTd=document.createElement('td'); activeTd.className='col-active';
            var activeCb=document.createElement('input'); activeCb.type='checkbox'; activeCb.className='pv-active-cb'; activeCb.checked=!!v.is_active;
            activeCb.addEventListener('change',function(e){
                e.stopPropagation();
                v.is_active=activeCb.checked;
                saveField(v.id,'is_active',activeCb.checked,activeCb).then(function(){
                    /* If a status filter or status sort is active, redraw the current page so the
                       row
                       immediately disappears/moves according to the filter.
                       We do NOT reset currentPage: re-apply filter + sort.
                     */
                    if(isColFiltered('is_active') || sortField==='is_active'){
                        renderRows(applyGroup(applySort(applyFilters(allData))));
                    }
                });
            });
            activeCb.addEventListener('click',function(e){e.stopPropagation();});
            activeTd.appendChild(activeCb);

            /* categories */
            var catTd=document.createElement('td'); catTd.className='col-cat';
            if(v.categories&&v.categories.length){
                catTd.innerHTML='<div class="cat-wrap">'+v.categories.map(function(c){return '<span class="pv-cat-tag">'+esc(c)+'</span>';}).join('')+'</div>';
            } else { catTd.textContent='—'; catTd.style.color='#9ca3af'; }

            /* labels */
            var labelsTd=document.createElement('td'); labelsTd.className='col-labels';
            if(v.labels&&v.labels.length){
                labelsTd.innerHTML=v.labels.map(function(l){
                    return '<span class="app-label" style="--label-color:'+esc(l.color)+'">'+esc(l.name)+'</span>';
                }).join('');
            } else { labelsTd.textContent='—'; labelsTd.style.color='#9ca3af'; }

            /* dates */
            var datesTd=document.createElement('td'); datesTd.className='col-dates';
            datesTd.innerHTML='<div style="font-size:12px;color:#9ca3af;line-height:1.4;height:38px;display:flex;flex-direction:column;justify-content:center;overflow:hidden">'+
                '<div><span style="color:#374151;display:inline-block;margin-right:6px">Added:</span>'+esc(v.created_at||'—')+'</div>'+
                '<div><span style="color:#374151;display:inline-block;margin-right:6px">Updated:</span>'+esc(v.updated_at||'—')+'</div>'+
            '</div>';

            /* stock */
            var stockTd=document.createElement('td'); stockTd.className='col-stock';
            stockTd.textContent=v.stock!=null?v.stock:'—';
            if(!v.stock) stockTd.style.color='#9ca3af';

            [cbTd,photosTd,skuTd,nameTh,catTd,labelsTd,datesTd,activeTd,priceTd,stockTd].forEach(function(cell){tr.appendChild(cell);});
            // Remember the current list URL (with filters/sort/pagination)
            // before navigating away — used by the product change_form to
            // restore the same view on Save/Cancel/Breadcrumb-back.
            function rememberBack(){
                document.cookie = 'drops_back=' + encodeURIComponent(location.href) +
                                  '; path=/admin/; max-age=600; SameSite=Lax';
            }
            tr.addEventListener('click',function(e){
                if(e.button!==0) return;
                if(e.target.type==='checkbox'||e.target.tagName==='A'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON') return;
                rememberBack();
                window.location.href=editUrl;
            });
            // Also catch direct anchor clicks (the .col-name <a>).
            var nameLink = nameTh.querySelector('a');
            if (nameLink) nameLink.addEventListener('click', rememberBack);
            return tr;
        }
    }

    /* Delegated change listener: keep SEL in sync with row checkboxes. */
    dsTable.addEventListener('change',function(e){
        var cb=e.target;
        if(!cb.classList||!cb.classList.contains('ds-cb')) return;
        if(cb.checked) SEL.add(String(cb.value)); else SEL.delete(String(cb.value));
        renderRows(currentFiltered);
        if(window._updateCounter) window._updateCounter();
    });

    /* Counter override — reports the full cross-page selection (SEL.size)
       out of the entire filtered dataset (currentFiltered.length). */
    function _installCounter(){
        var counter=document.querySelector('.cl-counter');
        if(!counter) return;
        // "Clear selection" — clears the whole cross-page selection (including
        // other pages).
        if(!document.getElementById('cl-clear-sel')){
            var clearBtn=document.createElement('a');
            clearBtn.href='#'; clearBtn.id='cl-clear-sel'; clearBtn.className='cl-top-btn';
            clearBtn.textContent='Clear selection';
            clearBtn.style.marginLeft='10px';
            clearBtn.style.setProperty('display','none','important');
            clearBtn.addEventListener('click',function(e){
                e.preventDefault();
                // Remove only the selection from OTHER pages, keeping the current page's selection.
                var pageIds=new Set(_pageSlice().map(function(v){return String(v.id);}));
                Array.from(SEL).forEach(function(id){ if(!pageIds.has(id)) SEL.delete(id); });
                renderRows(currentFiltered);
                if(window._updateCounter) window._updateCounter();
            });
            counter.insertAdjacentElement('afterend', clearBtn);
        }
        window._updateCounter=function(){
            var total = Math.max((currentFiltered && currentFiltered.length) || 0, SEL.size);
            counter.textContent='Selected: '+SEL.size+' of '+total;
            // "Clear selection" — only when there is a selection from OTHER pages
            // (outside the current one).
            // .cl-top-btn has display:inline-flex !important — hide it with !important too.
            var pageIds=_pageSlice().map(function(v){return String(v.id);});
            var onPage=pageIds.filter(function(id){return SEL.has(id);}).length;
            var offPage=SEL.size-onPage;
            var cb=document.getElementById('cl-clear-sel');
            if(cb){ if(offPage>0) cb.style.removeProperty('display'); else cb.style.setProperty('display','none','important'); }
        };
        window._updateCounter();
        /* cl-bar is built by base_site on DOMContentLoaded - later than our synchronous
           initial updateTable(). So we draw the reset-filters button here, when the bar is already
           in the DOM (otherwise a persisted filter after F5 doesn't show it).
         */
        _renderResetBtn();
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', _installCounter);
    } else {
        _installCounter();
    }

    updateTable({preservePage: true});  // first render — keep page from localStorage
})();
</script>
{% endblock %}
