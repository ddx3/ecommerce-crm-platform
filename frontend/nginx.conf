# ── HTTP :80 — Let's Encrypt ACME checks + redirect to HTTPS ──
server {
    listen 80;
    server_name magiyaroslyn.com www.magiyaroslyn.com;

# Webroot for renewing the Let's Encrypt certificate without stopping nginx
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

# Everything else goes to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — main site ──
server {
    listen 443 ssl;
    http2 on;
    server_name magiyaroslyn.com www.magiyaroslyn.com;

    ssl_certificate     /etc/letsencrypt/live/magiyaroslyn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magiyaroslyn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

# The canonical domain is without www. www duplicates → 301 (SEO: one URL per page).
    if ($host = www.magiyaroslyn.com) {
        return 301 https://magiyaroslyn.com$request_uri;
    }

# Upload limit matches DATA_UPLOAD_MAX_MEMORY_SIZE (25 MB)
    client_max_body_size 25M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

# Django static files (admin, summernote) — collected by collectstatic
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

# Paid course videos are NOT served as static files: the names are predictable
    # (poster-01.jpg is public → lesson-01.mp4 can be guessed), so direct /media/
    # was a paywall bypass. Now only via /api/courses/video/<token>/,
    # which checks CoursePurchase and does an X-Accel-Redirect here ↓
    location ^~ /media/courses/lessons/ {
        return 404;
    }

# Internal location for X-Accel-Redirect from Django. `internal` = not reachable
    # directly from outside; nginx serves the bytes (sendfile + Range), not Django.
    location /protected-media/ {
        internal;
        alias /var/www/media/;
        access_log off;
    }

# Uploaded files (product photos, etc.) — names are content-unique
    # (Django adds a suffix on collision), so a long immutable cache is fine.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

# Chat WebSocket
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

# Backend: API, admin, summernote
    # The admin is separate from the API: videos of lessons (tens and hundreds of MB) are uploaded
    # in the course form, and the shared 25M limit cut off the submit — in production the course
    # simply was not saved, and all the other form edits were lost together with the videos.
    # ^~ — so that this prefix wins over the regex block below.
    location ^~ /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
# Uploading a large video takes longer than a minute — otherwise 504 in the middle of the
        # file.
        proxy_request_buffering on;
        client_body_timeout 600s;
        client_max_body_size 1024M;
    }

    location ~ ^/(api|summernote)/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
# LLM buttons in the admin (description/bundle generation) can take
        # 40–120s to compute — nginx's default 60s would cut them off with a 504. The CLI has its
        # own 180s limit.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

# Content-hashed Vite bundles (dist/assets/*) — a new name on every code change,
    # so immutable/1y is safe. index.html stays in location / (revalidated).
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

# Icons/manifest in the dist root — static. Without this block they fall into the
    # shell proxy (location /) and return 404. robots.txt/sitemap.xml do NOT get here
    # (Django serves them), because we match only specific names.
    location ~* ^/(favicon\.ico|favicon-\d+x\d+\.png|apple-touch-icon\.png|site\.webmanifest|icons\.svg)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        types {
            image/x-icon              ico;
            image/png                 png;
            image/svg+xml             svg;
            application/manifest+json webmanifest;
        }
        expires 30d;
        access_log off;
    }

# Navigational HTML pages of the frontend → Django shell view: it serves index.html
    # with an injected SEO <head> (title/meta/OG/JSON-LD) and the correct status (404
    # for missing products). robots.txt and sitemap.xml are also served by web from here.
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
# If web is unavailable — serve the static SPA (without a unique head),
        # so the site does not go down. Django 404 (missing product) is NOT intercepted — it
        # must reach the client with its own status.
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa_fallback;
# Do NOT cache index.html in the browser — after a deploy the asset hashes are different.
        add_header Cache-Control "no-cache" always;
    }

# Fallback if the backend is down: the static SPA shell.
    location @spa_fallback {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }
}
