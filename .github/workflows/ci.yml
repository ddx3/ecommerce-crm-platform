name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.13 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shop_ci
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-secret
      DB_ENGINE: postgresql
      DB_NAME: shop_ci
      DB_USER: shop
      DB_PASSWORD: shop
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: System check
        run: python manage.py check
      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test --noinput

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
